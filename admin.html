<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; border-radius: 20px; padding: 40px 35px; width: 100%; max-width: 390px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-icon { width: 60px; height: 60px; background: #4f8ef7; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 26px; color: white; }
        .login-header h2 { font-size: 20px; } .login-header p { color: #888; font-size: 13px; }
        .erro { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; display: none; }
        .erro.show { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; }
        .input-box { position: relative; } .input-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #999; }
        .form-group input { width: 100%; padding: 14px 14px 14px 42px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #4f8ef7; }
        .btn-login { width: 100%; padding: 15px; background: #4f8ef7; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #3b7de6; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
        .footer a { color: #4f8ef7; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-header"><div class="login-icon"><i class="fas fa-lock"></i></div><h2>Área Técnica</h2><p>Acesso restrito</p></div>
    <div id="erroLogin" class="erro"></div>
    <form onsubmit="login(event)">
        <div class="form-group"><label>Usuário</label><div class="input-box"><i class="fas fa-user"></i><input type="text" id="usuario" required></div></div>
        <div class="form-group"><label>Senha</label><div class="input-box"><i class="fas fa-key"></i><input type="password" id="senha" required></div></div>
        <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Entrar</button>
    </form>
    <div class="footer"><p>← <a href="index.html">Área do Usuário</a></p></div>
</div>

<script>
const fc = { apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE", authDomain: "helphosp.firebaseapp.com", projectId: "helphosp", storageBucket: "helphosp.firebasestorage.app", messagingSenderId: "1075623193163", appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce" };
firebase.initializeApp(fc); const db = firebase.firestore();

// Criar admin se não existir
db.collection('usuarios').where('usuario', '==', 'jeconias').get().then(function(s) {
    if (s.empty) db.collection('usuarios').add({ nome: 'Jeconias Rocha', usuario: 'jeconias', senha: 'Parana2026', cargo: 'Coordenador TI', tipo: 'admin', whatsapp: '82981845421', status: 'ativo', primeiro_acesso: false, data_criacao: new Date().toISOString() });
});

function login(e) {
    e.preventDefault();
    var u = document.getElementById('usuario').value.toLowerCase().trim();
    var s = document.getElementById('senha').value;
    var err = document.getElementById('erroLogin');
    err.classList.remove('show');
    
    db.collection('usuarios').where('usuario', '==', u).get().then(function(snap) {
        if (snap.empty) { err.textContent = 'Usuário não encontrado!'; err.classList.add('show'); return; }
        var doc = snap.docs[0], user = doc.data();
        if (user.senha !== s) { err.textContent = 'Senha incorreta!'; err.classList.add('show'); return; }
        if (user.status !== 'ativo') { err.textContent = 'Usuário inativo!'; err.classList.add('show'); return; }
        
        localStorage.setItem('usuario_logado', JSON.stringify({ id: doc.id, nome: user.nome, usuario: user.usuario, cargo: user.cargo, tipo: user.tipo }));
        
        if (user.primeiro_acesso) { window.location.href = 'trocar-senha.html?id=' + doc.id; }
        else { window.location.href = 'dashboard.html'; }
    }).catch(function() { err.textContent = 'Erro de conexão!'; err.classList.add('show'); });
}
</script>
</body>
</html>
