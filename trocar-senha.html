<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Primeiro Acesso</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --azul-escuro: #06224a;
            --dourado: #c8a94a;
            --branco: #ffffff;
            --cinza-claro: #c9d2df;
            --cinza-medio: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--azul-escuro);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            border: 2px solid var(--dourado);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            background: rgba(200,169,74,0.08);
            font-size: 32px;
            color: var(--dourado);
        }

        h2 {
            color: var(--azul-escuro);
            margin-bottom: 8px;
            font-size: 22px;
        }

        p {
            color: var(--cinza-medio);
            margin-bottom: 24px;
            font-size: 13px;
        }

        .erro {
            background: rgba(231,76,60,0.1);
            color: #e74c3c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            display: none;
        }

        .erro.show { display: block; }

        .sucesso {
            background: rgba(46,204,113,0.1);
            color: #27ae60;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            display: none;
        }

        .sucesso.show { display: block; }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--azul-escuro);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dourado);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--dourado);
            box-shadow: 0 0 0 3px rgba(200,169,74,0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0d3d75, #06224a);
            color: white;
            border: 1px solid rgba(200,169,74,0.3);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0f4d8a, #0a3055);
            border-color: var(--dourado);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(200,169,74,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--cinza-medio);
            text-decoration: none;
            font-size: 12px;
            margin-top: 20px;
            transition: color 0.3s;
        }

        .voltar:hover {
            color: var(--dourado);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h2>🔐 Primeiro Acesso</h2>
        <p>Crie sua senha pessoal para acessar o sistema</p>
        
        <div class="erro" id="erroMsg"></div>
        <div class="sucesso" id="sucessoMsg"></div>
        
        <form onsubmit="trocarSenha(event)" id="formTroca">
            <div class="form-group">
                <label>Nova Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input type="password" id="novaSenha" required minlength="8" placeholder="Mínimo 8 caracteres">
                </div>
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmarSenha" required minlength="8" placeholder="Repita a senha">
                </div>
            </div>
            <button type="submit" class="btn" id="btnSalvar">
                <i class="fas fa-save"></i> &nbsp;Salvar Senha
            </button>
        </form>
        
        <a href="admin.html" class="voltar">
            <i class="fas fa-arrow-left"></i> Voltar para o login
        </a>
    </div>

    <script>
        const fc = {
            apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
            authDomain: "helphosp.firebaseapp.com",
            projectId: "helphosp",
            storageBucket: "helphosp.firebasestorage.app",
            messagingSenderId: "1075623193163",
            appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
        };
        firebase.initializeApp(fc);
        const db = firebase.firestore();

        // Pegar ID do usuário da URL
        var params = new URLSearchParams(window.location.search);
        var userId = params.get('id');

        if (!userId) {
            mostrarErro('ID do usuário não encontrado! Redirecionando...');
            setTimeout(function() {
                window.location.href = 'admin.html';
            }, 3000);
        }

        function trocarSenha(e) {
            e.preventDefault();
            
            var senha1 = document.getElementById('novaSenha').value;
            var senha2 = document.getElementById('confirmarSenha').value;
            var btn = document.getElementById('btnSalvar');
            
            // Validar senhas
            if (senha1 !== senha2) {
                mostrarErro('As senhas não conferem!');
                return;
            }
            
            if (senha1.length < 8) {
                mostrarErro('A senha deve ter no mínimo 8 caracteres!');
                return;
            }
            
            // Desabilitar botão
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner"></span> Salvando...';
            
            // Atualizar no Firestore
            db.collection('usuarios').doc(userId).update({
                senha: senha1,
                primeiro_acesso: false
            })
            .then(function() {
                mostrarSucesso('Senha alterada com sucesso! Redirecionando...');
                
                // Atualizar localStorage
                var usuarioLogado = JSON.parse(localStorage.getItem('usuario_logado'));
                if (usuarioLogado && usuarioLogado.id === userId) {
                    usuarioLogado.primeiro_acesso = false;
                    localStorage.setItem('usuario_logado', JSON.stringify(usuarioLogado));
                }
                
                // Redirecionar após 2 segundos
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 2000);
            })
            .catch(function(error) {
                console.error('Erro:', error);
                mostrarErro('Erro ao salvar senha: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> &nbsp;Salvar Senha';
            });
        }

        function mostrarErro(msg) {
            var erroDiv = document.getElementById('erroMsg');
            var sucessoDiv = document.getElementById('sucessoMsg');
            erroDiv.textContent = msg;
            erroDiv.classList.add('show');
            sucessoDiv.classList.remove('show');
            
            setTimeout(function() {
                erroDiv.classList.remove('show');
            }, 5000);
        }

        function mostrarSucesso(msg) {
            var erroDiv = document.getElementById('erroMsg');
            var sucessoDiv = document.getElementById('sucessoMsg');
            sucessoDiv.textContent = msg;
            sucessoDiv.classList.add('show');
            erroDiv.classList.remove('show');
        }

        // Limpar mensagens ao digitar
        document.getElementById('novaSenha').addEventListener('input', function() {
            document.getElementById('erroMsg').classList.remove('show');
        });
        
        document.getElementById('confirmarSenha').addEventListener('input', function() {
            document.getElementById('erroMsg').classList.remove('show');
        });
    </script>
</body>
</html>
