<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a6b"/>
      <stop offset="0.55" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#081a30"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fa8ff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.65">
      <stop offset="0" stop-color="#2f6fed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2f6fed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- grade tecnológica sutil -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="2">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>

  <!-- anel externo -->
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#2f6fed" stroke-opacity="0.4" stroke-width="7"/>

  <!-- arco do headset -->
  <path d="M136 258 C136 165 189 100 256 100 C323 100 376 165 376 258"
        fill="none" stroke="url(#metal)" stroke-width="26" stroke-linecap="round"/>

  <!-- almofadas do headset -->
  <rect x="104" y="236" width="58" height="104" rx="26" fill="url(#metal)"/>
  <rect x="350" y="236" width="58" height="104" rx="26" fill="url(#metal)"/>
  <rect x="118" y="252" width="30" height="72" rx="14" fill="#0b2340" fill-opacity="0.35"/>
  <rect x="364" y="252" width="30" height="72" rx="14" fill="#0b2340" fill-opacity="0.35"/>

  <!-- microfone -->
  <path d="M133 318 C120 318 110 328 110 341 C110 366 130 384 156 384 H190"
        fill="none" stroke="url(#metal)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="190" cy="384" r="13" fill="url(#metal)"/>

  <!-- ticket de chamado -->
  <g transform="translate(238,272)">
    <path d="M0 18 a18 18 0 0 1 18 -18 H150 a18 18 0 0 1 18 18 V30
             a16 16 0 0 0 0 32 V80 a18 18 0 0 1 -18 18 H18
             a18 18 0 0 1 -18 -18 V62 a16 16 0 0 0 0 -32 Z"
          fill="url(#ticket)" stroke="#0b2340" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M40 0 V98" stroke="#9db8e8" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M68 46 L86 64 L118 28" fill="none" stroke="#16a34a" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ponto de status -->
  <circle cx="400" cy="400" r="30" fill="#16a34a" stroke="#081a30" stroke-width="11"/>
</svg>
