<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel TV</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; min-height: 100vh; overflow: hidden; font-size: 18px; }
        .tv-header { background: #111; padding: 20px 25px; text-align: center; border-bottom: 3px solid #0f0; }
        .tv-header h1 { font-size: 38px; letter-spacing: 5px; }
        .tv-header .depto-badge { display: inline-block; background: #0f0; color: #000; padding: 6px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; margin-top: 8px; }
        .tv-header .hora-atual { color: #0f0; font-size: 20px; margin-top: 6px; letter-spacing: 2px; }
        .tv-header .voz-status { font-size: 10px; margin-top: 4px; }
        .tv-header .voz-status.on { color: #0f0; }
        .tv-header .voz-status.off { color: #f00; }
        .tv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; height: calc(100vh - 180px); }
        .tv-column { background: #0a0a0a; border: 2px solid #1a1a1a; border-radius: 10px; padding: 16px; overflow-y: auto; }
        .tv-column h2 { font-size: 22px; border-bottom: 2px solid #1a3a1a; padding-bottom: 10px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
        .tv-chamado { background: #111; border: 2px solid #0f0; padding: 14px; margin-bottom: 10px; border-radius: 8px; font-size: 15px; transition: all 0.3s; }
        .tv-chamado.critical { border-color: #f00; color: #f00; animation: pulse 1s infinite; background: #1a0000; border-width: 3px; }
        .tv-chamado.high { border-color: #ff0; color: #ff0; background: #1a1a00; border-width: 3px; }
        .tv-chamado.atrasado { border-color: #f00; animation: piscaAtraso 0.8s infinite; border-width: 3px; }
        @keyframes piscaAtraso { 0%,100% { background: #1a0000; box-shadow: 0 0 8px rgba(255,0,0,0.4); } 50% { background: #2a0000; box-shadow: 0 0 25px rgba(255,0,0,0.8); } }
        .badge-atraso { display: inline-block; background: #f00; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: bold; animation: piscaBadge 0.6s infinite; margin-left: 8px; }
        @keyframes piscaBadge { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.1); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .tv-chamado .protocolo { font-size: 11px; color: #666; }
        .tv-chamado .titulo { font-size: 18px; font-weight: bold; margin: 4px 0; }
        .tv-chamado .info { font-size: 11px; color: #888; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
        .tv-chamado .setor { display: inline-block; background: #1a3a1a; padding: 3px 8px; border-radius: 5px; font-size: 10px; }
        .tv-empty { text-align: center; padding: 40px; color: #333; font-size: 18px; }
        .contador { font-size: 13px; color: #666; text-align: center; margin-bottom: 10px; }
        .contador.atrasados { color: #f00; font-weight: bold; animation: piscaBadge 0.6s infinite; display: none; font-size: 16px; }
        .btn-voz { position: fixed; bottom: 15px; right: 15px; z-index: 100; background: #111; border: 1px solid #0f0; color: #0f0; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 12px; }
        .btn-voz:hover { background: #0f0; color: #000; }
        .btn-voz.muted { border-color: #f00; color: #f00; }
        .tv-column::-webkit-scrollbar { width: 6px; }
        .tv-column::-webkit-scrollbar-track { background: #000; }
        .tv-column::-webkit-scrollbar-thumb { background: #0f0; border-radius: 3px; }
        @media (max-width: 1024px) { .tv-grid { grid-template-columns: 1fr; } .tv-header h1 { font-size: 28px; } }
    </style>
</head>
<body>

<div class="tv-header">
    <h1>🏥 HelpHosp TV</h1>
    <div class="depto-badge" id="deptoBadge">CARREGANDO...</div>
    <div class="hora-atual" id="horaAtual"></div>
    <div class="voz-status on" id="vozStatus">🔊 Voz ativada - Clique na tela para liberar áudio</div>
</div>

<div class="tv-grid">
    <div class="tv-column">
        <h2>⏳ PENDENTES</h2>
        <div class="contador" id="contadorPendentes">0 chamado(s)</div>
        <div class="contador atrasados" id="contadorAtrasados"></div>
        <div id="listaPendentes"><div class="tv-empty"><i class="fas fa-spinner fa-spin"></i>Carregando...</div></div>
    </div>
    <div class="tv-column">
        <h2>✅ CONCLUÍDOS HOJE</h2>
        <div class="contador" id="contadorConcluidos">0 chamado(s)</div>
        <div id="listaConcluidos"><div class="tv-empty"><i class="fas fa-spinner fa-spin"></i>Carregando...</div></div>
    </div>
</div>

<button class="btn-voz" id="btnVoz" onclick="toggleVoz()">🔊 Voz</button>

<script>
// ============================================
// FIREBASE
// ============================================
const firebaseConfig = {
    apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
    authDomain: "helphosp.firebaseapp.com",
    projectId: "helphosp",
    storageBucket: "helphosp.firebasestorage.app",
    messagingSenderId: "1075623193163",
    appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ============================================
// CONFIGURAÇÕES
// ============================================
const urlParams = new URLSearchParams(window.location.search);
const departamentoTV = urlParams.get('dep') || 'TI';
const nomeDepartamento = departamentoTV === 'TI' ? 'TECNOLOGIA DA INFORMAÇÃO' : 
                         departamentoTV === 'MANUTENCAO' ? 'MANUTENÇÃO' : departamentoTV;
document.getElementById('deptoBadge').textContent = '📺 ' + nomeDepartamento;
document.title = 'TV - ' + nomeDepartamento;

// ============================================
// VOZ (SpeechSynthesis)
// ============================================
let vozAtivada = true;
const sintese = window.speechSynthesis;

// Carregar vozes
let vozesDisponiveis = [];
sintese.onvoiceschanged = () => {
    vozesDisponiveis = sintese.getVoices();
};

function toggleVoz() {
    vozAtivada = !vozAtivada;
    const btn = document.getElementById('btnVoz');
    const status = document.getElementById('vozStatus');
    if (vozAtivada) {
        btn.textContent = '🔊 Voz'; btn.classList.remove('muted');
        status.textContent = '🔊 Voz ativada'; status.className = 'voz-status on';
    } else {
        btn.textContent = '🔇 Mudo'; btn.classList.add('muted');
        status.textContent = '🔇 Voz desativada'; status.className = 'voz-status off';
        sintese.cancel();
    }
}

function falar(texto) {
    if (!vozAtivada) return;
    
    // Cancelar fala anterior
    sintese.cancel();
    
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'pt-BR';
    utterance.rate = 0.85;  // Um pouco mais lento para clareza
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    
    // Tentar usar voz feminina em português
    const vozPt = vozesDisponiveis.find(v => v.lang.includes('pt-BR'));
    if (vozPt) utterance.voice = vozPt;
    
    sintese.speak(utterance);
}

function anunciarNovoChamado(chamado) {
    const p = chamado.prioridade || 'Normal';
    let texto;
    
    if (p === 'Crítica') {
        texto = `Atenção! Chamado crítico! ${chamado.titulo}. Setor ${chamado.setor}. Solicitante ${chamado.solicitante}.`;
    } else if (p === 'Alta') {
        texto = `Novo chamado de alta prioridade. ${chamado.titulo}. Setor ${chamado.setor}.`;
    } else {
        texto = `Novo chamado. ${chamado.titulo}. Setor ${chamado.setor}.`;
    }
    
    falar(texto);
}

// ============================================
// SOM DE ALERTA (bip)
// ============================================
let audioContext = null;
function initAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
}
document.addEventListener('click', initAudio, { once: true });

function tocarBip(tipo) {
    if (!audioContext) initAudio();
    if (!audioContext || audioContext.state === 'suspended') return;
    try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain); gain.connect(audioContext.destination);
        if (tipo === 'critico') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.setValueAtTime(900, now + 0.15);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        } else if (tipo === 'atrasado') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
            osc.start(now); osc.stop(now + 0.7);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        }
    } catch(e) {}
}

// ============================================
// SLA
// ============================================
const SLA_TEMPOS = { 'Crítica': 3600000, 'Alta': 14400000, 'Média': 86400000, 'Baixa': 172800000 };
function getSLAStatus(c) {
    if (c.status === 'Concluído') return 'ok';
    const abertura = c.data_abertura?.toDate ? c.data_abertura.toDate() : new Date(c.data_abertura);
    if (isNaN(abertura.getTime())) return 'ok';
    return (new Date() - abertura) > (SLA_TEMPOS[c.prioridade] || 86400000) ? 'atrasado' : 'ok';
}
function getTempoAtraso(c) {
    const abertura = c.data_abertura?.toDate ? c.data_abertura.toDate() : new Date(c.data_abertura);
    const atraso = (new Date() - abertura) - (SLA_TEMPOS[c.prioridade] || 86400000);
    if (atraso <= 0) return '';
    const h = Math.floor(atraso / 3600000), m = Math.floor((atraso % 3600000) / 60000);
    if (h > 24) { const d = Math.floor(h / 24); return `⚠️ ${d}d ${h % 24}h`; }
    return h > 0 ? `⚠️ ${h}h ${m}min` : `⚠️ ${m}min`;
}

// ============================================
// RELÓGIO
// ============================================
function atualizarRelogio() {
    document.getElementById('horaAtual').textContent = new Date().toLocaleString('pt-BR', { 
        weekday: 'long', day: '2-digit', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit' 
    });
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

// ============================================
// FUNÇÕES
// ============================================
function fmtHora(d) {
    if (!d) return '--:--';
    try { return (d?.toDate ? d.toDate() : new Date(d)).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
    catch(e) { return '--:--'; }
}
function getClassePrioridade(p) { if (p === 'Crítica') return 'critical'; if (p === 'Alta') return 'high'; return ''; }

function renderCard(c, concluido = false) {
    if (concluido) {
        return `<div class="tv-chamado" style="border-color:#0a0;color:#0a0;background:#0a0a0a;">
            <div class="protocolo">📋 ${c.protocolo||'—'}</div><div class="titulo">✅ ${c.titulo||'Sem título'}</div>
            <div class="info"><span class="setor">📍 ${c.setor||'—'}</span><span>🕐 ${fmtHora(c.data_abertura)}</span><span>👤 ${c.solicitante||'—'}</span>${c.tecnico?`<span>🔧 ${c.tecnico}</span>`:''}</div></div>`;
    }
    const atraso = getTempoAtraso(c), sla = getSLAStatus(c);
    return `<div class="tv-chamado ${getClassePrioridade(c.prioridade)} ${sla==='atrasado'?'atrasado':''}">
        <div class="protocolo">📋 ${c.protocolo||'—'}</div>
        <div class="titulo">${sla==='atrasado'?'🚨 ':''}${c.titulo||'Sem título'}${atraso?`<span class="badge-atraso">${atraso}</span>`:''}</div>
        <div class="info"><span class="setor">📍 ${c.setor||'—'}</span><span>⚡ ${c.prioridade||'—'}</span><span>🕐 ${fmtHora(c.data_abertura)}</span><span>👤 ${c.solicitante||'—'}</span>${c.tecnico?`<span>🔧 ${c.tecnico}</span>`:''}</div></div>`;
}

// ============================================
// CARREGAR CHAMADOS
// ============================================
let chamadosAnteriores = new Set();
let primeiraCarga = true;

function carregarChamados() {
    console.log('🔄 Buscando...');
    db.collection('chamados').onSnapshot(snap => {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const pendentes = [], concluidos = [];
        const idsAtuais = new Set(); let atrasados = 0;
        
        snap.forEach(doc => {
            const c = doc.data(); c.id = doc.id;
            if (c.departamento !== departamentoTV) return;
            idsAtuais.add(c.id);
            const dc = c.data_abertura?.toDate ? c.data_abertura.toDate() : new Date(c.data_abertura);
            
            if (c.status === 'Concluído') { if (dc >= hoje) concluidos.push(c); }
            else {
                pendentes.push(c);
                if (getSLAStatus(c) === 'atrasado') atrasados++;
                
                // 🔥 NOVO CHAMADO: Bip + Voz
                if (!primeiraCarga && !chamadosAnteriores.has(c.id)) {
                    console.log('🆕 Novo:', c.titulo);
                    tocarBip(c.prioridade === 'Crítica' ? 'critico' : c.prioridade === 'Alta' ? 'critico' : 'normal');
                    // Voz após 500ms
                    setTimeout(() => anunciarNovoChamado(c), 500);
                }
            }
        });
        
        if (atrasados > 0 && !primeiraCarga) tocarBip('atrasado');
        
        chamadosAnteriores = idsAtuais; primeiraCarga = false;
        
        pendentes.sort((a, b) => {
            const sa = getSLAStatus(a)==='atrasado'?-1:0, sb = getSLAStatus(b)==='atrasado'?-1:0;
            if (sa !== sb) return sa - sb;
            return ({'Crítica':0,'Alta':1,'Média':2,'Baixa':3}[a.prioridade]||2) - ({'Crítica':0,'Alta':1,'Média':2,'Baixa':3}[b.prioridade]||2);
        });
        
        document.getElementById('contadorPendentes').textContent = pendentes.length + ' pendente(s)';
        const ca = document.getElementById('contadorAtrasados');
        ca.style.display = atrasados > 0 ? 'block' : 'none';
        if (atrasados > 0) ca.textContent = '🚨 ' + atrasados + ' ATRASADO(S)!';
        document.getElementById('contadorConcluidos').textContent = concluidos.length + ' concluído(s) hoje';
        
        document.getElementById('listaPendentes').innerHTML = pendentes.length === 0 ? '<div class="tv-empty">✅ Nenhum pendente!</div>' : pendentes.map(c => renderCard(c)).join('');
        document.getElementById('listaConcluidos').innerHTML = concluidos.length === 0 ? '<div class="tv-empty">📭 Nenhum concluído</div>' : concluidos.map(c => renderCard(c, true)).join('');
    });
}

// ============================================
// INICIAR
// ============================================
console.log('🚀 TV iniciada');
carregarChamados();
</script>
</body>
</html>
