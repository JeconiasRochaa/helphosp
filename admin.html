<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #e8f0fe, #d4e4fc, #e0f0e8, #f0f4e8); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: white; border-radius: 30px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); overflow: hidden; animation: fadeIn 0.6s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { background: linear-gradient(135deg, #0B3B5C, #1a5a7a, #0B3B5C); padding: 35px 30px; text-align: center; color: white; }
        .login-logo { width: 65px; height: 65px; background: rgba(255,255,255,0.15); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; color: #00C9B7; border: 2px solid rgba(255,255,255,0.2); }
        .login-header h1 { font-size: 24px; font-weight: 700; } .login-header p { font-size: 12px; opacity: 0.8; margin-top: 3px; }
        .login-body { padding: 30px 35px 25px; }
        .login-body h2 { text-align: center; font-size: 17px; color: #1a1a2e; margin-bottom: 5px; }
        .sub { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
        .erro { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 10px; margin-bottom: 18px; font-size: 13px; display: none; text-align: center; }
        .erro.show { display: block; }
        .form-group { margin-bottom: 16px; } .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #333; }
        .input-wrapper { position: relative; } .input-icon { position: absolute; left: 0; top: 0; width: 46px; height: 100%; background: #f5f7fa; border-radius: 10px 0 0 10px; display: flex; align-items: center; justify-content: center; color: #0B3B5C; border: 2px solid #e5e7eb; border-right: none; }
        .form-group input { width: 100%; padding: 13px 13px 13px 58px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 14px; font-family: inherit; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: #0B3B5C; box-shadow: 0 0 0 3px rgba(11,59,92,0.08); }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #0B3B5C, #1a5a7a); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-login:hover { transform: translateY(-2px); }
        .login-footer { text-align: center; padding: 0 35px 25px; font-size: 11px; color: #999; } .login-footer a { color: #0B3B5C; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <div class="login-logo"><i class="fas fa-laptop-medical"></i></div>
        <h1>HelpHosp</h1>
        <p>Sistema de Chamados Hospitalar</p>
    </div>
    <div class="login-body">
        <h2>Bem-vindo(a)!</h2>
        <p class="sub">Informe suas credenciais para acessar</p>
        <div id="erroLogin" class="erro"></div>
        <form onsubmit="login(event)">
            <div class="form-group"><label>Usuário</label><div class="input-wrapper"><div class="input-icon"><i class="fas fa-user"></i></div><input type="text" id="usuario" placeholder="Digite seu usuário" required></div></div>
            <div class="form-group"><label>Senha</label><div class="input-wrapper"><div class="input-icon"><i class="fas fa-lock"></i></div><input type="password" id="senha" placeholder="Digite sua senha" required></div></div>
            <button type="submit" class="btn-login">Enviar</button>
        </form>
    </div>
    <div class="login-footer"><p>← <a href="index.html">Voltar para área do usuário</a></p></div>
</div>

<script>
const fc = { apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE", authDomain: "helphosp.firebaseapp.com", projectId: "helphosp", storageBucket: "helphosp.firebasestorage.app", messagingSenderId: "1075623193163", appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce" };
firebase.initializeApp(fc); const db = firebase.firestore();

// ========== FUNÇÃO DE HASH SHA-256 ==========
async function hashSenha(senha) {
    const encoder = new TextEncoder();
    const data = encoder.encode(senha + 'HelpHosp_Salt_2024_Seguro');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
}

// ========== CRIAR ADMIN COM SENHA HASH ==========
// Execute APENAS UMA VEZ para criar o admin
async function criarAdminInicial() {
    const snapshot = await db.collection('usuarios').where('usuario', '==', 'jeconias').get();
    if (snapshot.empty) {
        const senhaHash = await hashSenha('Parana2026');
        await db.collection('usuarios').add({
            nome: 'Jeconias Rocha',
            usuario: 'jeconias',
            senha_hash: senhaHash,
            cargo: 'Coordenador TI',
            departamento: 'TI',
            tipo: 'admin',
            whatsapp: '82981845421',
            status: 'ativo',
            primeiro_acesso: false,
            data_criacao: new Date().toISOString()
        });
        console.log('✅ Admin criado com senha hash!');
    } else {
        console.log('✅ Admin já existe!');
    }
}

// Verificar se admin existe
criarAdminInicial();

// ========== LOGIN ==========
async function login(e) {
    e.preventDefault();
    
    const usuario = document.getElementById('usuario').value.toLowerCase().trim();
    const senha = document.getElementById('senha').value;
    const erroDiv = document.getElementById('erroLogin');
    erroDiv.classList.remove('show');

    if (!usuario || !senha) {
        erroDiv.textContent = 'Preencha todos os campos!';
        erroDiv.classList.add('show');
        return;
    }

    try {
        // Buscar usuário
        const snapshot = await db.collection('usuarios').where('usuario', '==', usuario).get();
        
        if (snapshot.empty) {
            erroDiv.textContent = 'Usuário ou senha inválidos!';
            erroDiv.classList.add('show');
            return;
        }

        const doc = snapshot.docs[0];
        const user = doc.data();

        if (user.status !== 'ativo') {
            erroDiv.textContent = 'Usuário inativo!';
            erroDiv.classList.add('show');
            return;
        }

        // Calcular hash da senha digitada
        const senhaDigitadaHash = await hashSenha(senha);

        // Comparar com o hash armazenado
        if (user.senha_hash !== senhaDigitadaHash) {
            erroDiv.textContent = 'Usuário ou senha inválidos!';
            erroDiv.classList.add('show');
            return;
        }

        // Login bem-sucedido
        localStorage.setItem('usuario_logado', JSON.stringify({
            id: doc.id,
            nome: user.nome,
            usuario: user.usuario,
            cargo: user.cargo,
            departamento: user.departamento || 'TI',
            tipo: user.tipo || 'tecnico',
            expira: Date.now() + (8 * 60 * 60 * 1000)
        }));

        if (user.primeiro_acesso) {
            window.location.href = 'trocar-senha.html?id=' + doc.id;
        } else {
            window.location.href = 'dashboard.html';
        }

    } catch (error) {
        console.error('Erro:', error);
        erroDiv.textContent = 'Erro de conexão!';
        erroDiv.classList.add('show');
    }
}
</script>
</body>
</html>
