<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel Técnico</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F0F4F8;
            --card: #FFFFFF;
            --sidebar: #06224a;
            --primary: #06224a;
            --gold: #c8a94a;
            --success: #38A169;
            --warning: #DD6B20;
            --danger: #E53E3E;
            --text: #1A202C;
            --border: #E2E8F0;
            --radius: 12px
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            font-size: 15px
        }

        .sidebar {
            width: 270px;
            min-width: 270px;
            background: var(--sidebar);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1)
        }

        .sidebar-header {
            text-align: center;
            padding: 10px 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 16px
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 10px;
            border: 2px solid rgba(200, 169, 74, 0.5);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(200, 169, 74, 0.08)
        }

        .logo i {
            font-size: 28px;
            color: var(--gold)
        }

        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 700
        }

        .help {
            color: #c9d2df
        }

        .hosp {
            color: #FFF
        }

        .subtitle {
            font-size: 8px;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px
        }

        .user-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--gold), #b8861e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff
        }

        .user-details h4 {
            font-size: 13px;
            color: #FFF
        }

        .user-details small {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5)
        }

        .nav-section {
            margin-bottom: 8px
        }

        .nav-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 4px;
            padding-left: 8px;
            font-weight: 700
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
            color: #CBD5E0;
            font-size: 13px
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #FFF
        }

        .nav-item.active {
            background: rgba(200, 169, 74, 0.15);
            color: #F6E05E
        }

        .nav-item i {
            width: 18px;
            text-align: center
        }

        .badge-notify {
            background: var(--danger);
            color: #fff;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            font-size: 10px;
            font-weight: 700;
            display: none;
            margin-left: auto
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08)
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px
        }

        .btn-logout:hover {
            background: rgba(229, 62, 62, 0.15);
            color: #FCA5A5
        }

        .main-content {
            margin-left: 270px;
            flex: 1;
            padding: 24px 28px;
            min-height: 100vh
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 700
        }

        .info-bar {
            background: linear-gradient(135deg, #06224a 0%, #1a3a5c 100%);
            color: white;
            padding: 16px 20px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 14px
        }

        .info-bar .info-item {
            text-align: center;
            min-width: 70px
        }

        .info-bar .info-val {
            font-size: 28px;
            font-weight: 700
        }

        .info-bar .info-lbl {
            font-size: 10px;
            opacity: 0.8;
            text-transform: uppercase
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px
        }

        .chart-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border)
        }

        .chart-card h3 {
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 600
        }

        .chart-card canvas {
            width: 100% !important;
            height: 200px !important;
            max-height: 200px !important
        }

        .table-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 14px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th {
            background: #F7FAFC;
            color: #4A5568;
            padding: 10px;
            text-align: left;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid #E2E8F0;
            white-space: nowrap
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid #EDF2F7;
            font-size: 12px
        }

        tr:nth-child(even) td {
            background: #FAFBFC
        }

        tr:hover td {
            background: #F0F4F8;
            cursor: pointer
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700
        }

        .badge-blue {
            background: #DBEAFE;
            color: #1D4ED8
        }

        .badge-green {
            background: #D1FAE5;
            color: #065F46
        }

        .badge-amber {
            background: #FEF3C7;
            color: #92400E
        }

        .badge-red {
            background: #FEE2E2;
            color: #991B1B
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px
        }

        .btn-primary {
            background: var(--primary);
            color: #fff
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #E2E8F0;
            color: #4A5568
        }

        .btn-danger {
            background: #FFF5F5;
            color: #E53E3E;
            border: 1px solid #FED7D7
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 5px
        }

        .filtros-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .filtros-bar select,
        .filtros-bar input {
            padding: 8px 10px;
            background: #FFF;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 12px;
            outline: none
        }

        .filtros-bar input {
            flex: 1;
            min-width: 140px
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 200;
            align-items: center;
            justify-content: center
        }

        .modal-overlay.ativa {
            display: flex
        }

        .modal-box {
            background: #FFF;
            border-radius: var(--radius);
            padding: 24px;
            width: 92%;
            max-width: 750px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15)
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #A0AEC0
        }

        .form-group {
            margin-bottom: 10px
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 3px;
            color: #4A5568;
            text-transform: uppercase
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 13px;
            outline: none
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #FFF;
            border-left: 4px solid #3182CE;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            z-index: 9999;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: toastIn 0.3s
        }

        .toast.error {
            border-left-color: #E53E3E
        }

        .toast.success {
            border-left-color: #38A169
        }

        @keyframes toastIn {
            from {
                transform: translateY(50px);
                opacity: 0
            }
            to {
                transform: translateY(0);
                opacity: 1
            }
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 110;
            background: var(--primary);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer
        }

        @media(max-width:1024px) {
            .sidebar {
                transform: translateX(-100%)
            }
            .sidebar.open {
                transform: translateX(0)
            }
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center
            }
            .main-content {
                margin-left: 0;
                padding: 14px;
                padding-top: 55px
            }
            .charts-grid {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:640px) {
            .form-row {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <i class="fas fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><i class="fas fa-hospital"></i></div>
            <h2><span class="help">Help</span><span class="hosp">Hosp</span></h2>
            <div class="subtitle">Painel Técnico</div>
        </div>
        <div class="user-box">
            <div class="user-avatar" id="userAvatar">T</div>
            <div class="user-details">
                <h4 id="userName">—</h4>
                <small id="userRole">—</small>
            </div>
        </div>
        <nav id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <div style="text-align:center;padding:60px;">
            <h3>🔄 Carregando...</h3>
        </div>
    </main>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
            authDomain: "helphosp.firebaseapp.com",
            projectId: "helphosp",
            storageBucket: "helphosp.firebasestorage.app",
            messagingSenderId: "1075623193163",
            appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Variáveis globais
        let setores = [];
        let departamentosChamados = ['TI', 'MANUTENCAO'];
        let usuarioLogado = null;
        let depto = 'TI';
        let nomeDepto = 'Tecnologia da Informação';
        let chamados = [];
        let inventario = [];
        let estoque = [];
        let movimentacoes = [];
        let charts = {};
        let comentarioChamadoId = null;

        // Funções utilitárias
        function toast(mensagem, tipo = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `<i class="fas fa-${tipo === 'success' ? 'check-circle' : tipo === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${mensagem}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function fmtData(data) {
            if (!data) return '—';
            try {
                const dt = data?.toDate ? data.toDate() : new Date(data);
                if (isNaN(dt.getTime())) return '—';
                return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '—';
            }
        }

        function fmtDataCurta(data) {
            if (!data) return '—';
            try {
                const dt = data?.toDate ? data.toDate() : new Date(data);
                if (isNaN(dt.getTime())) return '—';
                const agora = new Date();
                const diff = Math.floor((agora - dt) / 1000);
                if (diff < 60) return 'agora';
                if (diff < 3600) return Math.floor(diff / 60) + 'min';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h';
                return Math.floor(diff / 86400) + 'd';
            } catch (e) {
                return '—';
            }
        }

        function toDate(data) {
            if (!data) return new Date(0);
            return data?.toDate ? data.toDate() : new Date(data);
        }

        function sanitizar(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getStatusClass(status) {
            const classes = {
                'Concluído': 'badge-green',
                'Em Andamento': 'badge-amber',
                'Pendente': 'badge-red',
                'A Fazer': 'badge-blue'
            };
            return classes[status] || 'badge-blue';
        }

        function getPrioridadeClass(prioridade) {
            const classes = {
                'Baixa': 'badge-blue',
                'Média': 'badge-amber',
                'Alta': 'badge-red',
                'Crítica': 'badge-red'
            };
            return classes[prioridade] || 'badge-blue';
        }

        function abrirModal(conteudo, maxWidth = '750px') {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay ativa';
            modal.innerHTML = `<div class="modal-box" style="max-width:${maxWidth};">${conteudo}</div>`;
            document.body.appendChild(modal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
            return modal;
        }

        // Autenticação
        function checkAuth() {
            const userData = localStorage.getItem('usuario_logado');
            if (!userData) {
                window.location.href = 'admin.html';
                return false;
            }
            try {
                usuarioLogado = JSON.parse(userData);
                if (usuarioLogado.expira && Date.now() > usuarioLogado.expira) {
                    localStorage.removeItem('usuario_logado');
                    window.location.href = 'admin.html';
                    return false;
                }
                depto = usuarioLogado.departamento || 'TI';
                nomeDepto = depto === 'TI' ? 'Tecnologia da Informação' : 'Manutenção';
                return true;
            } catch (e) {
                localStorage.removeItem('usuario_logado');
                window.location.href = 'admin.html';
                return false;
            }
        }

        function getPerms() {
            const isAdmin = usuarioLogado.tipo === 'admin' || usuarioLogado.usuario === 'edson';
            return {
                isAdmin,
                isTI: depto === 'TI',
                isManut: depto === 'MANUTENCAO',
                podeEquipe: isAdmin || (depto === 'MANUTENCAO' && (usuarioLogado.usuario === 'bruno' || usuarioLogado.usuario === 'benicio'))
            };
        }

        function logout() {
            if (confirm('Deseja realmente sair?')) {
                localStorage.removeItem('usuario_logado');
                window.location.href = 'admin.html';
            }
        }

        // Carregar configurações
        async function loadConfig() {
            try {
                const docSetores = await db.collection('configuracoes').doc('setores').get();
                if (docSetores.exists && docSetores.data().setores) {
                    setores = docSetores.data().setores;
                } else {
                    setores = ['Administração', 'Almoxarifado', 'CAF Principal', 'CAF CR', 'Centro Cirúrgico',
                        'Clínica Cirurgica', 'Clínica Médica I', 'Clínica Médica II', 'Comunicação',
                        'Direção Administrativa', 'Direção Enfermagem', 'Direção geral', 'Direção Medica',
                        'Emergência/Vermelha', 'Engenharia Clinica', 'Farmácia', 'Faturamento',
                        'Fisioterapia', 'Hotelaria', 'Juridico', 'Laboratório', 'Manutenção', 'NIR',
                        'Nutrição', 'Oncologia I', 'Oncologia II', 'Outros', 'Ouvidoria', 'Patrimonio',
                        'Pediatria', 'Psicologia', 'RH', 'Raio-X', 'Recepção CR', 'Recepção Geral',
                        'Recepção Nefrologia', 'Same', 'Serviço Social', 'Sesmt', 'Telemedicina', 'TI',
                        'Tomografia', 'UTI I', 'UTI II'
                    ];
                }

                const docDeptos = await db.collection('configuracoes').doc('departamentos_chamados').get();
                if (docDeptos.exists && docDeptos.data().departamentos) {
                    departamentosChamados = docDeptos.data().departamentos;
                }
            } catch (e) {
                console.error('Erro ao carregar configurações:', e);
            }
        }

        function chamadoPertenceAoDepartamento(chamado) {
            const p = getPerms();
            if (p.isAdmin) return true;
            const depChamado = (chamado.departamento || '').trim().toUpperCase();
            const meuDepto = depto.trim().toUpperCase();
            if (meuDepto === 'TI') return depChamado === 'TI' || depChamado === '' || chamado.tipo === 'gesthosp' || !chamado.departamento;
            if (meuDepto === 'MANUTENCAO') return depChamado === 'MANUTENCAO';
            return depChamado === meuDepto;
        }

        // Interface do usuário
        function initUI() {
            document.getElementById('userName').textContent = usuarioLogado.nome;
            document.getElementById('userRole').textContent = `${usuarioLogado.cargo} · ${nomeDepto}`;
            document.getElementById('userAvatar').textContent = usuarioLogado.nome.charAt(0).toUpperCase();
            buildMenu();
            carregarTodosDados();
        }

        function buildMenu() {
            const p = getPerms();
            const nav = document.getElementById('sidebarNav');
            let html = '<div class="nav-section"><div class="nav-title">Principal</div>';
            html += navItem('dashboard', 'chart-pie', 'Dashboard', true);
            html += navItem('chamados', 'ticket-alt', 'Chamados', false, 'badgeChamados');
            html += navItem('indicadores', 'chart-line', 'Indicadores');
            if (p.isTI || p.isAdmin) html += navItem('gesthosp', 'hospital-user', 'GestHosp', false, 'badgeGestHosp');
            html += '</div><div class="nav-section"><div class="nav-title">Gestão</div>';
            if (p.isTI || p.isAdmin) {
                html += navItem('toners', 'print', 'Toners');
                html += navItem('estoque', 'box', 'Estoque');
                html += navItem('inventario', 'clipboard-list', 'Inventário');
                html += navItem('ips', 'network-wired', 'IPs & Rede');
            }
            if (p.podeEquipe) html += navItem('equipe', 'users-cog', 'Equipe');
            html += '</div><div class="nav-section"><div class="nav-title">Recursos</div>';
            html += navItem('arquivos', 'folder-open', 'Arquivos');
            html += navItem('agenda', 'calendar-alt', 'Agenda', false, 'badgeAgenda');
            html += navItem('config', 'cog', 'Configurações');
            html += '</div>';
            nav.innerHTML = html;
        }

        function navItem(secao, icone, texto, ativo = false, badgeId = null) {
            const badgeClass = badgeId === 'badgeAgenda' ? 'badge-notify agenda' : 'badge-notify';
            const badge = badgeId ? `<span class="${badgeClass}" id="${badgeId}">0</span>` : '';
            return `<div class="nav-item${ativo ? ' active' : ''}" data-secao="${secao}" onclick="navegar('${secao}', this)">

                    break;
                case 'indicadores':

                case 'toners':

                    break;

        // Carregar dados
        async function carregarTodosDados() {
            try {
                // Carregar chamados
                const snapChamados = await db.collection('chamados').orderBy('data_abertura', 'desc').get();
                chamados = [];
                snapChamados.forEach(doc => {
                    const dados = doc.data();
                    dados.fid = doc.id;
                    if (chamadoPertenceAoDepartamento(dados)) {
                        chamados.push(dados);
                    }
                });

                // Carregar inventário
                const snapInventario = await db.collection('inventario').get();
                inventario = [];
                snapInventario.forEach(doc => {
                    const dados = doc.data();
                    dados.fid = doc.id;
                    inventario.push(dados);
                });

                // Carregar estoque
                const snapEstoque = await db.collection('estoque').get();
                estoque = [];
                snapEstoque.forEach(doc => {
                    const dados = doc.data();
                    dados.fid = doc.id;
                    estoque.push(dados);
                });

                // Carregar movimentações
                const snapMov = await db.collection('movimentacoes').orderBy('data', 'desc').limit(100).get();
                movimentacoes = [];
                snapMov.forEach(doc => {
                    const dados = doc.data();
                    dados.fid = doc.id;
                    movimentacoes.push(dados);
                });

                renderDashboard();

                verificarAgenda();

                console.error('Erro ao carregar dados:', e);
                renderDashboard();
            }
        }

        function escutarChamados() {
            if (window._listenerChamados) window._listenerChamados();

            window._listenerChamados = db.collection('chamados')
                .orderBy('data_abertura', 'desc')
                .onSnapshot(snapshot => {
                    let alterado = false;
                    snapshot.docChanges().forEach(change => {
                        const doc = change.doc;
                        const dados = doc.data();
                        dados.fid = doc.id;

                        if (change.type === 'added') {
                            if (chamadoPertenceAoDepartamento(dados)) {
                                const existe = chamados.findIndex(c => c.fid === doc.id);
                                if (existe === -1) {
                                    chamados.push(dados);
                                    alterado = true;
                                }
                            }
                        }
                        if (change.type === 'modified') {
                            const index = chamados.findIndex(c => c.fid === doc.id);
                            if (index !== -1) {
                                if (chamadoPertenceAoDepartamento(dados)) {
                                    chamados[index] = dados;
                                } else {
                                    chamados.splice(index, 1);
                                }
                                alterado = true;
                            } else if (chamadoPertenceAoDepartamento(dados)) {
                                chamados.push(dados);
                                alterado = true;
                            }
                        }
                        if (change.type === 'removed') {
                            const index = chamados.findIndex(c => c.fid === doc.id);
                            if (index !== -1) {
                                chamados.splice(index, 1);
                                alterado = true;
                            }
                        }
                    });

                    if (alterado) {
                        chamados.sort((a, b) => toDate(b.data_abertura) - toDate(a.data_abertura));
                        atualizarBadges();
                        verificarAgenda();

                        if (document.getElementById('infoTotal')) atualizarDashboard();
                        if (document.getElementById('tabelaChamados')) {
                            const sf = document.getElementById('filtroStatus')?.value || '';
                            const pf = document.getElementById('filtroPrioridade')?.value || '';
                            const bf = (document.getElementById('filtroBusca')?.value || '').toLowerCase();
                            let lista = chamados.filter(c => c.tipo !== 'gesthosp');
                            if (sf) lista = lista.filter(c => c.status === sf);
                            if (pf) lista = lista.filter(c => c.prioridade === pf);
                            if (bf) lista = lista.filter(c =>
                                (c.titulo || '').toLowerCase().includes(bf) ||
                                (c.protocolo || '').toLowerCase().includes(bf)
                            );
                            document.getElementById('tabelaChamados').innerHTML = renderLinhasChamados(lista);
                        }
                    }
                }, error => {
                    console.error('Listener erro:', error);
                    setTimeout(() => escutarChamados(), 3000);
                });
        }

        function atualizarBadges() {
            const badgeChamados = document.getElementById('badgeChamados');

            if (badgeChamados) {

        async function avancarStatus(id) {
            try {
                const doc = await db.collection('chamados').doc(id).get();
                if (!doc.exists) {
                    toast('Chamado não encontrado', 'error');
                    return;
                }

                const dados = doc.data();
                const fluxo = {
                    'A Fazer': 'Em Andamento',
                    'Em Andamento': 'Pendente',
                    'Pendente': 'Concluído',
                    'Concluído': 'A Fazer'
                };
                const novoStatus = fluxo[dados.status || 'A Fazer'] || 'A Fazer';
                const update = {
                    status: novoStatus,
                    data_atualizacao: firebase.firestore.Timestamp.now()
                };

                if (novoStatus === 'Em Andamento' || novoStatus === 'Concluído') {
                    update.tecnico = usuarioLogado.nome;
                }

                const historico = dados.historico || [];
                historico.push({
                    data: new Date().toISOString(),
                    acao: `Status alterado para ${novoStatus} por ${usuarioLogado.nome}`
                });
                update.historico = historico;

                await doc.ref.update(update);
                toast(`✅ Status atualizado para ${novoStatus}!`, 'success');
            } catch (e) {
                console.error('Erro ao avançar status:', e);
                toast('Erro ao atualizar status', 'error');
            }
        }

        function atualizarPeriodos() {
            const tipo = document.getElementById('indTipo')?.value || 'mensal';
            const agora = new Date();
            const periodos = [];

            if (tipo === 'mensal') {
                for (let i = 11; i >= 0; i--) {
                    const data = new Date(agora.getFullYear(), agora.getMonth() - i, 1);
                    periodos.push({
                        value: data.toISOString().slice(0, 7),
                        label: data.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })
                    });
                }
            } else {
                for (let i = 7; i >= 0; i--) {
                    const inicio = new Date();
                    inicio.setDate(inicio.getDate() - (i * 7));
                    const fim = new Date(inicio);
                    fim.setDate(fim.getDate() + 6);
                    periodos.push({
                        value: inicio.toISOString().slice(0, 10),
                        label: `${inicio.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })} - ${fim.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })}`
                    });
                }
            }

            const select = document.getElementById('indPeriodo');
            if (select) {
                select.innerHTML = periodos.map(p => `<option value="${p.value}">${p.label}</option>`).join('');
                select.value = periodos[periodos.length - 1]?.value || '';
            }
            atualizarIndicadoresUI();
        }

        function atualizarIndicadoresUI() {
            const tipo = document.getElementById('indTipo')?.value || 'mensal';
            const periodo = document.getElementById('indPeriodo')?.value;
            if (!periodo) return;

            const chamadosRegulares = chamados.filter(c => c.tipo !== 'gesthosp');
            const filtrarPorPeriodo = (p) => chamadosRegulares.filter(c => {
                const data = toDate(c.data_abertura);
                if (tipo === 'mensal') return data.toISOString().slice(0, 7) === p;
                const inicio = new Date(p);
                const fim = new Date(p);
                fim.setDate(fim.getDate() + 6);
                return data >= inicio && data <= fim;
            });

            const atual = filtrarPorPeriodo(periodo);
            let periodoAnterior;

            if (tipo === 'mensal') {
                const [ano, mes] = periodo.split('-').map(Number);
                const dataAnterior = new Date(ano, mes - 2, 1);
                periodoAnterior = dataAnterior.toISOString().slice(0, 7);
            } else {
                const dataAnterior = new Date(periodo);
                dataAnterior.setDate(dataAnterior.getDate() - 7);
                periodoAnterior = dataAnterior.toISOString().slice(0, 10);
            }

            const anterior = filtrarPorPeriodo(periodoAnterior);
            const totalAtual = atual.length;
            const totalAnterior = anterior.length;
            const concluidos = atual.filter(c => c.status === 'Concluído').length;
            const criticos = atual.filter(c => c.prioridade === 'Crítica').length;

                    <div style="width:42px;height:42px;background:#DBEAFE;color:#3182CE;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-history"></i></div>
                    <div><small style="font-size:10px;color:#A0AEC0">Período Anterior</small><strong style="font-size:22px;display:block">${totalAnterior}</strong></div>
                </div>
                <div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)">
                    <div style="width:42px;height:42px;background:#D1FAE5;color:#38A169;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-check-circle"></i></div>
                    <div><small style="font-size:10px;color:#A0AEC0">Resolução</small><strong style="font-size:22px;display:block">${taxa}%</strong></div>
                </div>
                <div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)">
                    <div style="width:42px;height:42px;background:#FEE2E2;color:#E53E3E;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-exclamation-triangle"></i></div>
                    <div><small style="font-size:10px;color:#A0AEC0">Críticos</small><strong style="font-size:22px;display:block">${criticos}</strong></div>
                </div>`;

            // Destruir gráficos anteriores
            Object.values(charts).forEach(c => { if (c) c.destroy(); });
            charts = {};

            // Gráfico de evolução
            const labels = [];
            const totais = [];
            const concluidosArr = [];

            if (tipo === 'mensal') {
                const agora = new Date();
                for (let i = 5; i >= 0; i--) {
                    const data = new Date(agora.getFullYear(), agora.getMonth() - i, 1);
                    const periodoLabel = data.toISOString().slice(0, 7);
                    labels.push(data.toLocaleDateString('pt-BR', { month: 'short' }));
                    const chamadosPeriodo = chamadosRegulares.filter(c => toDate(c.data_abertura).toISOString().slice(0, 7) === periodoLabel);
                    totais.push(chamadosPeriodo.length);
                    concluidosArr.push(chamadosPeriodo.filter(c => c.status === 'Concluído').length);
                }
            }

            const ctx1 = document.getElementById('graficoEvolucao');
            if (ctx1 && labels.length > 0) {
                charts.evol = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Total',
                            data: totais,
                            backgroundColor: 'rgba(49,130,206,0.3)',
                            borderColor: '#3182CE',
                            borderWidth: 2
                        }, {
                            label: 'Concluídos',
                            data: concluidosArr,
                            backgroundColor: 'rgba(56,161,105,0.3)',
                            borderColor: '#38A169',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }

            const ctx2 = document.getElementById('graficoResolucao');
            if (ctx2) {
                charts.res = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Resolvidos', 'Pendentes'],
                        datasets: [{
                            data: [concluidos, Math.max(0, totalAtual - concluidos)],
                            backgroundColor: ['#38A169', 'rgba(229,62,62,0.2)']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '50%'
                    }
                });
            }
        }

        async function exportarIndicadoresPDF() {
            try {
                const elemento = document.createElement('div');
                elemento.style.cssText = 'padding:30px;background:#fff;width:1000px;position:absolute;left:-9999px;';
                elemento.innerHTML = `<h1>HelpHosp - Indicadores</h1>${document.getElementById('indicadorGrid')?.innerHTML || ''}`;
                document.body.appendChild(elemento);
                const canvas = await html2canvas(elemento, { scale: 2 });
                document.body.removeChild(elemento);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 5, 5, 200, (canvas.height * 200) / canvas.width);
                pdf.save('indicadores.pdf');
                toast('📄 PDF gerado!', 'success');
            } catch (e) {
                toast('Erro ao exportar', 'error');
            }
        }

        function exportarIndicadoresSlide() {
            toast('📊 Slide exportado!', 'success');
        }

        // Inicialização
        async function init() {
            console.log('🚀 HelpHosp iniciando...');
            if (!checkAuth()) return;
            console.log('✅ Autenticado:', usuarioLogado.nome, '-', depto);
            await loadConfig();
            console.log('✅ Configurações carregadas');
            initUI();
            if (Notification.permission === 'default') Notification.requestPermission();
        }

        window.addEventListener('load', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(init, 100);
        }
    </script>
</body>
</html>
