<body>
    <script>
        (function() {
            const sessao = localStorage.getItem('usuario_logado');
            if (!sessao) { window.location.href = 'login.html'; return; }
            try {
                const dados = JSON.parse(sessao);
                if (dados.expira && Date.now() > dados.expira) { localStorage.removeItem('usuario_logado'); window.location.href = 'login.html'; return; }
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('primeiro_acesso') === '1' || dados.primeiro_acesso) {
                    window.__hhPrimeiroAcesso = true;
                    if (window.history && window.history.replaceState) { window.history.replaceState({}, document.title, window.location.pathname); }
                }
            } catch (e) { localStorage.removeItem('usuario_logado'); window.location.href = 'login.html'; }
        })();
    </script>

    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>

    </main>
