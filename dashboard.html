    <style>

        /* VARIÁVEIS DE TEMA (CLARO/ESCURO) */

        .logo-icon {

            border-collapse: collapse;
            font-size: 11px;

            background: var(--bg);
            color: var(--text-secondary);
            padding: 12px;
            text-align: left;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }
        
        tr:hover td {
            background: rgba(49,130,206,0.05);
            cursor: pointer;
        }
        
        /* Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 9px;
            font-weight: 700;
        }
        
        .badge-blue { background: #DBEAFE; color: #1D4ED8; }
        .badge-green { background: #D1FAE5; color: #065F46; }
        .badge-amber { background: #FEF3C7; color: #92400E; }
        .badge-red { background: #FEE2E2; color: #991B1B; }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card);
            border-left: 4px solid var(--accent);
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 3.5s forwards;
            max-width: 350px;
        }
        
        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
        
        .toast.success { border-left-color: #38A169; }
        .toast.error { border-left-color: #E53E3E; }
        .toast.warning { border-left-color: #DD6B20; }
        
        .menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 110;
            background: var(--primary);
            color: #fff;
            border: none;

            height: 40px;
            border-radius: 10px;

        }
        
        /* ============================================ */
        /* RESPONSIVO */
        /* ============================================ */
        @media(max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }

        }
        
        @media(max-width: 640px) {
            .stats-grid { grid-template-columns: 1fr; }
            .info-bar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>

<script>
// ============================================
// FIREBASE
// ============================================
const fc={apiKey:"AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",authDomain:"helphosp.firebaseapp.com",projectId:"helphosp",storageBucket:"helphosp.firebasestorage.app",messagingSenderId:"1075623193163",appId:"1:1075623193163:web:cf54ee082d1c97a9aa7bce"};
firebase.initializeApp(fc);
const db=firebase.firestore();

// ============================================
// VARIÁVEIS GLOBAIS
// ============================================
const SETORES_PADRAO=['Administração','Almoxarifado','CAF Principal','CAF CR','Centro Cirúrgico','Clínica Cirurgica','Clínica Médica I','Clínica Médica II','Comunicação','Direção Administrativa','Direção Enfermagem','Direção geral','Direção Medica','Emergência/Vermelha','Engenharia Clinica','Farmácia','Faturamento','Fisioterapia','Hotelaria','Juridico','Laboratório','Manutenção','NIR','Nutrição','Oncologia I','Oncologia II','Outros','Ouvidoria','Patrimonio','Pediatria','Psicologia','RH','Raio-X','Recepção CR','Recepção Geral','Recepção Nefrologia','Same','Serviço Social','Sesmt','Telemedicina','Tomografia','UTI I','UTI II'];
let setores=[...SETORES_PADRAO];
let usuarioLogado=null,depto='TI',nomeDepto='Tecnologia da Informação';
let chamados=[],inventario=[],estoque=[],charts={};

// ============================================
// TEMA ESCURO/CLARO
// ============================================
function toggleTheme(){
    const html=document.documentElement;
    const icon=document.getElementById('themeIcon');
    if(html.getAttribute('data-theme')==='dark'){
        html.removeAttribute('data-theme');
        icon.className='fas fa-moon';
        localStorage.setItem('theme','light');
    }else{
        html.setAttribute('data-theme','dark');
        icon.className='fas fa-sun';
        localStorage.setItem('theme','dark');
    }
}

// Carregar tema salvo
(function(){
    if(localStorage.getItem('theme')==='dark'){
        document.documentElement.setAttribute('data-theme','dark');
        document.getElementById('themeIcon').className='fas fa-sun';
    }
})();

// ============================================
// UTILITÁRIOS
// ============================================
function toast(m,t='info'){
    const e=document.createElement('div');
    e.className=`toast ${t}`;
    e.innerHTML=`<i class="fas fa-${t==='success'?'check-circle':t==='error'?'exclamation-circle':'info-circle'}"></i> ${m}`;
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),4000);
}

function fmtData(d){
    if(!d)return'—';
    try{const dt=d?.toDate?d.toDate():new Date(d);return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}
}

function fmtDataCurta(d){
    if(!d)return'—';
    try{const dt=d?.toDate?d.toDate():new Date(d);const a=new Date();const diff=Math.floor((a-dt)/1000);if(diff<60)return'agora';if(diff<3600)return Math.floor(diff/60)+'min';if(diff<86400)return Math.floor(diff/3600)+'h';return Math.floor(diff/86400)+'d'}catch(e){return'—'}
}

function toDate(d){if(!d)return new Date(0);return d?.toDate?d.toDate():new Date(d)}
function sanitizar(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function getStatusClass(s){
    const c={'Concluído':'badge-green','Em Andamento':'badge-amber','Pendente':'badge-red','A Fazer':'badge-blue'};
    return c[s]||'badge-blue';
}

// ============================================
// SLA - SERVICE LEVEL AGREEMENT
// ============================================
function getSLAStatus(chamado){
    const sla={
        'Crítica':60*60*1000,      // 1 hora
        'Alta':4*60*60*1000,        // 4 horas
        'Média':24*60*60*1000,      // 24 horas
        'Baixa':48*60*60*1000       // 48 horas
    };
    
    if(chamado.status==='Concluído')return'sla-ok';
    
    const abertura=toDate(chamado.data_abertura);
    const agora=new Date();
    const prazo=sla[chamado.prioridade]||sla['Média'];
    const tempoRestante=prazo-(agora-abertura);
    
    if(tempoRestante<=0)return'sla-critical';
    if(tempoRestante<prazo*0.3)return'sla-warning';
    return'sla-ok';
}

function getSLATexto(chamado){
    const status=getSLAStatus(chamado);
    if(status==='sla-critical')return'🔴 Atrasado';
    if(status==='sla-warning')return'🟡 Próximo';
    return'🟢 No prazo';
}

// ============================================
// AUTENTICAÇÃO
// ============================================
function checkAuth(){
    const u=localStorage.getItem('usuario_logado');
    if(!u){window.location.href='admin.html';return false}
    try{
        usuarioLogado=JSON.parse(u);
        if(usuarioLogado.expira&&Date.now()>usuarioLogado.expira){localStorage.removeItem('usuario_logado');window.location.href='admin.html';return false}
        depto=usuarioLogado.departamento||'TI';
        nomeDepto=depto==='TI'?'Tecnologia da Informação':'Manutenção';
        return true;
    }catch(e){localStorage.removeItem('usuario_logado');window.location.href='admin.html';return false}
}

function getPerms(){
    const isAdmin=usuarioLogado.tipo==='admin'||usuarioLogado.usuario==='edson';
    return{isAdmin,isTI:depto==='TI',isManut:depto==='MANUTENCAO',podeEquipe:isAdmin||(depto==='MANUTENCAO'&&(usuarioLogado.usuario==='bruno'||usuarioLogado.usuario==='benicio'))}
}

function logout(){if(confirm('Sair?')){localStorage.removeItem('usuario_logado');window.location.href='admin.html'}}

// ============================================
// INTERFACE
// ============================================
function initUI(){
    document.getElementById('userName').textContent=usuarioLogado.nome;
    document.getElementById('userRole').textContent=`${usuarioLogado.cargo} · ${nomeDepto}`;
    document.getElementById('userAvatar').textContent=usuarioLogado.nome.charAt(0).toUpperCase();
    buildMenu();
    carregarDados();
}

function buildMenu(){
    const p=getPerms();
    const nav=document.getElementById('sidebarNav');
    let h='<div class="nav-section"><div class="nav-title">Principal</div>';
    h+=navItem('dashboard','chart-pie','Dashboard',true);
    h+=navItem('chamados','ticket-alt','Chamados',false,'badgeChamados');
    h+=navItem('sla','clock','Monitor SLA',false,'badgeSLA');
    h+='</div><div class="nav-section"><div class="nav-title">Gestão</div>';
    if(p.isTI||p.isAdmin){h+=navItem('estoque','box','Estoque');h+=navItem('inventario','clipboard-list','Inventário');}
    h+='</div><div class="nav-section"><div class="nav-title">Sistema</div>';
    h+=navItem('config','cog','Configurações');
    h+='</div>';
    nav.innerHTML=h;
}

function navItem(s,ic,tx,at=false,bd=null){
    const badge=bd?`<span class="badge-notify" id="${bd}">0</span>`:'';
    return`<div class="nav-item${at?' active':''}" data-secao="${s}" onclick="navegar('${s}',this)"><i class="fas fa-${ic}"></i><span>${tx}</span>${badge}</div>`;
}

function navegar(s,el){
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    if(el)el.classList.add('active');
    if(window.innerWidth<1025)document.getElementById('sidebar').classList.remove('open');
    if(s==='dashboard')renderDashboard();
    else if(s==='sla')renderSLA();
    else if(s==='chamados')renderChamados();
    else if(s==='config')renderConfig();
    else if(s==='estoque')renderEstoque();
    else if(s==='inventario')renderInventario();
}

// ============================================
// CARREGAR DADOS
// ============================================
async function carregarDados(){
    try{
        const sc=await db.collection('chamados').orderBy('data_abertura','desc').get();
        chamados=[];sc.forEach(d=>{const x=d.data();x.fid=d.id;chamados.push(x)});
        const si=await db.collection('inventario').get();inventario=[];si.forEach(d=>{const x=d.data();x.fid=d.id;inventario.push(x)});
        const se=await db.collection('estoque').get();estoque=[];se.forEach(d=>{const x=d.data();x.fid=d.id;estoque.push(x)});
        renderDashboard();
        escutarChamados();
        atualizarBadges();
    }catch(e){console.error(e);renderDashboard();}
}

function escutarChamados(){
    db.collection('chamados').orderBy('data_abertura','desc').onSnapshot(snap=>{
        chamados=[];snap.forEach(d=>{const x=d.data();x.fid=d.id;chamados.push(x)});
        atualizarBadges();
        if(document.getElementById('infoTotal'))atualizarDashboard();
        if(document.getElementById('tabelaSLA'))renderSLA();
    });
}

function atualizarBadges(){
    const b1=document.getElementById('badgeChamados'),b2=document.getElementById('badgeSLA');
    if(b1){const n=chamados.filter(c=>c.status!=='Concluído').length;b1.style.display=n>0?'inline-block':'none';b1.textContent=n}
    if(b2){const n=chamados.filter(c=>getSLAStatus(c)==='sla-critical').length;b2.style.display=n>0?'inline-block':'none';b2.textContent=n}
}

// ============================================
// DASHBOARD PREMIUM
// ============================================
function renderDashboard(){
    const main=document.getElementById('mainContent');
    
    // Calcular totais
    let te=0,tc=0,ti=0;
    inventario.forEach(i=>{tc+=parseInt(i.computadores)||0;ti+=parseInt(i.impressoras)||0;te+=(parseInt(i.computadores)||0)+(parseInt(i.impressoras)||0)+(parseInt(i.ramais)||0)+(parseInt(i.tvs)||0)+(parseInt(i.redes)||0)+(parseInt(i.outros)||0)});
    const tEst=estoque.reduce((s,e)=>s+(parseInt(e.quantidade)||0),0);
    
    // Chamados
    const t=chamados.length;
    const a=chamados.filter(c=>c.status!=='Concluído').length;
    const co=chamados.filter(c=>c.status==='Concluído').length;
    const cr=chamados.filter(c=>c.prioridade==='Crítica'&&c.status!=='Concluído').length;
    const tx=t>0?Math.round(co/t*100):0;
    const slaAtrasados=chamados.filter(c=>getSLAStatus(c)==='sla-critical').length;
    
    main.innerHTML=`
        <div class="top-bar">
            <h1>📊 Dashboard Premium — ${sanitizar(nomeDepto)}</h1>
            <div style="display:flex;gap:6px;">
                <select id="periodo" onchange="atualizarDashboard()" style="padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;background:var(--card);color:var(--text);">
                    <option value="7">7 dias</option>
                    <option value="30" selected>30 dias</option>
                    <option value="90">90 dias</option>
                </select>
                <button class="btn btn-primary btn-sm" onclick="gerarRelatorio()"><i class="fas fa-file-pdf"></i> PDF</button>
            </div>
        </div>
        
        <div class="info-bar">
            <div class="info-item"><div class="info-val" id="infoTotal">${t}</div><div class="info-lbl">Total</div></div>
            <div class="info-item"><div class="info-val" style="color:#FBD38D;" id="infoAbertos">${a}</div><div class="info-lbl">Abertos</div></div>
            <div class="info-item"><div class="info-val" style="color:#68D391;" id="infoConcluidos">${co}</div><div class="info-lbl">Concluídos</div></div>
            <div class="info-item"><div class="info-val" style="color:#FC8181;" id="infoCriticos">${cr}</div><div class="info-lbl">Críticos</div></div>
            <div class="info-item"><div class="info-val" style="color:#63B3ED;" id="infoTaxa">${tx}%</div><div class="info-lbl">Resolução</div></div>
            <div class="info-item"><div class="info-val" style="color:#F59E0B;" id="infoSLA">${slaAtrasados}</div><div class="info-lbl">SLA Atrasado</div></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-desktop"></i></div><div class="stat-info"><small>Equipamentos</small><strong>${te}</strong></div></div>
            <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-laptop"></i></div><div class="stat-info"><small>Computadores</small><strong>${tc}</strong></div></div>
            <div class="stat-card"><div class="stat-icon green"><i class="fas fa-print"></i></div><div class="stat-info"><small>Impressoras</small><strong>${ti}</strong></div></div>
            <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-box"></i></div><div class="stat-info"><small>Estoque</small><strong>${tEst}</strong></div></div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card"><h3>📈 Chamados por Setor</h3><canvas id="graficoSetor"></canvas></div>
            <div class="chart-card"><h3>🎯 Por Prioridade</h3><canvas id="graficoPrioridade"></canvas></div>
        </div>
        
        <div class="table-card">
            <h3>🚨 Chamados Críticos (SLA)</h3>
            <table>
                <thead><tr><th>Protocolo</th><th>Título</th><th>Setor</th><th>Prioridade</th><th>Status</th><th>SLA</th><th>Aberto</th></tr></thead>
                <tbody>${chamados.filter(c=>c.status!=='Concluído').sort((a,b)=>toDate(a.data_abertura)-toDate(b.data_abertura)).slice(0,10).map(c=>`
                    <tr>
                        <td><strong>${sanitizar(c.protocolo||'—')}</strong></td>
                        <td>${sanitizar(c.titulo||'—')}</td>
                        <td>${sanitizar(c.setor||'—')}</td>
                        <td><span class="badge ${c.prioridade==='Crítica'?'badge-red':'badge-amber'}">${sanitizar(c.prioridade||'—')}</span></td>
                        <td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></td>
                        <td><span class="${getSLAStatus(c)}" style="padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;">${getSLATexto(c)}</span></td>
                        <td>${fmtDataCurta(c.data_abertura)}</td>
                    </tr>
                `).join('')}</tbody>
            </table>
        </div>`;
    
    // Gráficos
    Object.values(charts).forEach(c=>{if(c)c.destroy()});charts={};
    
    const ds={};chamados.forEach(c=>{const s=c.setor||'Outros';ds[s]=(ds[s]||0)+1});
    const cores=['#3182CE','#38A169','#805AD5','#DD6B20','#E53E3E','#6366F1','#D69E2E','#EC4899'];
    const ctx1=document.getElementById('graficoSetor');
    if(ctx1)charts.setor=new Chart(ctx1,{type:'doughnut',data:{labels:Object.keys(ds).slice(0,8),datasets:[{data:Object.values(ds).slice(0,8),backgroundColor:cores, borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'bottom',labels:{padding:15}}}}});
    
    const dp={};chamados.filter(c=>c.tipo!=='gesthosp').forEach(c=>{const pr=c.prioridade||'Média';dp[pr]=(dp[pr]||0)+1});
    const ctx2=document.getElementById('graficoPrioridade');
    if(ctx2)charts.prioridade=new Chart(ctx2,{type:'pie',data:{labels:Object.keys(dp),datasets:[{data:Object.values(dp),backgroundColor:['#38A169','#DD6B20','#E53E3E','#C53030'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:15}}}}});
}

function atualizarDashboard(){
    const p=parseInt(document.getElementById('periodo')?.value||30);
    const dl=new Date();dl.setDate(dl.getDate()-p);
    const f=chamados.filter(c=>{const d=toDate(c.data_abertura);return!isNaN(d.getTime())&&d>=dl});
    
    document.getElementById('infoTotal').textContent=f.length;
    document.getElementById('infoAbertos').textContent=f.filter(c=>c.status!=='Concluído').length;
    document.getElementById('infoConcluidos').textContent=f.filter(c=>c.status==='Concluído').length;
    document.getElementById('infoCriticos').textContent=f.filter(c=>c.prioridade==='Crítica'&&c.status!=='Concluído').length;
    document.getElementById('infoTaxa').textContent=f.length>0?Math.round(f.filter(c=>c.status==='Concluído').length/f.length*100)+'%':'0%';
    document.getElementById('infoSLA').textContent=f.filter(c=>getSLAStatus(c)==='sla-critical').length;
}

// ============================================
// MONITOR SLA
// ============================================
function renderSLA(){
    const main=document.getElementById('mainContent');
    const pendentes=chamados.filter(c=>c.status!=='Concluído').sort((a,b)=>toDate(a.data_abertura)-toDate(b.data_abertura));
    
    main.innerHTML=`
        <div class="top-bar"><h1>⏱️ Monitor SLA</h1></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><small>No Prazo</small><strong>${pendentes.filter(c=>getSLAStatus(c)==='sla-ok').length}</strong></div></div>
            <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-clock"></i></div><div class="stat-info"><small>Próximos</small><strong>${pendentes.filter(c=>getSLAStatus(c)==='sla-warning').length}</strong></div></div>
            <div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><small>Atrasados</small><strong>${pendentes.filter(c=>getSLAStatus(c)==='sla-critical').length}</strong></div></div>
            <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-clipboard-list"></i></div><div class="stat-info"><small>Total Pendente</small><strong>${pendentes.length}</strong></div></div>
        </div>
        <div class="table-card">
            <table>
                <thead><tr><th>Protocolo</th><th>Título</th><th>Prioridade</th><th>Prazo SLA</th><th>Status SLA</th><th>Aberto há</th></tr></thead>
                <tbody>${pendentes.map(c=>`
                    <tr style="${getSLAStatus(c)==='sla-critical'?'background:rgba(254,226,226,0.3);':''}">
                        <td><strong>${sanitizar(c.protocolo||'—')}</strong></td>
                        <td>${sanitizar(c.titulo||'—')}</td>
                        <td>${sanitizar(c.prioridade||'—')}</td>
                        <td>${c.prioridade==='Crítica'?'1 hora':c.prioridade==='Alta'?'4 horas':c.prioridade==='Média'?'24 horas':'48 horas'}</td>
                        <td><span class="${getSLAStatus(c)}" style="padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;">${getSLATexto(c)}</span></td>
                        <td>${fmtDataCurta(c.data_abertura)}</td>
                    </tr>
                `).join('')}</tbody>
            </table>
        </div>`;
}

// ============================================
// RELATÓRIO
// ============================================
async function gerarRelatorio(){
    try{
        toast('📄 Gerando relatório premium...','info');
        const t=chamados.length,co=chamados.filter(c=>c.status==='Concluído').length;
        const el=document.createElement('div');
        el.style.cssText='padding:40px;background:#fff;width:1000px;position:absolute;left:-9999px;font-family:Arial;';
        el.innerHTML=`<div style="text-align:center;border-bottom:4px solid #06224a;padding-bottom:20px;margin-bottom:20px;"><h1 style="color:#06224a;">HelpHosp</h1><h2>Relatório Premium - ${sanitizar(nomeDepto)}</h2><p>${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;"><div style="background:#DBEAFE;padding:20px;border-radius:10px;text-align:center;"><p style="font-size:12px;">TOTAL</p><p style="font-size:32px;font-weight:700;">${t}</p></div><div style="background:#D1FAE5;padding:20px;border-radius:10px;text-align:center;"><p style="font-size:12px;">CONCLUÍDOS</p><p style="font-size:32px;font-weight:700;">${co}</p></div><div style="background:#FEF3C7;padding:20px;border-radius:10px;text-align:center;"><p style="font-size:12px;">TAXA</p><p style="font-size:32px;font-weight:700;">${t>0?Math.round(co/t*100):0}%</p></div></div>`;
        document.body.appendChild(el);
        const cv=await html2canvas(el,{scale:2});
        document.body.removeChild(el);
        const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
        pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,200,(cv.height*200)/cv.width);
        pdf.save('relatorio-premium.pdf');
        toast('✅ Relatório gerado!','success');
    }catch(e){toast('Erro','error')}
}

// ============================================
// SEÇÕES SIMPLIFICADAS
// ============================================
function renderChamados(){
    document.getElementById('mainContent').innerHTML=`<div class="top-bar"><h1>📋 Chamados</h1></div><div class="table-card"><table><thead><tr><th>Protocolo</th><th>Título</th><th>Setor</th><th>Prioridade</th><th>Status</th><th>SLA</th></tr></thead><tbody>${chamados.map(c=>`<tr><td>${sanitizar(c.protocolo||'—')}</td><td>${sanitizar(c.titulo||'—')}</td><td>${sanitizar(c.setor||'—')}</td><td>${sanitizar(c.prioridade||'—')}</td><td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></td><td><span class="${getSLAStatus(c)}" style="padding:4px 10px;border-radius:12px;font-size:10px;">${getSLATexto(c)}</span></td></tr>`).join('')}</tbody></table></div>`;
}

function renderConfig(){
    document.getElementById('mainContent').innerHTML=`<div class="top-bar"><h1>⚙️ Configurações</h1></div><div class="table-card"><p style="text-align:center;padding:40px;">Configurações Premium em desenvolvimento</p></div>`;
}

function renderEstoque(){
    document.getElementById('mainContent').innerHTML=`<div class="top-bar"><h1>📦 Estoque</h1></div><div class="table-card"><p style="text-align:center;padding:40px;">${estoque.length} itens em estoque</p></div>`;
}

function renderInventario(){
    document.getElementById('mainContent').innerHTML=`<div class="top-bar"><h1>📊 Inventário</h1></div><div class="table-card"><p style="text-align:center;padding:40px;">${inventario.length} setores cadastrados</p></div>`;
}

// ============================================
// INICIALIZAÇÃO
// ============================================
async function init(){
    console.log('🚀 HelpHosp Premium iniciando...');
    if(!checkAuth())return;
    console.log('✅ Autenticado:',usuarioLogado.nome);
    initUI();
    if(Notification.permission==='default')Notification.requestPermission();
    
    // Notificação de boas-vindas
    setTimeout(()=>toast('👋 Bem-vindo ao Painel Premium!','success'),1000);
}

window.addEventListener('load',init);
</script>
</body>
</html>
