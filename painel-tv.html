<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel TV</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#0f0;font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden;font-size:20px;line-height:1.5}
        .scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,0,0.015) 2px,rgba(0,255,0,0.015) 4px)}
        .container{position:relative;z-index:1;padding:40px;max-width:1400px;margin:0 auto}
        .tv-header{text-align:center;padding:20px 0;border-bottom:3px solid #0f0;margin-bottom:30px}
        .tv-header h1{font-size:36px;font-weight:700;letter-spacing:4px;text-shadow:0 0 20px #0f0;margin-bottom:10px}
        .tv-header .info{font-size:18px;color:#0ff;letter-spacing:2px}
        .tv-header .stats{display:inline-block;margin-top:10px;padding:10px 20px;border:1px solid #0f0;border-radius:4px;font-size:20px}
        .tv-header .count{font-size:48px;font-weight:700;color:#0f0;text-shadow:0 0 20px #0f0}
        .clock{text-align:center;font-size:52px;font-weight:700;margin:15px 0;letter-spacing:6px;text-shadow:0 0 30px #0ff;color:#0ff}
        .chamados-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
        .tv-chamado{background:#0a0a0a;border:2px solid #0f0;padding:20px;border-radius:8px}
        .tv-critical{border-color:#f00!important;animation:criticalPulse 1s infinite;box-shadow:0 0 25px rgba(255,0,0,0.4)!important}
        @keyframes criticalPulse{0%,100%{box-shadow:0 0 25px rgba(255,0,0,0.4)}50%{box-shadow:0 0 50px rgba(255,0,0,0.8)}}
        .tv-chamado .protocolo{font-size:16px;color:#0ff;margin-bottom:8px}
        .tv-chamado .titulo{font-size:22px;font-weight:700;margin-bottom:10px;text-transform:uppercase}
        .tv-chamado .info-row{display:flex;justify-content:space-between;font-size:16px;margin-top:5px}
        .tv-chamado .setor{color:#ff0}
        .tv-chamado .prioridade{font-weight:700;text-transform:uppercase}
        .tv-chamado .status{padding:4px 12px;border:1px solid;border-radius:4px;font-size:14px}
        .tv-empty{text-align:center;padding:60px;font-size:28px;border:2px dashed #0f0;border-radius:10px;grid-column:1/-1}
        .tv-footer{text-align:center;margin-top:30px;padding-top:20px;border-top:1px solid rgba(0,255,0,0.3);font-size:14px;color:rgba(0,255,0,0.5);letter-spacing:3px}
        .blink-dot{display:inline-block;width:12px;height:12px;background:#0f0;border-radius:50%;margin-right:8px;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        @media(max-width:900px){.chamados-grid{grid-template-columns:1fr}.container{padding:20px}.tv-header h1{font-size:28px}.clock{font-size:36px}.tv-chamado .titulo{font-size:18px}}
    </style>
</head>
<body>
<div class="scanlines"></div>
<div class="container">
    <div class="tv-header">
        <h1>🏥 HelpHosp</h1>
        <div class="info" id="dataAtual"></div>
        <div class="clock" id="relogio"></div>
        <div class="stats">CHAMADOS DO DIA: <span class="count" id="contador">0</span></div>
    </div>
    <div class="chamados-grid" id="listaChamados"><div class="tv-empty">CARREGANDO...</div></div>
    <div class="tv-footer"><span class="blink-dot"></span> SISTEMA ATIVO | HelpHosp © <span id="anoAtual"></span></div>
</div>

<script>
const fc={apiKey:"AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",authDomain:"helphosp.firebaseapp.com",projectId:"helphosp",storageBucket:"helphosp.firebasestorage.app",messagingSenderId:"1075623193163",appId:"1:1075623193163:web:cf54ee082d1c97a9aa7bce"};
firebase.initializeApp(fc);const db=firebase.firestore();
let chamados=[];

function sanitizar(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtData(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function toDate(d){if(!d)return new Date(0);return d?.toDate?d.toDate():new Date(d)}

function atualizarRelogio(){const a=new Date();document.getElementById('relogio').textContent=a.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('dataAtual').textContent=a.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();document.getElementById('anoAtual').textContent=a.getFullYear()}

async function carregarChamados(){
    try{
        const hoje=new Date();hoje.setHours(0,0,0,0);const amanha=new Date(hoje);amanha.setDate(amanha.getDate()+1);
        const snap=await db.collection('chamados').where('data_abertura','>=',firebase.firestore.Timestamp.fromDate(hoje)).where('data_abertura','<',firebase.firestore.Timestamp.fromDate(amanha)).orderBy('data_abertura','desc').get();
        chamados=[];snap.forEach(doc=>{const d=doc.data();d.fid=doc.id;chamados.push(d)});
        renderizar();
    }catch(e){document.getElementById('listaChamados').innerHTML='<div class="tv-empty">ERRO AO CARREGAR</div>'}
}

function renderizar(){
    document.getElementById('contador').textContent=chamados.length;
    if(chamados.length===0){document.getElementById('listaChamados').innerHTML='<div class="tv-empty">✅ NENHUM CHAMADO HOJE</div>';return}
    const ord=[...chamados].sort((a,b)=>{if(a.prioridade==='Crítica'&&b.prioridade!=='Crítica')return-1;if(a.prioridade!=='Crítica'&&b.prioridade==='Crítica')return 1;return toDate(b.data_abertura)-toDate(a.data_abertura)});
    document.getElementById('listaChamados').innerHTML=ord.map(c=>{const d=toDate(c.data_abertura);const cp=c.prioridade==='Crítica'?'#f00':c.prioridade==='Alta'?'#f60':'#ff0';return`<div class="tv-chamado${c.prioridade==='Crítica'?' tv-critical':''}"><div class="protocolo">📋 ${sanitizar(c.protocolo||'—')}</div><div class="titulo">${sanitizar(c.titulo||'SEM TÍTULO')}</div><div class="info-row"><span class="setor">📍 ${sanitizar(c.setor||'—')}</span><span class="prioridade" style="color:${cp}">${sanitizar(c.prioridade||'MÉDIA')}</span></div><div class="info-row" style="margin-top:8px;"><span class="status" style="color:${c.status==='Concluído'?'#0f0':'#ff0'}">${sanitizar(c.status||'A FAZER')}</span><span>🕐 ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div></div>`}).join('')}

function escutar(){const hoje=new Date();hoje.setHours(0,0,0,0);const amanha=new Date(hoje);amanha.setDate(amanha.getDate()+1);db.collection('chamados').where('data_abertura','>=',firebase.firestore.Timestamp.fromDate(hoje)).where('data_abertura','<',firebase.firestore.Timestamp.fromDate(amanha)).orderBy('data_abertura','desc').onSnapshot(snap=>{chamados=[];snap.forEach(doc=>{const d=doc.data();d.fid=doc.id;chamados.push(d)});renderizar()})}

function init(){
    const u=localStorage.getItem('usuario_logado');
    if(!u){document.getElementById('listaChamados').innerHTML='<div class="tv-empty">🔒 FAÇA LOGIN NO PAINEL TÉCNICO</div>';return}
    atualizarRelogio();setInterval(atualizarRelogio,1000);
    carregarChamados();escutar();setInterval(carregarChamados,30000);
}
window.addEventListener('load',init);
document.addEventListener('keydown',function(e){if(e.key==='Escape')window.close()});
</script>
</body>
</html>
