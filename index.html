<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HelpHosp — Central de Chamados</title>
    <meta name="description" content="Sistema de chamados técnicos hospitalar: TI e Manutenção." />
    <meta name="theme-color" content="#0b2340" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HelpHosp" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
/* Rede de segurança: se o app não montar (erro de carga/cache), mostra o motivo em vez de tela branca. */
(function(){var erros=[];function mostra(){var r=document.getElementById('root');if(r&&r.children.length)return;
 var d=document.createElement('div');d.style.cssText='max-width:640px;margin:10vh auto;padding:24px;font-family:system-ui,sans-serif';
 d.innerHTML='<h2>O sistema não conseguiu carregar</h2><p style="color:#64748b">Clique em "Limpar cache e recarregar". Se persistir, envie o texto abaixo ao suporte.</p><pre style="background:#0f172a;color:#fca5a5;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:12px"></pre><button id="hh-limpa" style="padding:10px 16px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer">Limpar cache e recarregar</button>';
 d.querySelector('pre').textContent=erros.join('\n')||'(sem erro registrado)';(r||document.body).appendChild(d);
 document.getElementById('hh-limpa').onclick=function(){Promise.resolve().then(function(){return navigator.serviceWorker&&navigator.serviceWorker.getRegistrations()}).then(function(rs){return Promise.all((rs||[]).map(function(x){return x.unregister()}))}).then(function(){return window.caches&&caches.keys()}).then(function(ks){return Promise.all((ks||[]).map(function(k){return caches.delete(k)}))}).catch(function(){}).then(function(){location.reload()})}}
 window.addEventListener('error',function(e){erros.push(String(e.message||e))});window.addEventListener('unhandledrejection',function(e){erros.push(String(e.reason&&e.reason.message||e.reason))});
 setTimeout(mostra,6000)})();
</script>
</body>
</html>
