<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel Técnico</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a3a5c; --primary-light: #2c5282;
            --accent: #3182CE; --gold: #D69E2E;
            --success: #38A169; --warning: #DD6B20; --danger: #E53E3E;
            --bg: #F0F4F8; --card: #FFFFFF;
            --text: #1A202C; --text2: #4A5568; --muted: #A0AEC0;
            --border: #E2E8F0; --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --radius: 12px; --sidebar-w: 250px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; }
        
        .sidebar {
            width: var(--sidebar-w); min-width: var(--sidebar-w);
            background: linear-gradient(180deg, #0f2840, #1a3a5c);
            position: fixed; left: 0; top: 0; height: 100vh; z-index: 100;
            padding: 20px 14px; display: flex; flex-direction: column;
        }
        .sidebar-header { text-align: center; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 14px; }
        .sidebar-header .logo { font-size: 28px; color: var(--gold); }
        .sidebar-header h2 { font-size: 18px; color: #fff; }
        .sidebar-header small { font-size: 9px; color: var(--gold); letter-spacing: 2px; }
        .user-box { background: rgba(255,255,255,0.04); padding: 10px; border-radius: 8px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .user-box .avatar { width: 34px; height: 34px; background: var(--gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
        .user-box h4 { font-size: 12px; color: #fff; } .user-box small { font-size: 9px; color: rgba(255,255,255,0.5); }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px; cursor: pointer; color: #CBD5E0; font-size: 12px; margin-bottom: 2px; }
        .nav-item:hover, .nav-item.active { background: rgba(214,158,46,0.15); color: #F6E05E; }
        .nav-item i { width: 16px; text-align: center; }
        .btn-logout { width: 100%; padding: 8px; margin-top: auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .main { margin-left: var(--sidebar-w); flex: 1; padding: 20px 24px; }
        .secao { display: none; } .secao.ativa { display: block; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        .top-bar h1 { font-size: 20px; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .stat-card { background: var(--card); padding: 16px; border-radius: var(--radius); display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .stat-icon.blue { background: #DBEAFE; color: #2563EB; } .stat-icon.green { background: #D1FAE5; color: #059669; }
        .stat-icon.amber { background: #FEF3C7; color: #D97706; } .stat-icon.red { background: #FEE2E2; color: #DC2626; }
        .stat-info small { font-size: 9px; color: var(--muted); text-transform: uppercase; display: block; }
        .stat-info strong { font-size: 22px; display: block; }
        
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        .chart-box { background: var(--card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .chart-box h3 { font-size: 13px; margin-bottom: 10px; }
        .chart-box canvas { max-height: 260px; }
        
        .table-box { background: var(--card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow-x: auto; margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #F8FAFC; padding: 8px 10px; text-align: left; font-size: 9px; text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid #F1F5F9; }
        tr:hover td { background: #F8FAFC; cursor: pointer; }
        
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 9px; font-weight: 700; }
        .badge-green { background: #D1FAE5; color: #065F46; } .badge-amber { background: #FEF3C7; color: #92400E; }
        .badge-red { background: #FEE2E2; color: #991B1B; } .badge-blue { background: #DBEAFE; color: #1E40AF; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background: var(--primary); color: #fff; } .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text2); }
        .btn-danger { background: #FEF2F2; color: var(--danger); } .btn-sm { padding: 3px 8px; font-size: 9px; }
        
        .filtros { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .filtros select, .filtros input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-box { background: #fff; border-radius: var(--radius); padding: 20px 24px; width: 90%; max-width: 550px; max-height: 80vh; overflow-y: auto; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 3px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 12px; z-index: 9999; box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .menu-btn { display: none; position: fixed; top: 10px; left: 10px; z-index: 110; background: var(--primary); color: #fff; border: none; width: 36px; height: 36px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); }
            .menu-btn { display: flex; } .main { margin-left: 0; padding: 14px; padding-top: 55px; }
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo"><i class="fas fa-hospital"></i></div>
        <h2>HelpHosp</h2>
        <small>Painel Técnico</small>
    </div>
    <div class="user-box">
        <div class="avatar" id="userAvatar">T</div>
        <div>
            <h4 id="userNome">Carregando...</h4>
            <small id="userInfo">—</small>
        </div>
    </div>
    <nav>
        <div class="nav-item active" data-s="dashboard" onclick="nav('dashboard',this)"><i class="fas fa-chart-pie"></i> Dashboard</div>
        <div class="nav-item" data-s="chamados" onclick="nav('chamados',this)"><i class="fas fa-ticket-alt"></i> Chamados</div>
        <div class="nav-item" data-s="toners" onclick="nav('toners',this)"><i class="fas fa-print"></i> Toners</div>
        <div class="nav-item" data-s="equipamentos" onclick="nav('equipamentos',this)"><i class="fas fa-desktop"></i> Equipamentos</div>
        <div class="nav-item" data-s="ips" onclick="nav('ips',this)"><i class="fas fa-network-wired"></i> IPs & Rede</div>
        <div class="nav-item" data-s="indicadores" onclick="nav('indicadores',this)"><i class="fas fa-chart-line"></i> Indicadores</div>
        <div class="nav-item" data-s="relatorios" onclick="nav('relatorios',this)"><i class="fas fa-file-pdf"></i> Relatórios</div>
        <div class="nav-item" id="navEquipe" style="display:none" data-s="equipe" onclick="nav('equipe',this)"><i class="fas fa-users-cog"></i> Equipe</div>
        <div class="nav-item" data-s="config" onclick="nav('config',this)"><i class="fas fa-cog"></i> Configurações</div>
    </nav>
    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
</div>

<div class="main" id="mainContent">
    <!-- As seções serão carregadas dinamicamente -->
</div>

<script>
// ==================== FIREBASE ====================
var firebaseConfig = {
    apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
    authDomain: "helphosp.firebaseapp.com",
    projectId: "helphosp",
    storageBucket: "helphosp.firebasestorage.app",
    messagingSenderId: "1075623193163",
    appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

// ==================== LOGIN ====================
var u = JSON.parse(localStorage.getItem('usuario_logado'));
if (!u || (u.expira && Date.now() > u.expira)) {
    localStorage.removeItem('usuario_logado');
    window.location.href = 'admin.html';
}

// Renovar sessão
setInterval(function() {
    if (u) { u.expira = Date.now() + (8*60*60*1000); localStorage.setItem('usuario_logado', JSON.stringify(u)); }
}, 300000);

// ==================== VARIÁVEIS ====================
var depto = u.departamento || 'TI';
var nomeDepto = depto === 'TI' ? 'Tecnologia da Informação' : 'Manutenção';
var isAdmin = (u.tipo === 'admin' || u.usuario === 'edson');
var isSupervisor = isAdmin || (u.cargo || '').toLowerCase().indexOf('supervisor') >= 0 || (u.cargo || '').toLowerCase().indexOf('coordenador') >= 0;

var chamados = [], equipamentos = [], ips = [], toners = [], tecnicos = [];
var charts = {};
var editEquipId = null, editTecId = null, comentarioId = null;

var setores = ['Almoxarifado','Centro Cirúrgico','Clínica Cirurgica','Clínica Médica I','Clínica Médica II','Comunicação','Direção Administrativa','Direção Enfermagem','Direção geral','Direção Medica','Emergência/Vermelha','Engenharia Clinica','Farmácia','Faturamento','Fisioterapia','Hotelaria','Juridico','Laboratório','NIR','Nutrição','Oncologia I','Oncologia II','Ouvidoria','Patrimonio','Pediatria','Psicologia','RH','Raio-X','Recepção CR','Recepção Geral','Recepção Nefrologia','Same','Serviço Social','Sesmt','Telemedicina','Tomografia','UTI I','UTI II','Outros'];

var emojis = {
    'Computador':'💻','Notebook':'💻','Monitor':'🖥️','Impressora':'🖨️',
    'Periférico':'🖱️','Telefone':'📞','Rede':'🔌','Nobreak':'🔋',
    'Servidor':'🗄️','Câmera':'📹','Ferramenta':'🔧','Outro':'📦'
};

// ==================== HTML DAS SEÇÕES ====================
var htmlSecoes = {};

htmlSecoes.dashboard = `
<div class="top-bar">
    <h1>📊 Dashboard — ${nomeDepto}</h1>
    <select id="dashPeriodo" onchange="loadDashboard()" style="padding:6px 10px;border:1px solid #ccc;border-radius:6px;">
        <option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option>
    </select>
</div>
<div class="stats" id="dashStats"></div>
<div class="charts">
    <div class="chart-box"><h3>Status</h3><canvas id="chartStatus"></canvas></div>
    <div class="chart-box"><h3>Top Setores</h3><canvas id="chartSetor"></canvas></div>
</div>
<div class="table-box"><h3>Últimos Chamados</h3><table><thead><tr><th>Protocolo</th><th>Data</th><th>Título</th><th>Setor</th><th>Status</th></tr></thead><tbody id="dashUltimos"></tbody></table></div>`;

htmlSecoes.chamados = `
<div class="top-bar"><h1>📋 Chamados — ${nomeDepto}</h1></div>
<div class="table-box">
    <div class="filtros">
        <select id="filtroStatus" onchange="loadChamados()"><option value="">Todos Status</option><option>Aguardando</option><option>A Fazer</option><option>Em Andamento</option><option>Pendente</option><option>Concluído</option></select>
        <select id="filtroPrioridade" onchange="loadChamados()"><option value="">Todas Prioridades</option><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select>
        <input type="text" id="filtroBusca" placeholder="🔍 Buscar..." onkeyup="loadChamados()">
    </div>
    <table><thead><tr><th>Protocolo</th><th>Data</th><th>Título</th><th>Solicitante</th><th>Setor</th><th>Prioridade</th><th>Técnico</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaChamados"></tbody></table>
</div>`;

htmlSecoes.toners = `
<div class="top-bar"><h1>🖨️ Toners</h1><button class="btn btn-primary" onclick="showModal('modalToner')">+ Registrar Troca</button></div>
<div class="table-box"><h3>Histórico</h3><table><thead><tr><th>Setor</th><th>Tipo</th><th>Responsável</th><th>Data</th><th>Dias</th></tr></thead><tbody id="tabelaToners"></tbody></table></div>`;

htmlSecoes.equipamentos = `
<div class="top-bar"><h1>🖥️ Equipamentos</h1><button class="btn btn-primary" onclick="showEquipForm()">+ Novo</button></div>
<div class="table-box"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Qtd</th><th>Local</th><th>Setor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaEquip"></tbody></table></div>`;

htmlSecoes.ips = `
<div class="top-bar"><h1>🌐 IPs & Rede</h1><button class="btn btn-primary" onclick="showModal('modalIP')">+ Novo</button></div>
<div class="table-box"><table><thead><tr><th>Dispositivo</th><th>Tipo</th><th>IP</th><th>Local</th><th>Setor</th><th>Ações</th></tr></thead><tbody id="tabelaIPs"></tbody></table></div>`;

htmlSecoes.indicadores = `
<div class="top-bar"><h1>📊 Indicadores</h1>
    <select id="indPeriodo" onchange="loadIndicadores()" style="padding:6px 10px;border:1px solid #ccc;border-radius:6px;"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select>
</div>
<div class="stats" id="indStats"></div>
<div class="charts">
    <div class="chart-box"><h3>Evolução</h3><canvas id="chartEvolucao"></canvas></div>
    <div class="chart-box"><h3>Resolução</h3><canvas id="chartResolucao"></canvas></div>
</div>`;

htmlSecoes.relatorios = `
<div class="top-bar"><h1>📄 Relatórios</h1></div>
<div class="table-box">
    <h3>Gerar Relatório</h3>
    <select id="relPeriodo" style="padding:6px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;"><option value="7">7 dias</option><option value="30" selected>30 dias</option></select><br>
    <button class="btn btn-primary" onclick="gerarPDF()">📄 Gerar PDF</button>
    <button class="btn btn-outline" onclick="gerarCSV()" style="margin-left:8px;">📊 CSV</button>
</div>`;

htmlSecoes.equipe = `
<div class="top-bar"><h1>👥 Equipe — ${nomeDepto}</h1><button class="btn btn-primary" onclick="showModal('modalTecnico')">+ Novo</button></div>
<div class="table-box"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Cargo</th><th>WhatsApp</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaEquipe"></tbody></table></div>`;

htmlSecoes.config = `
<div class="top-bar"><h1>⚙️ Configurações</h1></div>
<div class="table-box" style="max-width:400px;">
    <h3>Alterar Senha</h3>
    <form onsubmit="alterarSenha(event)" style="display:grid;gap:8px;">
        <div class="form-group"><label>Senha Atual</label><input type="password" id="senhaAtual" required></div>
        <div class="form-group"><label>Nova Senha</label><input type="password" id="senhaNova" required minlength="8"></div>
        <div class="form-group"><label>Confirmar</label><input type="password" id="senhaConf" required minlength="8"></div>
        <button type="submit" class="btn btn-primary">Alterar</button>
    </form>
</div>`;

// ==================== INICIALIZAÇÃO ====================
window.onload = function() {
    document.getElementById('userNome').textContent = u.nome;
    document.getElementById('userInfo').textContent = (u.cargo || 'Técnico') + ' · ' + nomeDepto;
    document.getElementById('userAvatar').textContent = u.nome.charAt(0).toUpperCase();
    if (isSupervisor || isAdmin) document.getElementById('navEquipe').style.display = 'flex';
    
    // Carregar seções
    var main = document.getElementById('mainContent');
    var html = '';
    for (var s in htmlSecoes) {
        html += '<div class="secao' + (s === 'dashboard' ? ' ativa' : '') + '" id="secao-' + s + '">' + htmlSecoes[s] + '</div>';
    }
    // Adicionar modais
    html += `
    <div class="modal" id="modalDetalhes"><div class="modal-box"><div style="display:flex;justify-content:space-between;"><h3>Detalhes</h3><button onclick="hideModal('modalDetalhes')" style="border:none;background:none;font-size:20px;cursor:pointer;">&times;</button></div><div id="detalhesContent"></div></div></div>
    <div class="modal" id="modalComentario"><div class="modal-box"><div style="display:flex;justify-content:space-between;"><h3>💬 Comentários</h3><button onclick="hideModal('modalComentario')" style="border:none;background:none;font-size:20px;cursor:pointer;">&times;</button></div><div id="comentarioContent"></div></div></div>
    <div class="modal" id="modalTecnico"><div class="modal-box"><h3>Técnico</h3><form onsubmit="saveTecnico(event)" style="display:grid;gap:8px;"><div class="form-row"><div class="form-group"><label>Nome *</label><input type="text" id="tecNome" required></div><div class="form-group"><label>Usuário *</label><input type="text" id="tecUsuario" required></div></div><div class="form-row"><div class="form-group"><label>Cargo *</label><select id="tecCargo"></select></div><div class="form-group"><label>WhatsApp *</label><input type="text" id="tecWhatsapp" required></div></div><p style="font-size:10px;color:#999;">Senha inicial: 12345</p><button type="submit" class="btn btn-primary">Salvar</button></form></div></div>
    <div class="modal" id="modalToner"><div class="modal-box"><h3>Registrar Troca</h3><form onsubmit="saveToner(event)" style="display:grid;gap:8px;"><div class="form-group"><label>Setor *</label><select id="tonerSetor" required>${setores.map(function(s){return '<option>'+s+'</option>';}).join('')}</select></div><div class="form-row"><div class="form-group"><label>Tipo</label><select id="tonerTipo"><option value="preventiva">🟢 Preventiva</option><option value="necessaria">🔴 Necessária</option></select></div><div class="form-group"><label>Data</label><input type="date" id="tonerData"></div></div><button type="submit" class="btn btn-primary">Registrar</button></form></div></div>
    <div class="modal" id="modalIP"><div class="modal-box"><h3>Registrar IP</h3><form onsubmit="saveIP(event)" style="display:grid;gap:8px;"><div class="form-row"><div class="form-group"><label>Dispositivo *</label><input type="text" id="ipDisp" required></div><div class="form-group"><label>Tipo</label><select id="ipTipo"><option>Impressora</option><option>Computador</option><option>Roteador</option><option>Switch</option><option>Outro</option></select></div></div><div class="form-row"><div class="form-group"><label>IP *</label><input type="text" id="ipEnd" required></div><div class="form-group"><label>Local</label><input type="text" id="ipLocal"></div></div><div class="form-group"><label>Setor</label><input type="text" id="ipSetor" list="listSetores"><datalist id="listSetores">${setores.map(function(s){return '<option value="'+s+'">';}).join('')}</datalist></div><button type="submit" class="btn btn-primary">Salvar</button></form></div></div>
    <div class="modal" id="modalEquip"><div class="modal-box"><h3 id="equipTitle">Adicionar Equipamento</h3><form onsubmit="saveEquip(event)" style="display:grid;gap:8px;"><div class="form-row"><div class="form-group"><label>Nome *</label><input type="text" id="eqNome" required></div><div class="form-group"><label>Tipo *</label><select id="eqTipo" required onchange="updateEmoji()"><option value="">Selecione...</option>${Object.keys(emojis).map(function(t){return '<option>'+t+'</option>';}).join('')}</select></div></div><div style="text-align:center;font-size:32px;" id="eqEmojiPreview"></div><div class="form-row"><div class="form-group"><label>Qtd</label><input type="number" id="eqQtd" value="1" min="1"></div><div class="form-group"><label>Patrimônio</label><input type="text" id="eqPat"></div></div><div class="form-row"><div class="form-group"><label>Local</label><input type="text" id="eqLocal"></div><div class="form-group"><label>Setor</label><input type="text" id="eqSetor" list="listSetoresEq"><datalist id="listSetoresEq">${setores.map(function(s){return '<option value="'+s+'">';}).join('')}</datalist></div></div><div class="form-group"><label>Status *</label><select id="eqStatus" required><option value="Em uso">🟢 Em uso</option><option value="Com defeito">🔴 Com defeito</option><option value="Em estoque">🟡 Em estoque</option></select></div><button type="submit" class="btn btn-primary">Salvar</button></form></div></div>`;
    
    main.innerHTML = html;
    
    // Popular cargos
    var cargos = depto === 'TI' ? ['Técnico de Suporte TI','Analista de Sistemas','Analista de Redes','Supervisor de TI'] : ['Técnico de Manutenção','Eletricista','Encanador','Técnico de Refrigeração','Pedreiro','Pintor','Marceneiro','Supervisor de Manutenção'];

};

// ==================== NAVEGAÇÃO ====================
function nav(secao, el) {
    document.querySelectorAll('.nav-item').forEach(function(a) { a.classList.remove('active'); });
    document.querySelectorAll('.secao').forEach(function(s) { s.classList.remove('ativa'); });
    if (el) el.classList.add('active');
    var s = document.getElementById('secao-' + secao);
    if (s) s.classList.add('ativa');
    if (window.innerWidth < 1025) document.querySelector('.sidebar').classList.remove('open');
    
    setTimeout(function() {
        if (secao === 'dashboard') loadDashboard();
        if (secao === 'chamados') loadChamados();
        if (secao === 'toners') loadToners();
        if (secao === 'equipamentos') loadEquipamentos();
        if (secao === 'ips') loadIPs();
        if (secao === 'indicadores') loadIndicadores();
        if (secao === 'equipe') loadEquipe();
    }, 100);
}

// ==================== LISTENER ====================
function setupListener() {
    var query;
    if (isAdmin || isSupervisor) {
        query = db.collection('chamados').orderBy('data_abertura', 'desc');
    } else {
        query = db.collection('chamados').where('departamento', '==', depto).orderBy('data_abertura', 'desc');
    }
    query.onSnapshot(function(snap) {
        chamados = [];
        snap.forEach(function(doc) {
            var d = doc.data(); d.fid = doc.id; chamados.push(d);
        });
        if (document.getElementById('secao-dashboard') && document.getElementById('secao-dashboard').classList.contains('ativa')) loadDashboard();
        if (document.getElementById('secao-chamados') && document.getElementById('secao-chamados').classList.contains('ativa')) loadChamados();
    }, function(err) {
        console.error('Erro listener:', err);
    });
}

// ==================== FORMATAÇÃO ====================
function fd(d) {
    if (!d) return '—';
    try { var dt = typeof d.toDate === 'function' ? d.toDate() : new Date(d); return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}); } catch(e) { return '—'; }
}
function tr(d) {
    if (!d) return '—';
    try { var dt = typeof d.toDate === 'function' ? d.toDate() : new Date(d); var diff = Math.floor((Date.now()-dt)/1000); if (diff<60) return 'agora'; if (diff<3600) return Math.floor(diff/60)+'min'; if (diff<86400) return Math.floor(diff/3600)+'h'; return Math.floor(diff/86400)+'d'; } catch(e) { return '—'; }
}
function nomeSetor(s) { return s === 'N/I' ? 'Cadastro GestHosp' : (s || '—'); }

// ==================== DASHBOARD ====================
function loadDashboard() {
    var p = parseInt(document.getElementById('dashPeriodo') ? document.getElementById('dashPeriodo').value : 30);
    var dl = new Date(); dl.setDate(dl.getDate() - p);
    var f = chamados.filter(function(c) {
        if (!c.data_abertura || c.tipo === 'toner') return false;
        var dt = typeof c.data_abertura.toDate === 'function' ? c.data_abertura.toDate() : new Date(c.data_abertura);
        return dt >= dl;
    });
    
    var total = f.length;
    var ag = f.filter(function(c) { return c.status === 'Aguardando' || c.status === 'A Fazer'; }).length;
    var ea = f.filter(function(c) { return c.status === 'Em Andamento'; }).length;
    var co = f.filter(function(c) { return c.status === 'Concluído'; }).length;
    var pe = f.filter(function(c) { return c.status === 'Pendente'; }).length;
    
    var el = document.getElementById('dashStats');
    if (el) el.innerHTML = `
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-clipboard-list"></i></div><div class="stat-info"><small>Total</small><strong>${total}</strong></div></div>
        <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-clock"></i></div><div class="stat-info"><small>Aguardando</small><strong>${ag}</strong></div></div>
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-spinner"></i></div><div class="stat-info"><small>Em Andamento</small><strong>${ea}</strong></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><small>Concluídos</small><strong>${co}</strong></div></div>
        <div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><small>Pendentes</small><strong>${pe}</strong></div></div>`;
    
    // Gráficos
    var ctx1 = document.getElementById('chartStatus');
    if (ctx1) {
        if (charts.st) charts.st.destroy();
        charts.st = new Chart(ctx1, {type:'doughnut',data:{labels:['Aguardando','Em Andamento','Pendente','Concluído'],datasets:[{data:[ag,ea,pe,co],backgroundColor:['#F59E0B','#3B82F6','#EF4444','#10B981']}]},options:{responsive:true,cutout:'60%',plugins:{legend:{position:'bottom',labels:{font:{size:9}}}}}});
    }
    
    var setorCount = {};
    f.forEach(function(c) { var s = nomeSetor(c.setor); setorCount[s] = (setorCount[s]||0)+1; });
    var top = Object.entries(setorCount).sort(function(a,b) { return b[1]-a[1]; }).slice(0,8);
    var ctx2 = document.getElementById('chartSetor');
    if (ctx2 && top.length > 0) {
        if (charts.se) charts.se.destroy();
        charts.se = new Chart(ctx2, {type:'bar',data:{labels:top.map(function(s){return s[0];}),datasets:[{data:top.map(function(s){return s[1];}),backgroundColor:'rgba(124,58,237,0.7)',borderRadius:4}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}}}});
    }
    
    var tb = document.getElementById('dashUltimos');
    if (tb) tb.innerHTML = f.slice(0,8).map(function(c) {
        var sc = c.status === 'Concluído' ? 'badge-green' : c.status === 'Pendente' ? 'badge-red' : 'badge-amber';
        return `<tr onclick="verDetalhes('${c.fid}')"><td><strong>${c.protocolo||'—'}</strong></td><td>${tr(c.data_abertura)}</td><td>${c.titulo||'—'}</td><td>${nomeSetor(c.setor)}</td><td><span class="badge ${sc}">${c.status||'—'}</span></td></tr>`;
    }).join('') || '<tr><td colspan="5" style="text-align:center;padding:20px;">Nenhum chamado</td></tr>';
}

// ==================== CHAMADOS ====================
function loadChamados() {
    var fs = document.getElementById('filtroStatus') ? document.getElementById('filtroStatus').value : '';
    var fp = document.getElementById('filtroPrioridade') ? document.getElementById('filtroPrioridade').value : '';
    var fb = (document.getElementById('filtroBusca') ? document.getElementById('filtroBusca').value : '').toLowerCase();
    
    var f = chamados.filter(function(c) {
        if (c.tipo === 'toner') return false;
        if (fs && c.status !== fs) return false;
        if (fp && c.prioridade !== fp) return false;
        if (fb && !(c.titulo||'').toLowerCase().includes(fb) && !(c.protocolo||'').toLowerCase().includes(fb)) return false;
        return true;
    });
    
    var tb = document.getElementById('tabelaChamados');
    if (!tb) return;
    
    tb.innerHTML = f.map(function(c) {
        var sc = c.status === 'Concluído' ? 'badge-green' : c.status === 'Pendente' ? 'badge-red' : 'badge-amber';
        var acoes = '';
        if (c.status === 'Aguardando' || c.status === 'A Fazer') {
            acoes += `<button class="btn btn-sm btn-success" onclick="event.stopPropagation();pegar('${c.fid}')">✋ Pegar</button> `;
        }
        if (c.tecnico === u.nome && c.status !== 'Concluído') {
            acoes += `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();avancar('${c.fid}')">▶</button> `;
        }
        acoes += `<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();abrirComentario('${c.fid}')">💬</button>`;
        
        return `<tr onclick="verDetalhes('${c.fid}')">
            <td><strong>${c.protocolo||'—'}</strong></td><td>${tr(c.data_abertura)}</td><td>${c.titulo||'—'}</td>
            <td>${c.solicitante||'—'}</td><td>${nomeSetor(c.setor)}</td>
            <td style="color:${c.prioridade==='Crítica'?'red':c.prioridade==='Alta'?'#D97706':'inherit'};">${c.prioridade||'—'}</td>
            <td>${c.tecnico||'<span style="color:#D97706;">Aguardando</span>'}</td>
            <td><span class="badge ${sc}">${c.status||'—'}</span></td>
            <td onclick="event.stopPropagation();">${acoes}</td></tr>`;
    }).join('') || '<tr><td colspan="9" style="text-align:center;padding:20px;">Nenhum chamado</td></tr>';
}

// ==================== AÇÕES ====================
function pegar(id) {
    db.collection('chamados').doc(id).update({status:'Em Andamento',tecnico:u.nome}).then(function() { toast('✅ Chamado assumido!'); });
}
function avancar(id) {
    var fluxo = {'A Fazer':'Em Andamento','Aguardando':'Em Andamento','Em Andamento':'Pendente','Pendente':'Concluído','Concluído':'A Fazer'};
    var c = chamados.find(function(x) { return x.fid === id; });
    if (!c) return;
    var ns = fluxo[c.status] || 'A Fazer';
    var upd = {status:ns, tecnico:u.nome};
    if (ns === 'Concluído') upd.data_conclusao = firebase.firestore.Timestamp.now();
    db.collection('chamados').doc(id).update(upd).then(function() { toast('✅ '+ns); });
}
function excluirChamado(id) {
    if (!confirm('Excluir?')) return;
    db.collection('chamados').doc(id).delete().then(function() { toast('🗑️ Excluído!'); });
}
function verDetalhes(fid) {
    var c = chamados.find(function(x) { return x.fid === fid; });
    if (!c) return;
    var h = '<h3>'+(c.titulo||'—')+'</h3><span class="badge badge-amber">'+(c.protocolo||'')+'</span> <span class="badge '+(c.status==='Concluído'?'badge-green':'badge-blue')+'">'+(c.status||'—')+'</span>';
    h += '<div style="margin-top:10px;font-size:12px;"><p><strong>👤:</strong> '+(c.solicitante||'—')+'</p><p><strong>📍:</strong> '+nomeSetor(c.setor)+'</p><p><strong>⚡:</strong> '+(c.prioridade||'—')+'</p><p><strong>👨‍🔧:</strong> '+(c.tecnico||'Não atribuído')+'</p><p><strong>🕐:</strong> '+fd(c.data_abertura)+'</p></div>';
    if (c.descricao) h += '<div style="background:#F8FAFC;padding:10px;border-radius:6px;margin:8px 0;"><strong>📝:</strong> '+c.descricao.replace(/\n/g,'<br>')+'</div>';
    document.getElementById('detalhesContent').innerHTML = h;
    showModal('modalDetalhes');
}
function abrirComentario(fid) {
    comentarioId = fid;
    var c = chamados.find(function(x) { return x.fid === fid; });
    if (!c) return;
    var coms = c.comentarios || [];
    var h = '<p><strong>'+(c.protocolo||'')+'</strong></p><div style="max-height:200px;overflow-y:auto;margin-bottom:8px;">';
    if (coms.length === 0) h += '<p style="color:#999;">Nenhum</p>';
    else coms.forEach(function(cm) { h += '<div style="background:#F0FDF4;padding:6px;border-radius:4px;margin-bottom:3px;"><strong>'+cm.autor+'</strong><p>'+cm.texto+'</p></div>'; });
    h += '</div><div style="display:flex;gap:4px;"><textarea id="txtCom" placeholder="Escreva..." style="flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:11px;height:30px;"></textarea><button class="btn btn-primary btn-sm" onclick="saveComentario()">Enviar</button></div>';
    document.getElementById('comentarioContent').innerHTML = h;
    showModal('modalComentario');
}
function saveComentario() {
    var t = document.getElementById('txtCom').value.trim();
    if (!t) { toast('⚠️ Digite algo!'); return; }
    db.collection('chamados').doc(comentarioId).get().then(function(doc) {
        var coms = doc.data().comentarios || [];
        coms.push({autor:u.nome, data:new Date().toISOString(), texto:t});
        doc.ref.update({comentarios:coms}).then(function() { hideModal('modalComentario'); toast('💬 Salvo!'); });
    });
}

function loadIndicadores() {
    var p = parseInt(document.getElementById('indPeriodo') ? document.getElementById('indPeriodo').value : 30);

    var f = chamados.filter(function(c) {

    });

    if (el) el.innerHTML = `
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-clipboard-list"></i></div><div class="stat-info"><small>Total</small><strong>${total}</strong></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><small>Resolução</small><strong>${taxa}%</strong></div></div>
        <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-clock"></i></div><div class="stat-info"><small>Pendentes</small><strong>${f.filter(function(c){return c.status==='Pendente';}).length}</strong></div></div>`;
    
    var ctx1 = document.getElementById('chartEvolucao');
    if (ctx1) {
        var evo = {};
        for (var i=6; i>=0; i--) { var d = new Date(); d.setDate(d.getDate()-i); evo[d.toISOString().slice(0,10)] = 0; }
        f.filter(function(c) { return new Date(typeof c.data_abertura.toDate==='function'?c.data_abertura.toDate():c.data_abertura) >= new Date(Date.now()-7*86400000); }).forEach(function(c) { var k = new Date(typeof c.data_abertura.toDate==='function'?c.data_abertura.toDate():c.data_abertura).toISOString().slice(0,10); if (evo[k]!==undefined) evo[k]++; });
        if (charts.ev) charts.ev.destroy();
        charts.ev = new Chart(ctx1, {type:'line',data:{labels:Object.keys(evo),datasets:[{data:Object.values(evo),borderColor:'#3B82F6',fill:true,backgroundColor:'rgba(59,130,246,0.1)'}]},options:{responsive:true,plugins:{legend:{display:false}}}});
    }
    
    var ctx2 = document.getElementById('chartResolucao');
    if (ctx2) {
        if (charts.re) charts.re.destroy();
        charts.re = new Chart(ctx2, {type:'doughnut',data:{labels:['Resolvidos','Pendentes'],datasets:[{data:[co,Math.max(0,total-co)],backgroundColor:['#10B981','rgba(239,68,68,0.2)']}]},options:{responsive:true,cutout:'60%',plugins:{legend:{position:'bottom',labels:{font:{size:9}}}}}});
    }
}

// ==================== RELATÓRIOS ====================
function gerarPDF() {
    var p = parseInt(document.getElementById('relPeriodo') ? document.getElementById('relPeriodo').value : 30);
    var dl = new Date(); dl.setDate(dl.getDate() - p);
    var f = chamados.filter(function(c) {
        var dt = c.data_abertura ? (typeof c.data_abertura.toDate==='function'?c.data_abertura.toDate():new Date(c.data_abertura)) : null;
        return dt && dt >= dl;
    });
    var el = document.createElement('div');
    el.style.cssText = 'padding:20px;background:#fff;font-family:Arial;width:1000px;position:absolute;left:-9999px;';
    el.innerHTML = '<h1>HelpHosp - Relatório</h1><p>'+nomeDepto+' | '+new Date().toLocaleString('pt-BR')+'</p><p>Total: '+f.length+' | Concluídos: '+f.filter(function(c){return c.status==='Concluído';}).length+'</p>';
    el.innerHTML += '<table style="width:100%;border-collapse:collapse;font-size:9px;"><tr style="background:#1a3a5c;color:#fff;"><th>Protocolo</th><th>Data</th><th>Título</th><th>Setor</th><th>Status</th></tr>';
    f.slice(0,40).forEach(function(c) { el.innerHTML += '<tr><td>'+c.protocolo+'</td><td>'+fd(c.data_abertura)+'</td><td>'+c.titulo+'</td><td>'+nomeSetor(c.setor)+'</td><td>'+c.status+'</td></tr>'; });
    el.innerHTML += '</table>';
    document.body.appendChild(el);
    html2canvas(el,{scale:2}).then(function(canvas) {
        document.body.removeChild(el);
        var pdf = new jspdf.jsPDF('p','mm','a4');
        pdf.addImage(canvas.toDataURL('image/png'),'PNG',5,5,200,(canvas.height*200)/canvas.width);
        pdf.save('relatorio_'+new Date().toISOString().slice(0,10)+'.pdf');
        toast('📄 PDF gerado!');
    });
}
function gerarCSV() {
    var csv = 'Protocolo,Data,Título,Solicitante,Setor,Prioridade,Técnico,Status\n';
    chamados.forEach(function(c) { csv += (c.protocolo||'')+','+fd(c.data_abertura)+',"'+c.titulo+'",'+c.solicitante+','+c.setor+','+c.prioridade+','+(c.tecnico||'')+','+c.status+'\n'; });
    var blob = new Blob(['\uFEFF'+csv],{type:'text/csv'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chamados.csv'; a.click();
    toast('📊 CSV exportado!');
}

// ==================== CONFIG ====================
function alterarSenha(e) {
    e.preventDefault();
    var sa = document.getElementById('senhaAtual').value;
    var sn = document.getElementById('senhaNova').value;
    var sc = document.getElementById('senhaConf').value;
    if (sn !== sc) { toast('❌ Senhas não conferem!'); return; }
    if (sn.length < 8) { toast('❌ Mínimo 8 caracteres!'); return; }
    db.collection('usuarios').where('usuario','==',u.usuario).get().then(function(snap) {
        if (snap.empty) return;
        var doc = snap.docs[0];
        if (doc.data().senha !== sa) { toast('❌ Senha atual incorreta!'); return; }
        doc.ref.update({senha:sn,primeiro_acesso:false}).then(function() { toast('✅ Senha alterada!'); e.target.reset(); });
    });
}

// ==================== UTILITÁRIOS ====================
function toast(m) { var t = document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function() { t.remove(); },3000); }
function showModal(id) { document.getElementById(id).classList.add('show'); }
function hideModal(id) { document.getElementById(id).classList.remove('show'); }
function logout() { localStorage.removeItem('usuario_logado'); window.location.href='admin.html'; }

document.addEventListener('click', function(e) { if (e.target.classList.contains('modal') && e.target.classList.contains('show')) e.target.classList.remove('show'); });
</script>
