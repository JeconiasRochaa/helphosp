<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel Técnico</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#F0F4F8;--card:#FFFFFF;--sidebar:#06224a;--primary:#06224a;--gold:#c8a94a;--success:#38A169;--warning:#DD6B20;--danger:#E53E3E;--text:#1A202C;--border:#E2E8F0;--radius:12px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:15px}
        .sidebar{width:270px;min-width:270px;background:var(--sidebar);position:fixed;left:0;top:0;height:100vh;z-index:100;display:flex;flex-direction:column;padding:24px 16px;overflow-y:auto;box-shadow:2px 0 20px rgba(0,0,0,0.1)}
        .sidebar-header{text-align:center;padding:10px 0 18px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:16px}
        .logo{width:65px;height:65px;margin:0 auto 10px;border:2px solid rgba(200,169,74,0.5);border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(200,169,74,0.08)}
        .logo i{font-size:28px;color:var(--gold)}
        .sidebar-header h2{font-size:20px;font-weight:700}.help{color:#c9d2df}.hosp{color:#FFF}
        .subtitle{font-size:8px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
        .user-box{background:rgba(255,255,255,0.04);padding:12px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
        .user-avatar{width:38px;height:38px;background:linear-gradient(135deg,var(--gold),#b8861e);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
        .user-details h4{font-size:13px;color:#FFF}.user-details small{font-size:10px;color:rgba(255,255,255,0.5)}
        .nav-section{margin-bottom:8px}.nav-title{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.3);margin-bottom:4px;padding-left:8px;font-weight:700}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all 0.2s;margin-bottom:2px;color:#CBD5E0;font-size:13px}
        .nav-item:hover{background:rgba(255,255,255,0.05);color:#FFF}.nav-item.active{background:rgba(200,169,74,0.15);color:#F6E05E}
        .nav-item i{width:18px;text-align:center}
        .badge-notify{background:var(--danger);color:#fff;border-radius:50%;min-width:20px;height:20px;text-align:center;line-height:20px;font-size:10px;font-weight:700;display:none;margin-left:auto}
        .sidebar-footer{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)}
        .btn-logout{width:100%;padding:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
        .btn-logout:hover{background:rgba(229,62,62,0.15);color:#FCA5A5}
        .main-content{margin-left:270px;flex:1;padding:24px 28px;min-height:100vh}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}.top-bar h1{font-size:20px;font-weight:700}
        .info-bar{background:linear-gradient(135deg,#06224a 0%,#1a3a5c 100%);color:white;padding:16px 20px;border-radius:var(--radius);margin-bottom:16px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px}
        .info-bar .info-item{text-align:center;min-width:70px}.info-bar .info-val{font-size:28px;font-weight:700}.info-bar .info-lbl{font-size:10px;opacity:0.8;text-transform:uppercase}
        .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
        .chart-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
        .chart-card h3{font-size:14px;margin-bottom:12px;font-weight:600}.chart-card canvas{width:100%!important;height:200px!important;max-height:200px!important}
        .table-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);overflow-x:auto;margin-bottom:14px}
        table{width:100%;border-collapse:collapse;font-size:12px}
        th{background:#F7FAFC;color:#4A5568;padding:10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;border-bottom:2px solid #E2E8F0;white-space:nowrap}
        td{padding:9px 10px;border-bottom:1px solid #EDF2F7;font-size:12px}tr:nth-child(even) td{background:#FAFBFC}tr:hover td{background:#F0F4F8;cursor:pointer}
        .badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700}
        .badge-blue{background:#DBEAFE;color:#1D4ED8}.badge-green{background:#D1FAE5;color:#065F46}.badge-amber{background:#FEF3C7;color:#92400E}.badge-red{background:#FEE2E2;color:#991B1B}
        .btn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
        .btn-primary{background:var(--primary);color:#fff}.btn-outline{background:transparent;border:1.5px solid #E2E8F0;color:#4A5568}.btn-danger{background:#FFF5F5;color:#E53E3E;border:1px solid #FED7D7}.btn-sm{padding:4px 8px;font-size:10px;border-radius:5px}
        .filtros-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.filtros-bar select,.filtros-bar input{padding:8px 10px;background:#FFF;border:1.5px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none}.filtros-bar input{flex:1;min-width:140px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px);z-index:200;align-items:center;justify-content:center}
        .modal-overlay.ativa{display:flex}.modal-box{background:#FFF;border-radius:var(--radius);padding:24px;width:92%;max-width:750px;max-height:85vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.15)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:#A0AEC0}
        .form-group{margin-bottom:10px}.form-group label{display:block;font-size:11px;font-weight:700;margin-bottom:3px;color:#4A5568;text-transform:uppercase}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;outline:none}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .toast{position:fixed;bottom:24px;right:24px;background:#FFF;border-left:4px solid #3182CE;padding:12px 18px;border-radius:8px;font-weight:600;font-size:13px;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,0.1);animation:toastIn 0.3s}.toast.error{border-left-color:#E53E3E}.toast.success{border-left-color:#38A169}
        @keyframes toastIn{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
        .menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:110;background:var(--primary);color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
        @media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.menu-toggle{display:flex;align-items:center;justify-content:center}.main-content{margin-left:0;padding:14px;padding-top:55px}.charts-grid{grid-template-columns:1fr}}
        @media(max-width:640px){.form-row{grid-template-columns:1fr}}
    </style>
</head>
<body>
<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo"><i class="fas fa-hospital"></i></div><h2><span class="help">Help</span><span class="hosp">Hosp</span></h2><div class="subtitle">Painel Técnico</div></div>
    <div class="user-box"><div class="user-avatar" id="userAvatar">T</div><div class="user-details"><h4 id="userName">—</h4><small id="userRole">—</small></div></div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-footer"><button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button></div>
</aside>
<main class="main-content" id="mainContent"><div style="text-align:center;padding:60px;"><h3>🔄 Carregando...</h3></div></main>

<script>
// FIREBASE
const fc={apiKey:"AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",authDomain:"helphosp.firebaseapp.com",projectId:"helphosp",storageBucket:"helphosp.firebasestorage.app",messagingSenderId:"1075623193163",appId:"1:1075623193163:web:cf54ee082d1c97a9aa7bce"};
firebase.initializeApp(fc);const db=firebase.firestore();const storage=firebase.storage();

let setores=[],departamentosChamados=['TI','MANUTENCAO'],usuarioLogado=null,depto='TI',nomeDepto='Tecnologia da Informação';
let chamados=[],inventario=[],estoque=[],movimentacoes=[],charts={},comentarioChamadoId=null;

function toast(m,t='info'){const e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=`<i class="fas fa-${t==='success'?'check-circle':t==='error'?'exclamation-circle':'info-circle'}"></i> ${m}`;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function fmtData(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt.getTime()))return'—';return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function fmtDataCurta(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt.getTime()))return'—';const a=new Date();const diff=Math.floor((a-dt)/1000);if(diff<60)return'agora';if(diff<3600)return Math.floor(diff/60)+'min';if(diff<86400)return Math.floor(diff/3600)+'h';return Math.floor(diff/86400)+'d'}catch(e){return'—'}}
function toDate(d){if(!d)return new Date(0);return d?.toDate?d.toDate():new Date(d)}
function sanitizar(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function getStatusClass(s){const c={'Concluído':'badge-green','Em Andamento':'badge-amber','Pendente':'badge-red','A Fazer':'badge-blue'};return c[s]||'badge-blue'}
function getPrioridadeClass(p){const c={'Baixa':'badge-blue','Média':'badge-amber','Alta':'badge-red','Crítica':'badge-red'};return c[p]||'badge-blue'}
function abrirModal(conteudo,mw='750px'){const m=document.createElement('div');m.className='modal-overlay ativa';m.innerHTML=`<div class="modal-box" style="max-width:${mw};">${conteudo}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m}

function checkAuth(){const u=localStorage.getItem('usuario_logado');if(!u){window.location.href='admin.html';return false}try{usuarioLogado=JSON.parse(u);if(usuarioLogado.expira&&Date.now()>usuarioLogado.expira){localStorage.removeItem('usuario_logado');window.location.href='admin.html';return false}depto=usuarioLogado.departamento||'TI';nomeDepto=depto==='TI'?'Tecnologia da Informação':'Manutenção';return true}catch(e){localStorage.removeItem('usuario_logado');window.location.href='admin.html';return false}}
function getPerms(){const isAdmin=usuarioLogado.tipo==='admin'||usuarioLogado.usuario==='edson';return{isAdmin,isTI:depto==='TI',isManut:depto==='MANUTENCAO',podeEquipe:isAdmin||(depto==='MANUTENCAO'&&(usuarioLogado.usuario==='bruno'||usuarioLogado.usuario==='benicio'))}}
function logout(){if(confirm('Sair?')){localStorage.removeItem('usuario_logado');window.location.href='admin.html'}}

async function loadConfig(){try{const ds=await db.collection('configuracoes').doc('setores').get();if(ds.exists&&ds.data().setores)setores=ds.data().setores;else setores=['Administração','Almoxarifado','CAF Principal','CAF CR','Centro Cirúrgico','Clínica Cirurgica','Clínica Médica I','Clínica Médica II','Comunicação','Direção Administrativa','Direção Enfermagem','Direção geral','Direção Medica','Emergência/Vermelha','Engenharia Clinica','Farmácia','Faturamento','Fisioterapia','Hotelaria','Juridico','Laboratório','Manutenção','NIR','Nutrição','Oncologia I','Oncologia II','Outros','Ouvidoria','Patrimonio','Pediatria','Psicologia','RH','Raio-X','Recepção CR','Recepção Geral','Recepção Nefrologia','Same','Serviço Social','Sesmt','Telemedicina','TI','Tomografia','UTI I','UTI II'];const dd=await db.collection('configuracoes').doc('departamentos_chamados').get();if(dd.exists&&dd.data().departamentos)departamentosChamados=dd.data().departamentos}catch(e){}

function chamadoPertenceAoDepartamento(chamado){const p=getPerms();if(p.isAdmin)return true;const depChamado=(chamado.departamento||'').trim().toUpperCase();const meuDepto=depto.trim().toUpperCase();if(meuDepto==='TI')return depChamado==='TI'||depChamado===''||chamado.tipo==='gesthosp'||!chamado.departamento;if(meuDepto==='MANUTENCAO')return depChamado==='MANUTENCAO';return depChamado===meuDepto}

function initUI(){document.getElementById('userName').textContent=usuarioLogado.nome;document.getElementById('userRole').textContent=`${usuarioLogado.cargo} · ${nomeDepto}`;document.getElementById('userAvatar').textContent=usuarioLogado.nome.charAt(0).toUpperCase();buildMenu();carregarTodosDados()}
function buildMenu(){const p=getPerms();const nav=document.getElementById('sidebarNav');let h='<div class="nav-section"><div class="nav-title">Principal</div>';h+=navItem('dashboard','chart-pie','Dashboard',true);h+=navItem('chamados','ticket-alt','Chamados',false,'badgeChamados');h+=navItem('indicadores','chart-line','Indicadores');if(p.isTI||p.isAdmin)h+=navItem('gesthosp','hospital-user','GestHosp',false,'badgeGestHosp');h+='</div><div class="nav-section"><div class="nav-title">Gestão</div>';if(p.isTI||p.isAdmin){h+=navItem('toners','print','Toners');h+=navItem('estoque','box','Estoque');h+=navItem('inventario','clipboard-list','Inventário');h+=navItem('ips','network-wired','IPs & Rede')}if(p.podeEquipe)h+=navItem('equipe','users-cog','Equipe');h+='</div><div class="nav-section"><div class="nav-title">Recursos</div>';h+=navItem('arquivos','folder-open','Arquivos');h+=navItem('agenda','calendar-alt','Agenda',false,'badgeAgenda');h+=navItem('config','cog','Configurações');h+='</div>';nav.innerHTML=h}
function navItem(s,ic,tx,at=false,bd=null){const bc=bd==='badgeAgenda'?'badge-notify agenda':'badge-notify';const badge=bd?`<span class="${bc}" id="${bd}">0</span>`:'';return`<div class="nav-item${at?' active':''}" data-secao="${s}" onclick="navegar('${s}',this)"><i class="fas fa-${ic}"></i><span>${tx}</span>${badge}</div>`}
function navegar(s,el){document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));if(el)el.classList.add('active');if(window.innerWidth<1025)document.getElementById('sidebar').classList.remove('open');switch(s){case'dashboard':renderDashboard();break;case'chamados':renderChamados();break;case'gesthosp':renderGestHosp();break;case'indicadores':renderIndicadores();break;case'toners':renderToners();break;case'estoque':renderEstoque();break;case'inventario':renderInventario();break;case'ips':renderIPs();break;case'equipe':renderEquipe();break;case'arquivos':renderArquivos();break;case'agenda':renderAgenda();break;case'config':renderConfig();break}}

async function carregarTodosDados(){try{const sc=await db.collection('chamados').orderBy('data_abertura','desc').get();chamados=[];sc.forEach(d=>{const x=d.data();x.fid=d.id;if(chamadoPertenceAoDepartamento(x))chamados.push(x)});console.log('📋 '+chamados.length+' chamados para '+depto);const si=await db.collection('inventario').get();inventario=[];si.forEach(d=>{const x=d.data();x.fid=d.id;inventario.push(x)});const se=await db.collection('estoque').get();estoque=[];se.forEach(d=>{const x=d.data();x.fid=d.id;estoque.push(x)});const sm=await db.collection('movimentacoes').orderBy('data','desc').limit(100).get();movimentacoes=[];sm.forEach(d=>{const x=d.data();x.fid=d.id;movimentacoes.push(x)});renderDashboard();escutarChamados();atualizarBadges();verificarAgenda()}catch(e){console.error(e);renderDashboard()}}

function escutarChamados(){if(window._listenerChamados)window._listenerChamados();window._listenerChamados=db.collection('chamados').orderBy('data_abertura','desc').onSnapshot(snap=>{snap.docChanges().forEach(change=>{const doc=change.doc;const dados=doc.data();dados.fid=doc.id;if(change.type==='added'){if(chamadoPertenceAoDepartamento(dados)){const existe=chamados.findIndex(c=>c.fid===doc.id);if(existe===-1)chamados.push(dados)}}if(change.type==='modified'){const index=chamados.findIndex(c=>c.fid===doc.id);if(index!==-1){if(chamadoPertenceAoDepartamento(dados))chamados[index]=dados;else chamados.splice(index,1)}else if(chamadoPertenceAoDepartamento(dados))chamados.push(dados)}if(change.type==='removed'){const index=chamados.findIndex(c=>c.fid===doc.id);if(index!==-1)chamados.splice(index,1)}});chamados.sort((a,b)=>toDate(b.data_abertura)-toDate(a.data_abertura));atualizarBadges();verificarAgenda();if(document.getElementById('infoTotal'))atualizarDashboard();if(document.getElementById('tabelaChamados')){const sf=document.getElementById('filtroStatus')?.value||'';const pf=document.getElementById('filtroPrioridade')?.value||'';const bf=(document.getElementById('filtroBusca')?.value||'').toLowerCase();let l=chamados.filter(c=>c.tipo!=='gesthosp');if(sf)l=l.filter(c=>c.status===sf);if(pf)l=l.filter(c=>c.prioridade===pf);if(bf)l=l.filter(c=>(c.titulo||'').toLowerCase().includes(bf)||(c.protocolo||'').toLowerCase().includes(bf));document.getElementById('tabelaChamados').innerHTML=renderLinhasChamados(l)}}},error=>{console.error('Listener:',error);setTimeout(()=>escutarChamados(),3000)})}
function atualizarBadges(){const b1=document.getElementById('badgeChamados'),b2=document.getElementById('badgeGestHosp');if(b1){const n=chamados.filter(c=>c.tipo!=='gesthosp'&&c.status!=='Concluído').length;b1.style.display=n>0?'inline-block':'none';b1.textContent=n>99?'99+':n}if(b2){const n=chamados.filter(c=>c.tipo==='gesthosp'&&c.status!=='Concluído').length;b2.style.display=n>0?'inline-block':'none';b2.textContent=n>99?'99+':n}}
async function verificarAgenda(){try{const h=new Date();h.setHours(0,0,0,0);const s=await db.collection('agenda').where('data','>=',firebase.firestore.Timestamp.fromDate(h)).get();const b=document.getElementById('badgeAgenda');if(b){b.style.display=s.size>0?'inline-block':'none';b.textContent=s.size}}catch(e){}}

// DASHBOARD
function renderDashboard(){const main=document.getElementById('mainContent');const p=getPerms();let te=0,tc=0,ti=0,tEst=0;if(p.isTI||p.isAdmin){inventario.forEach(i=>{tc+=i.computadores||0;ti+=i.impressoras||0;te+=(i.computadores||0)+(i.impressoras||0)+(i.ramais||0)+(i.tvs||0)+(i.redes||0)+(i.outros||0)});tEst=estoque.reduce((s,e)=>s+(e.quantidade||0),0)}let statsHTML='';if(p.isTI||p.isAdmin){statsHTML=`<div class="stats-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px"><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);cursor:pointer" onclick="navegar('inventario',document.querySelector('[data-secao=inventario]'))"><div style="width:42px;height:42px;background:#EDE9FE;color:#7C3AED;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-desktop"></i></div><div><small style="font-size:10px;color:#A0AEC0">Total Equipamentos</small><strong style="font-size:22px;display:block">${te}</strong></div></div><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)"><div style="width:42px;height:42px;background:#DBEAFE;color:#3182CE;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-laptop"></i></div><div><small style="font-size:10px;color:#A0AEC0">Computadores</small><strong style="font-size:22px;display:block">${tc}</strong></div></div><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)"><div style="width:42px;height:42px;background:#D1FAE5;color:#38A169;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-print"></i></div><div><small style="font-size:10px;color:#A0AEC0">Impressoras</small><strong style="font-size:22px;display:block">${ti}</strong></div></div><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)" onclick="navegar('estoque',document.querySelector('[data-secao=estoque]'))"><div style="width:42px;height:42px;background:#FEF3C7;color:#DD6B20;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-box"></i></div><div><small style="font-size:10px;color:#A0AEC0">Estoque</small><strong style="font-size:22px;display:block">${tEst}</strong></div></div></div>`}main.innerHTML=`<div class="top-bar"><h1>📊 Dashboard — ${sanitizar(nomeDepto)}</h1><div style="display:flex;gap:6px;"><select id="periodo" onchange="atualizarDashboard()" style="padding:6px 8px;border:1.5px solid #E2E8F0;border-radius:6px;font-size:12px;"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select><button class="btn btn-primary" onclick="gerarRelatorioPDF()"><i class="fas fa-file-pdf"></i> Relatório</button></div></div><div class="info-bar"><div class="info-item"><div class="info-val" id="infoTotal">0</div><div class="info-lbl">Chamados</div></div><div class="info-item"><div class="info-val" id="infoAbertos" style="color:#FBD38D;">0</div><div class="info-lbl">Abertos</div></div><div class="info-item"><div class="info-val" id="infoConcluidos" style="color:#68D391;">0</div><div class="info-lbl">Concluídos</div></div><div class="info-item"><div class="info-val" id="infoCriticos" style="color:#FC8181;">0</div><div class="info-lbl">Críticos</div></div><div class="info-item"><div class="info-val" id="infoTaxa" style="color:#63B3ED;">0%</div><div class="info-lbl">Resolução</div></div></div>${statsHTML}<div class="charts-grid"><div class="chart-card"><h3>📈 Por Setor</h3><canvas id="graficoSetor"></canvas></div><div class="chart-card"><h3>🎯 Por Prioridade</h3><canvas id="graficoPrioridade"></canvas></div></div><div class="table-card"><h3>🚨 Últimos Chamados</h3><table><thead><tr><th>Protocolo</th><th>Data</th><th>Título</th><th>Setor</th><th>Prioridade</th><th>Status</th></tr></thead><tbody id="ultimosChamados"></tbody></table></div>`;atualizarDashboard()}
function atualizarDashboard(){const p=parseInt(document.getElementById('periodo')?.value||30);const dl=new Date();dl.setDate(dl.getDate()-p);const f=chamados.filter(c=>{const d=toDate(c.data_abertura);return!isNaN(d.getTime())&&d>=dl});const t=f.length,a=f.filter(c=>c.status!=='Concluído').length,co=f.filter(c=>c.status==='Concluído').length,cr=f.filter(c=>c.prioridade==='Crítica'&&c.status!=='Concluído').length,tx=t>0?Math.round(co/t*100):0;document.getElementById('infoTotal').textContent=t;document.getElementById('infoAbertos').textContent=a;document.getElementById('infoConcluidos').textContent=co;document.getElementById('infoCriticos').textContent=cr;document.getElementById('infoTaxa').textContent=tx+'%';Object.values(charts).forEach(c=>{if(c)c.destroy()});charts={};const ds={};f.forEach(c=>{let s=c.setor||'Outros';if(c.tipo==='gesthosp')s='🏥 GestHosp';ds[s]=(ds[s]||0)+1});const cores=['#3182CE','#38A169','#805AD5','#DD6B20','#E53E3E','#6366F1','#D69E2E','#EC4899'];const ctx1=document.getElementById('graficoSetor');if(ctx1&&Object.keys(ds).length>0)charts.setor=new Chart(ctx1,{type:'doughnut',data:{labels:Object.keys(ds),datasets:[{data:Object.values(ds),backgroundColor:cores.slice(0,Object.keys(ds).length),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom',labels:{font:{size:12},color:'#4A5568',padding:15}}}}});const dp={};f.filter(c=>c.tipo!=='gesthosp').forEach(c=>{const pr=c.prioridade||'Média';dp[pr]=(dp[pr]||0)+1});const ctx2=document.getElementById('graficoPrioridade');if(ctx2&&Object.keys(dp).length>0)charts.prioridade=new Chart(ctx2,{type:'pie',data:{labels:Object.keys(dp),datasets:[{data:Object.values(dp),backgroundColor:['#38A169','#DD6B20','#E53E3E','#C53030'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:12},color:'#4A5568',padding:15}}}}});const ul=[...f].sort((a,b)=>toDate(b.data_abertura)-toDate(a.data_abertura)).slice(0,8);const tu=document.getElementById('ultimosChamados');if(tu)tu.innerHTML=ul.length===0?'<tr><td colspan="6" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum</td></tr>':ul.map(c=>`<tr onclick="verDetalhes('${c.fid}')"><td><strong>${sanitizar(c.protocolo||'—')}</strong></td><td>${fmtDataCurta(c.data_abertura)}</td><td>${sanitizar(c.titulo||'—')}</td><td>${sanitizar(c.setor||'—')}</td><td><span class="badge ${getPrioridadeClass(c.prioridade)}">${sanitizar(c.prioridade||'—')}</span></td><td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></td></tr>`).join('')}

// CHAMADOS
function renderChamados(){const main=document.getElementById('mainContent');const f=chamados.filter(c=>c.tipo!=='gesthosp');main.innerHTML=`<div class="top-bar"><h1>📋 Chamados — ${sanitizar(nomeDepto)}</h1></div><div class="filtros-bar"><select id="filtroStatus" onchange="filtrarChamadosUI()"><option value="">Todos</option><option>A Fazer</option><option>Em Andamento</option><option>Pendente</option><option>Concluído</option></select><select id="filtroPrioridade" onchange="filtrarChamadosUI()"><option value="">Todas</option><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select><input type="text" id="filtroBusca" placeholder="🔍 Buscar..." onkeyup="filtrarChamadosUI()"></div><div class="table-card"><table><thead><tr><th>Protocolo</th><th>Data</th><th>Título</th><th>Solicitante</th><th>Setor</th><th>Prioridade</th><th>Executante</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaChamados">${renderLinhasChamados(f)}</tbody></table></div>`}
function renderLinhasChamados(l){if(l.length===0)return'<tr><td colspan="9" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum</td></tr>';return l.sort((a,b)=>toDate(b.data_abertura)-toDate(a.data_abertura)).map(c=>{const sc=getStatusClass(c.status);let ac=`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();avancarStatus('${c.fid}')">▶</button>`;if(depto==='MANUTENCAO')ac+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();atribuirExecutante('${c.fid}')">👷</button>`;ac+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();abrirComentarios('${c.fid}')">💬</button>`;if(getPerms().isAdmin)ac+=`<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();excluirChamado('${c.fid}')">🗑️</button>`;return`<tr onclick="verDetalhes('${c.fid}')"><td><strong>${sanitizar(c.protocolo||'—')}</strong></td><td>${fmtDataCurta(c.data_abertura)}</td><td>${sanitizar(c.titulo||'—')}</td><td>${sanitizar(c.solicitante||'—')}</td><td>${sanitizar(c.setor||'—')}</td><td>${sanitizar(c.prioridade||'—')}</td><td>${sanitizar(c.executante||'—')}</td><td><span class="badge ${sc}">${sanitizar(c.status||'—')}</span></td><td onclick="event.stopPropagation();">${ac}</td></tr>`}).join('')}
function filtrarChamadosUI(){const sf=document.getElementById('filtroStatus')?.value||'',pf=document.getElementById('filtroPrioridade')?.value||'',bf=(document.getElementById('filtroBusca')?.value||'').toLowerCase();let l=chamados.filter(c=>c.tipo!=='gesthosp');if(sf)l=l.filter(c=>c.status===sf);if(pf)l=l.filter(c=>c.prioridade===pf);if(bf)l=l.filter(c=>(c.titulo||'').toLowerCase().includes(bf)||(c.protocolo||'').toLowerCase().includes(bf));const tb=document.getElementById('tabelaChamados');if(tb)tb.innerHTML=renderLinhasChamados(l)}
async function avancarStatus(id){try{const doc=await db.collection('chamados').doc(id).get();if(!doc.exists){toast('Não encontrado','error');return}const d=doc.data();const fluxo={'A Fazer':'Em Andamento','Em Andamento':'Pendente','Pendente':'Concluído','Concluído':'A Fazer'};const ns=fluxo[d.status||'A Fazer']||'A Fazer';const upd={status:ns,data_atualizacao:firebase.firestore.Timestamp.now()};if(ns==='Em Andamento'||ns==='Concluído')upd.tecnico=usuarioLogado.nome;const h=d.historico||[];h.push({data:new Date().toISOString(),acao:`Status: ${ns} por ${usuarioLogado.nome}`});upd.historico=h;await doc.ref.update(upd);toast('✅ Atualizado!','success')}catch(e){toast('Erro','error')}}
async function atribuirExecutante(id){try{const snap=await db.collection('usuarios').where('departamento','==','MANUTENCAO').where('status','==','ativo').get();const t=[];snap.forEach(d=>t.push(d.data()));abrirModal(`<div class="modal-header"><h3>👷 Atribuir Executante</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarExecutante(event,'${id}')" style="display:grid;gap:8px;"><div class="form-group"><label>Profissional *</label><select id="execSel" required><option value="">Selecione...</option>${t.map(x=>`<option value="${x.nome}">${x.nome} - ${x.cargo}</option>`).join('')}</select></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button><button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button></div></form>`)}catch(e){toast('Erro','error')}}
async function salvarExecutante(e,id){e.preventDefault();const exec=document.getElementById('execSel')?.value;if(!exec){toast('Selecione','error');return}try{await db.collection('chamados').doc(id).update({executante:exec});document.querySelector('.modal-overlay')?.remove();toast('✅ Definido!','success')}catch(e){toast('Erro','error')}}
async function excluirChamado(id){if(!confirm('Excluir?'))return;try{await db.collection('chamados').doc(id).delete();toast('🗑️ Excluído!','success')}catch(e){toast('Erro','error')}}

// DETALHES
function verDetalhes(id){const c=chamados.find(x=>x.fid===id);if(!c)return;let cont='';if(c.tipo==='gesthosp'){let d={};try{if(c.descricao)d=typeof c.descricao==='string'?JSON.parse(c.descricao):c.descricao}catch(e){d={}}cont=`<div style="background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:20px;border-radius:12px;margin-bottom:16px;"><h3>🏥 GestHosp</h3><p>Protocolo: <strong>${sanitizar(c.protocolo||'—')}</strong></p></div><div style="background:#FEF3C7;padding:20px;border-radius:12px;border:2px solid #F59E0B;margin-bottom:16px;"><h4 style="color:#92400E;">👤 Dados Pessoais</h4><div style="display:grid;gap:10px;"><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #FDE68A"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">Nome</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.nome||'—')}</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #FDE68A"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">CPF</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.cpf||'—')}</p></div><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #FDE68A"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">RG</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.rg||'—')}</p></div></div></div></div><div style="background:#DBEAFE;padding:20px;border-radius:12px;border:2px solid #93C5FD;margin-bottom:16px;"><h4 style="color:#1E40AF;">📍 Endereço</h4><div style="display:grid;gap:10px;"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #93C5FD"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">CEP</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.cep||'—')}</p></div><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #93C5FD"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">Logradouro</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.logradouro||'—')}</p></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #93C5FD"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">Número</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.numero||'—')}</p></div><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #93C5FD"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">Complemento</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.complemento||'—')}</p></div></div></div></div><div style="background:#D1FAE5;padding:20px;border-radius:12px;border:2px solid #6EE7B7;margin-bottom:16px;"><h4 style="color:#065F46;">🏥 Dados Profissionais</h4><div style="display:grid;gap:10px;"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #6EE7B7"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">Profissão</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.profissao||'—')}</p></div><div class="gh-field" style="background:white;padding:12px;border-radius:8px;border:1px solid #6EE7B7"><label style="font-size:9px;color:#A0AEC0;text-transform:uppercase;font-weight:700;display:block">Nº Conselho</label><p style="margin:4px 0 0;font-size:14px;font-weight:600">${sanitizar(d.numConselho||'—')}</p></div></div></div></div><div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px"><button class="btn btn-outline btn-sm" onclick="baixarPDFGestHosp('${c.fid}')"><i class="fas fa-download"></i> PDF</button><button class="btn btn-primary btn-sm" onclick="avancarStatus('${c.fid}');this.closest('.modal-overlay').remove();">▶</button><button class="btn btn-outline btn-sm" onclick="abrirComentarios('${c.fid}');this.closest('.modal-overlay').remove();">💬</button>${getPerms().isAdmin?`<button class="btn btn-danger btn-sm" onclick="excluirChamado('${c.fid}');this.closest('.modal-overlay').remove();">🗑️</button>`:''}</div>`}else{cont=`<div style="background:linear-gradient(135deg,var(--primary),#1a3a5c);color:white;padding:16px;border-radius:10px;margin-bottom:14px;"><h3>${sanitizar(c.titulo||'Sem título')}</h3><p>Protocolo: <strong>${sanitizar(c.protocolo||'—')}</strong></p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;"><div style="background:#F7FAFC;padding:10px;border-radius:6px;"><strong>Status:</strong> <span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></div><div style="background:#F7FAFC;padding:10px;border-radius:6px;"><strong>Prioridade:</strong> <span class="badge ${getPrioridadeClass(c.prioridade)}">${sanitizar(c.prioridade||'—')}</span></div><div style="background:#F7FAFC;padding:10px;border-radius:6px;"><strong>Solicitante:</strong> ${sanitizar(c.solicitante||'—')}</div><div style="background:#F7FAFC;padding:10px;border-radius:6px;"><strong>Setor:</strong> ${sanitizar(c.setor||'—')}</div><div style="background:#F7FAFC;padding:10px;border-radius:6px;"><strong>Depto:</strong> ${(c.departamento||'TI')==='TI'?'🖥️ TI':'🔧 Manutenção'}</div></div>${c.descricao&&c.tipo!=='gesthosp'?`<div style="background:white;padding:12px;border-radius:8px;border:1px solid #E2E8F0;margin-bottom:14px;"><strong>Descrição:</strong><p>${sanitizar(c.descricao)}</p></div>`:''}<div style="display:flex;gap:6px;justify-content:flex-end;"><button class="btn btn-primary btn-sm" onclick="avancarStatus('${c.fid}');this.closest('.modal-overlay').remove();">▶</button>${depto==='MANUTENCAO'?`<button class="btn btn-outline btn-sm" onclick="atribuirExecutante('${c.fid}');this.closest('.modal-overlay').remove();">👷</button>`:''}<button class="btn btn-outline btn-sm" onclick="abrirComentarios('${c.fid}');this.closest('.modal-overlay').remove();">💬</button>${getPerms().isAdmin?`<button class="btn btn-danger btn-sm" onclick="excluirChamado('${c.fid}');this.closest('.modal-overlay').remove();">🗑️</button>`:''}</div>`}abrirModal(`<div class="modal-header"><h3>📋 Detalhes</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div>${cont}`,'750px')}

// PDF GESTHOSP
async function baixarPDFGestHosp(id){const c=chamados.find(x=>x.fid===id);if(!c)return;let d={};try{if(c.descricao)d=typeof c.descricao==='string'?JSON.parse(c.descricao):c.descricao}catch(e){d={}}try{const el=document.createElement('div');el.style.cssText='padding:30px;background:#fff;width:800px;position:absolute;left:-9999px;font-family:sans-serif;';el.innerHTML=`<div style="text-align:center;border-bottom:3px solid #667eea;"><h1>HelpHosp</h1><p>Ficha de Cadastro</p></div><h3>👤 Dados Pessoais</h3><table style="width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px;"><tr><td style="padding:6px 8px;font-weight:600;width:160px;background:#F7FAFC;">Nome:</td><td style="padding:6px 8px;">${d.nome||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">CPF:</td><td style="padding:6px 8px;">${d.cpf||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">RG:</td><td style="padding:6px 8px;">${d.rg||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Nascimento:</td><td style="padding:6px 8px;">${d.dataNascimento||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">E-mail:</td><td style="padding:6px 8px;">${d.email||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Telefone:</td><td style="padding:6px 8px;">${d.telefone||d.tel||'—'}</td></tr></table><h3>📍 Endereço</h3><table style="width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px;"><tr><td style="padding:6px 8px;font-weight:600;width:160px;background:#F7FAFC;">CEP:</td><td style="padding:6px 8px;">${d.cep||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Logradouro:</td><td style="padding:6px 8px;">${d.logradouro||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Número:</td><td style="padding:6px 8px;">${d.numero||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Complemento:</td><td style="padding:6px 8px;">${d.complemento||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Bairro:</td><td style="padding:6px 8px;">${d.bairro||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Cidade:</td><td style="padding:6px 8px;">${d.cidade||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Estado:</td><td style="padding:6px 8px;">${d.estado||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">País:</td><td style="padding:6px 8px;">${d.pais||'Brasil'}</td></tr></table><h3>🏥 Dados Profissionais</h3><table style="width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px;"><tr><td style="padding:6px 8px;font-weight:600;width:160px;background:#F7FAFC;">Profissão:</td><td style="padding:6px 8px;">${d.profissao||'—'}</td></tr><tr><td style="padding:6px 8px;font-weight:600;background:#F7FAFC;">Nº Conselho:</td><td style="padding:6px 8px;">${d.numConselho||'—'}</td></tr></table>${d.observacoes?`<h3>📝 Observações</h3><div style="background:#FFFBEB;padding:12px;border-radius:6px;margin-bottom:16px;">${d.observacoes}</div>`:''}`;document.body.appendChild(el);const cv=await html2canvas(el,{scale:2});document.body.removeChild(el);const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,200,(cv.height*200)/cv.width);const na=d.nome?d.nome.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''):'cadastro';pdf.save(`gesthosp-${na}.pdf`);toast('📄 PDF baixado!','success')}catch(e){toast('Erro','error')}}

function abrirComentarios(id){comentarioChamadoId=id;const c=chamados.find(x=>x.fid===id);if(!c)return;const cs=(c.comentarios||[]).map(co=>`<div style="background:#F7FAFC;padding:8px;border-radius:6px;margin-bottom:4px;"><strong>${sanitizar(co.autor)}</strong> <small>${fmtData(co.data)}</small><p>${sanitizar(co.texto)}</p></div>`).join('');abrirModal(`<div class="modal-header"><h3>💬 Comentários</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><p>${sanitizar(c.protocolo||'')}</p><div style="max-height:200px;overflow-y:auto;margin:10px 0;">${cs||'<p style="color:#A0AEC0;">Nenhum</p>'}</div><div style="display:flex;gap:6px;"><textarea id="textoComentario" placeholder="Digite..." style="flex:1;padding:8px;border:1.5px solid #E2E8F0;border-radius:6px;font-size:12px;resize:none;height:38px;"></textarea><button class="btn btn-primary btn-sm" onclick="salvarComentario()">Enviar</button></div>`)}
async function salvarComentario(){const t=document.getElementById('textoComentario')?.value.trim();if(!t)return;try{const d=await db.collection('chamados').doc(comentarioChamadoId).get();const cs=d.data().comentarios||[];cs.push({autor:`${usuarioLogado.nome} (${nomeDepto})`,data:new Date().toISOString(),texto:t});await d.ref.update({comentarios:cs});document.querySelector('.modal-overlay')?.remove();toast('✅ Adicionado!','success')}catch(e){toast('Erro','error')}}
function renderGestHosp(){const main=document.getElementById('mainContent');const gh=chamados.filter(c=>c.tipo==='gesthosp');let l='<tr><td colspan="8" style="text-align:center;padding:20px;color:#A0AEC0;">📭 Nenhum</td></tr>';if(gh.length>0){l=gh.map(c=>{let d={};try{if(c.descricao)d=typeof c.descricao==='string'?JSON.parse(c.descricao):c.descricao}catch(e){d={}}return`<tr onclick="verDetalhes('${c.fid}')"><td><strong>${sanitizar(c.protocolo||'—')}</strong></td><td>${fmtDataCurta(c.data_abertura)}</td><td><strong>${sanitizar(d.nome||'—')}</strong></td><td>${sanitizar(d.cpf||'—')}</td><td>${sanitizar(d.profissao||d.cargo||'—')}</td><td>${sanitizar(d.setor||c.setor||'—')}</td><td><span class="badge ${c.status==='Concluído'?'badge-green':'badge-blue'}">${sanitizar(c.status||'—')}</span></td><td onclick="event.stopPropagation();"><button class="btn btn-sm btn-primary" onclick="avancarStatus('${c.fid}')">▶</button><button class="btn btn-sm btn-outline" onclick="abrirComentarios('${c.fid}')">💬</button>${getPerms().isAdmin?`<button class="btn btn-sm btn-danger" onclick="excluirChamado('${c.fid}')">🗑️</button>`:''}</td></tr>`}).join('')}main.innerHTML=`<div class="top-bar"><h1>🏥 GestHosp</h1></div><div class="table-card"><table><thead><tr><th>Protocolo</th><th>Data</th><th>Profissional</th><th>CPF</th><th>Profissão</th><th>Setor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${l}</tbody></table></div>`}

// INDICADORES
function renderIndicadores(){const main=document.getElementById('mainContent');main.innerHTML=`<div class="top-bar"><h1>📊 Indicadores</h1><div style="display:flex;gap:6px;"><button class="btn btn-outline" onclick="exportarIndicadoresPDF()"><i class="fas fa-file-pdf"></i> PDF</button><button class="btn btn-outline" onclick="exportarIndicadoresSlide()"><i class="fas fa-file-powerpoint"></i> Slide</button></div></div><div class="filtros-bar"><select id="indTipo" onchange="atualizarPeriodos()"><option value="mensal">Mensal</option><option value="semanal">Semanal</option></select><select id="indPeriodo" onchange="atualizarIndicadoresUI()"></select></div><div class="stats-grid" id="indicadorGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px"></div><div class="charts-grid"><div class="chart-card"><h3>📈 Evolução</h3><canvas id="graficoEvolucao"></canvas></div><div class="chart-card"><h3>🎯 Resolução</h3><canvas id="graficoResolucao"></canvas></div></div>`;atualizarPeriodos()}
function atualizarPeriodos(){const tipo=document.getElementById('indTipo')?.value||'mensal';const agora=new Date();const periodos=[];if(tipo==='mensal'){for(let i=11;i>=0;i--){const d=new Date(agora.getFullYear(),agora.getMonth()-i,1);periodos.push({value:d.toISOString().slice(0,7),label:d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})})}}else{for(let i=7;i>=0;i--){const d=new Date();d.setDate(d.getDate()-(i*7));const f=new Date(d);f.setDate(f.getDate()+6);periodos.push({value:d.toISOString().slice(0,10),label:`${d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})} - ${f.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}`})}}const s=document.getElementById('indPeriodo');if(s){s.innerHTML=periodos.map(p=>`<option value="${p.value}">${p.label}</option>`).join('');s.value=periodos[periodos.length-1]?.value||''}atualizarIndicadoresUI()}
function atualizarIndicadoresUI(){const tipo=document.getElementById('indTipo')?.value||'mensal';const periodo=document.getElementById('indPeriodo')?.value;if(!periodo)return;const cr=chamados.filter(c=>c.tipo!=='gesthosp');const fp=(p)=>cr.filter(c=>{const d=toDate(c.data_abertura);if(tipo==='mensal')return d.toISOString().slice(0,7)===p;const i=new Date(p),f=new Date(p);f.setDate(f.getDate()+6);return d>=i&&d<=f});const atual=fp(periodo);let antPeriodo;if(tipo==='mensal'){const[ano,mes]=periodo.split('-').map(Number);const ad=new Date(ano,mes-2,1);antPeriodo=ad.toISOString().slice(0,7)}else{const ad=new Date(periodo);ad.setDate(ad.getDate()-7);antPeriodo=ad.toISOString().slice(0,10)}const anterior=fp(antPeriodo);const ta=atual.length,tan=anterior.length,ca=atual.filter(c=>c.status==='Concluído').length,cra=atual.filter(c=>c.prioridade==='Crítica').length,txa=ta>0?Math.round(ca/ta*100):0;document.getElementById('indicadorGrid').innerHTML=`<div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)"><div style="width:42px;height:42px;background:#DBEAFE;color:#3182CE;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-clipboard-list"></i></div><div><small style="font-size:10px;color:#A0AEC0">Período Atual</small><strong style="font-size:22px;display:block">${ta}</strong></div></div><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)"><div style="width:42px;height:42px;background:#DBEAFE;color:#3182CE;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-clipboard-list"></i></div><div><small style="font-size:10px;color:#A0AEC0">Período Anterior</small><strong style="font-size:22px;display:block">${tan}</strong></div></div><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)"><div style="width:42px;height:42px;background:#D1FAE5;color:#38A169;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-check-circle"></i></div><div><small style="font-size:10px;color:#A0AEC0">Resolução</small><strong style="font-size:22px;display:block">${txa}%</strong></div></div><div class="stat-card" style="background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)"><div style="width:42px;height:42px;background:#FEE2E2;color:#E53E3E;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-exclamation-triangle"></i></div><div><small style="font-size:10px;color:#A0AEC0">Críticos</small><strong style="font-size:22px;display:block">${cra}</strong></div></div>`;Object.values(charts).forEach(c=>{if(c)c.destroy()});charts={};const meses=[],totais=[],concl=[];if(tipo==='mensal'){const ag=new Date();for(let i=5;i>=0;i--){const d=new Date(ag.getFullYear(),ag.getMonth()-i,1);const p=d.toISOString().slice(0,7);meses.push(d.toLocaleDateString('pt-BR',{month:'short'}));const mc=cr.filter(c=>toDate(c.data_abertura).toISOString().slice(0,7)===p);totais.push(mc.length);concl.push(mc.filter(c=>c.status==='Concluído').length)}}else{for(let i=5;i>=0;i--){const d=new Date();d.setDate(d.getDate()-(i*7));const f=new Date(d);f.setDate(f.getDate()+6);meses.push(`${d.getDate()}/${d.getMonth()+1}`);const mc=cr.filter(c=>{const cd=toDate(c.data_abertura);return cd>=d&&cd<=f});totais.push(mc.length);concl.push(mc.filter(c=>c.status==='Concluído').length)}}const ctx1=document.getElementById('graficoEvolucao');if(ctx1)charts.evol=new Chart(ctx1,{type:'bar',data:{labels:meses,datasets:[{label:'Total',data:totais,backgroundColor:'rgba(49,130,206,0.3)',borderColor:'#3182CE',borderWidth:2},{label:'Concluídos',data:concl,backgroundColor:'rgba(56,161,105,0.3)',borderColor:'#38A169',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}});const ctx2=document.getElementById('graficoResolucao');if(ctx2)charts.res=new Chart(ctx2,{type:'doughnut',data:{labels:['Resolvidos','Pendentes'],datasets:[{data:[ca,Math.max(0,ta-ca)],backgroundColor:['#38A169','rgba(229,62,62,0.2)']}]},options:{responsive:true,maintainAspectRatio:false,cutout:'50%'}})}
async function exportarIndicadoresPDF(){try{const el=document.createElement('div');el.style.cssText='padding:30px;background:#fff;width:1000px;position:absolute;left:-9999px;';el.innerHTML=`<h1>HelpHosp - Indicadores</h1>${document.getElementById('indicadorGrid')?.innerHTML||''}`;document.body.appendChild(el);const cv=await html2canvas(el,{scale:2});document.body.removeChild(el);const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,200,(cv.height*200)/cv.width);pdf.save('indicadores.pdf');toast('📄 Gerado!','success')}catch(e){toast('Erro','error')}}
async function exportarIndicadoresSlide(){try{const el=document.createElement('div');el.style.cssText='padding:40px;background:linear-gradient(135deg,var(--primary),#1a3a5c);color:white;width:1200px;position:absolute;left:-9999px;font-size:24px;';el.innerHTML=`<h1>HelpHosp - Indicadores</h1><p>${sanitizar(nomeDepto)}</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:30px;">${document.getElementById('indicadorGrid')?.innerHTML||''}</div>`;document.body.appendChild(el);const cv=await html2canvas(el,{scale:2});document.body.removeChild(el);const{jsPDF}=window.jspdf;const pdf=new jsPDF('l','mm','a4');pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,287,(cv.height*287)/cv.width);pdf.save('indicadores-slide.pdf');toast('📄 Slide gerado!','success')}catch(e){toast('Erro','error')}}

// INICIALIZAÇÃO
async function init(){console.log('🚀 HelpHosp iniciando...');if(!checkAuth())return;console.log('✅ Autenticado:',usuarioLogado.nome,'-',depto);await loadConfig();console.log('✅ Config carregada');initUI();if(Notification.permission==='default')Notification.requestPermission()}
window.addEventListener('load',init);if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(init,100);
</script>
