<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Login Técnico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #3730a3;
            --danger: #ef4444; --dark: #0f172a; --gray: #64748b; --white: #ffffff;
            --radius: 20px; --shadow: 0 20px 60px rgba(0,0,0,0.15); --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-container {
            background: white; border-radius: 28px; padding: 50px 45px;
            width: 100%; max-width: 440px; box-shadow: var(--shadow); animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header { text-align: center; margin-bottom: 40px; }
        .login-logo {
            width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 38px; color: white;
        }
        .login-header h2 { font-size: 26px; color: var(--dark); margin-bottom: 8px; }
        .login-header p { color: var(--gray); font-size: 14px; }
        .login-error {
            background: #fee2e2; color: #991b1b; padding: 14px 18px;
            border-radius: 14px; margin-bottom: 22px; text-align: center; font-size: 14px; display: none;
        }
        .login-error.show { display: block; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .form-group input {
            width: 100%; padding: 16px 16px 16px 48px; border: 2px solid #e2e8f0;
            border-radius: 14px; font-size: 16px; font-family: inherit; background: #fafbfc;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn-login {
            width: 100%; padding: 17px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); }
        .login-footer { text-align: center; margin-top: 28px; font-size: 13px; color: #94a3b8; }
        .login-footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo"><i class="fas fa-user-shield"></i></div>
            <h2>Área Técnica</h2>
            <p>Acesso restrito à equipe de TI</p>
        </div>
        <div id="loginError" class="login-error"></div>
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>Usuário</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsuario" placeholder="Digite seu usuário" required>
                </div>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
                </div>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Entrar</button>
        </form>
        <div class="login-footer">
            <p>← <a href="index.html">Voltar para área do usuário</a></p>
        </div>
    </div>

    <script>
        function inicializarDB() {
    var usuarios = JSON.parse(localStorage.getItem('db_usuarios')) || [];
    
    // SÓ criar se NÃO existir NENHUM usuário
    if (usuarios.length === 0) {
        usuarios = [{
            id: 1,
            nome: 'Jeconias Rocha',
            usuario: 'jeconias',
            email: 'jeconias@hospital.com.br',
            senha: 'Parana2026',
            cargo: 'Analista de Sistemas',
            tipo: 'admin',
            whatsapp: '82981845421',
            status: 'ativo',
            primeiro_acesso: false,
            data_criacao: new Date().toISOString(),
            ultima_alteracao_senha: new Date().toISOString()
        }];
        localStorage.setItem('db_usuarios', JSON.stringify(usuarios));
        console.log('✅ Admin criado: jeconias / Parana2026');
    } else {
        console.log('📦 Usuários existentes:', usuarios.length);
    }
}

// Executar ao carregar
inicializarDB();

        function fazerLogin(event) {
            event.preventDefault();
            var user = document.getElementById('loginUsuario').value.toLowerCase().trim();
            var senha = document.getElementById('loginSenha').value;
            var errorDiv = document.getElementById('loginError');
            var usuarios = JSON.parse(localStorage.getItem('db_usuarios')) || [];
            var usuario = null;
            for (var i = 0; i < usuarios.length; i++) {
                if (usuarios[i].usuario && usuarios[i].usuario.toLowerCase() === user) {
                    usuario = usuarios[i]; break;
                }
            }
            if (!usuario) {
                errorDiv.textContent = '❌ Usuário não encontrado';
                errorDiv.classList.add('show');
                setTimeout(function() { errorDiv.classList.remove('show'); }, 3000);
                return;
            }
            if (usuario.senha !== senha) {
                errorDiv.textContent = '❌ Senha incorreta';
                errorDiv.classList.add('show');
                setTimeout(function() { errorDiv.classList.remove('show'); }, 3000);
                return;
            }
            localStorage.setItem('usuario_logado', JSON.stringify({
                id: usuario.id, nome: usuario.nome, usuario: usuario.usuario,
                cargo: usuario.cargo, tipo: usuario.tipo
            }));
            if (usuario.primeiro_acesso) {
                window.location.href = 'trocar-senha.html?id=' + usuario.id;
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        localStorage.removeItem('usuario_logado');
        inicializarDB();
    </script>
</body>
</html>
