        .inv-card{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s}

        @media(max-width:640px){.form-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}}

</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo"><i class="fas fa-hospital"></i></div><h2><span class="help">Help</span><span class="hosp">Hosp</span></h2><div class="subtitle">Painel Premium</div></div>

        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>

    </div>
</aside>
<main class="main-content" id="mainContent"><div style="text-align:center;padding:60px;"><div style="font-size:40px;">🔄</div><h3>Carregando...</h3></div></main>

<script>
// ============================================
// FIREBASE CONFIG
// ============================================
const fc={apiKey:"AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",authDomain:"helphosp.firebaseapp.com",projectId:"helphosp",storageBucket:"helphosp.firebasestorage.app",messagingSenderId:"1075623193163",appId:"1:1075623193163:web:cf54ee082d1c97a9aa7bce"};
firebase.initializeApp(fc);const db=firebase.firestore();const storage=firebase.storage();

const SETORES_PADRAO=['Administração','Almoxarifado','Farmacia CAF','Centro Cirúrgico','Clínica Cirurgica','Clínica Médica I','Clínica Médica II','Comunicação','Direção Administrativa','Direção Enfermagem','Direção geral','Direção Medica','Emergência/Vermelha','Engenharia Clinica','Farmácia','Faturamento','Fisioterapia','Hotelaria','Juridico','Laboratório','Manutenção','NIR','Nutrição','Oncologia I','Oncologia II','Outros','Ouvidoria','Patrimonio','Pediatria','Psicologia','RH','Raio-X','Recepção CR','Recepção Geral','Recepção Nefrologia','Same','Serviço Social','Sesmt','Telemedicina','Tomografia','UTI I','UTI II'];
const SETORES_TONERS=['Administração','Faturamento','UTI I','UTI II','NIR','Oncologia I & II','Recepção Geral','Recepção CR','Farmácia CAF','Centro Cirúrgico'];
let setores=[...SETORES_PADRAO],departamentosChamados=['TI','MANUTENCAO'];
let usuarioLogado=null,depto='TI',nomeDepto='Tecnologia da Informação';
let chamados=[],inventario=[],estoque=[],movimentacoes=[],charts={},comentarioChamadoId=null,logoHospital=null,logoGoverno=null;

// ============================================
// TEMA
// ============================================
function toggleTheme(){const h=document.documentElement,i=document.getElementById('themeIcon');if(h.getAttribute('data-theme')==='dark'){h.removeAttribute('data-theme');i.className='fas fa-moon';localStorage.setItem('theme','light');}else{h.setAttribute('data-theme','dark');i.className='fas fa-sun';localStorage.setItem('theme','dark');}}
(function(){if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeIcon').className='fas fa-sun';}})();

// ============================================
// UTILITÁRIOS
// ============================================
function toast(m,t='info'){const e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=`<i class="fas fa-${t==='success'?'check-circle':t==='error'?'exclamation-circle':'info-circle'}"></i> ${m}`;document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
function fmtData(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt.getTime()))return'—';return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function fmtDataCurta(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt.getTime()))return'—';const a=new Date();const diff=Math.floor((a-dt)/1000);if(diff<60)return'agora';if(diff<3600)return Math.floor(diff/60)+'min';if(diff<86400)return Math.floor(diff/3600)+'h';return Math.floor(diff/86400)+'d'}catch(e){return'—'}}
function toDate(d){if(!d)return new Date(0);return d?.toDate?d.toDate():new Date(d)}
function sanitizar(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function getStatusClass(s){const c={'Concluído':'badge-green','Em Andamento':'badge-amber','Pendente':'badge-red','A Fazer':'badge-blue'};return c[s]||'badge-blue'}
function getPrioridadeClass(p){const c={'Baixa':'badge-blue','Média':'badge-amber','Alta':'badge-red','Crítica':'badge-red'};return c[p]||'badge-blue'}
function abrirModal(conteudo,mw='750px'){const m=document.createElement('div');m.className='modal-overlay ativa';m.innerHTML=`<div class="modal-box" style="max-width:${mw};">${conteudo}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m}
function getSLAStatus(c){if(c.status==='Concluído')return'sla-ok';const sla={'Crítica':3600000,'Alta':14400000,'Média':86400000,'Baixa':172800000};const ab=toDate(c.data_abertura),ag=new Date(),pr=sla[c.prioridade]||86400000,tr=pr-(ag-ab);if(tr<=0)return'sla-critical';if(tr<pr*0.3)return'sla-warning';return'sla-ok'}
function getSLATexto(c){const s=getSLAStatus(c);if(s==='sla-critical')return'🔴 Atrasado';if(s==='sla-warning')return'🟡 Próximo';return'🟢 No prazo'}

// ============================================
// AUTENTICAÇÃO
// ============================================
function checkAuth(){
    const u=localStorage.getItem('usuario_logado');
    if(!u){
        window.location.href='admin.html';
        return false;
    }
    try{
        usuarioLogado=JSON.parse(u);
        // Verifica se o usuário ainda é válido (não expirou)
        const tempoLimite = 24 * 60 * 60 * 1000; // 24 horas
        if(usuarioLogado.expira && Date.now() > usuarioLogado.expira){
            console.log('⏰ Sessão expirada');
            localStorage.removeItem('usuario_logado');
            window.location.href='admin.html';
            return false;
        }
        // Atualiza a expiração para mais 24 horas
        usuarioLogado.expira = Date.now() + tempoLimite;
        localStorage.setItem('usuario_logado', JSON.stringify(usuarioLogado));
        
        depto=usuarioLogado.departamento||'TI';
        nomeDepto=depto==='TI'?'Tecnologia da Informação':'Manutenção';
        
        console.log('✅ Autenticado:', usuarioLogado.nome, '| Departamento:', depto);
        return true;
    }catch(e){
        console.error('❌ Erro ao verificar autenticação:', e);
        localStorage.removeItem('usuario_logado');
        window.location.href='admin.html';
        return false;
    }
}

function getPerms(){
    const isAdmin=usuarioLogado.tipo==='admin'||usuarioLogado.usuario==='edson';
    return{
        isAdmin,
        isTI:depto==='TI',
        isManut:depto==='MANUTENCAO',
        podeEquipe:isAdmin||(depto==='MANUTENCAO'&&(usuarioLogado.usuario==='bruno'||usuarioLogado.usuario==='benicio'))
    };
}

function logout(){
    if(confirm('Sair do sistema?')){
        localStorage.removeItem('usuario_logado');
        window.location.href='admin.html';
    }
}

// ============================================
// CONFIGURAÇÕES E LOGOS
// ============================================
async function loadConfig(){
    try{
        const ds=await db.collection('configuracoes').doc('setores').get();
        if(ds.exists&&ds.data().setores)setores=ds.data().setores;
        const dd=await db.collection('configuracoes').doc('departamentos_chamados').get();
        if(dd.exists&&dd.data().departamentos)departamentosChamados=dd.data().departamentos;
        const dl=await db.collection('configuracoes').doc('logos').get();
        if(dl.exists){
            if(dl.data().hospital)logoHospital=dl.data().hospital;
            if(dl.data().governo)logoGoverno=dl.data().governo;
        }
        console.log('✅ Configurações carregadas');
    }catch(e){
        console.error('❌ Erro ao carregar configs:', e);
    }
}

// ============================================
// FILTRO DE CHAMADOS POR DEPARTAMENTO
// ============================================
function getChamadosDoDepartamento(){
    console.log(`📊 Filtrando chamados para departamento: ${depto}`);
    console.log(`📊 Total de chamados carregados: ${chamados.length}`);
    
    const filtrados = chamados.filter(c => {
        const chamadoDepto = c.departamento || '';
        
        // Se o chamado tem departamento definido, verifica se é do departamento do usuário
        if(chamadoDepto && chamadoDepto === depto) return true;
        
        // Se o chamado NÃO tem departamento definido (chamados antigos)
        if(!chamadoDepto){
            // TI vê todos os chamados sem departamento
            if(depto === 'TI') return true;
            // Manutenção vê apenas chamados sem departamento que parecem ser de manutenção
            if(depto === 'MANUTENCAO') {
                // Verifica se o setor é típico de manutenção
                const setorManut = ['Manutenção','Hotelaria','Engenharia Clinica','Patrimonio','Almoxarifado'];
                if(setorManut.includes(c.setor)) return true;
                // Se tem executante de manutenção
                if(c.executante && c.executante.includes('Manutenção')) return true;
                return false;
            }
        }
        
        return false;
    });
    
    console.log(`📊 Chamados filtrados para ${nomeDepto}: ${filtrados.length}`);
    return filtrados;
}

function navItem(s,ic,tx,at=false,bd=null){

function navegar(s,el){
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    if(el)el.classList.add('active');
    if(window.innerWidth<1025)document.getElementById('sidebar').classList.remove('open');

        case'dashboard':renderDashboard();break;
        case'chamados':renderChamados();break;
        case'sla':renderSLA();break;
        case'indicadores':renderIndicadores();break;
        case'toners':renderToners();break;
        case'estoque':renderEstoque();break;
        case'inventario':renderInventario();break;
        case'ips':renderIPs();break;
        case'equipe':renderEquipe();break;
        case'arquivos':renderArquivos();break;
        case'agenda':renderAgenda();break;
        case'config':renderConfig();break;
    }
}

async function carregarTodosDados(){
    try{
        console.log('📥 Carregando TODOS os dados do Firestore...');
        
        // CARREGA TODOS OS CHAMADOS SEM LIMITE DE DATA
        const sc=await db.collection('chamados')
            .orderBy('data_abertura','desc')
            .get();
        
        chamados=[];
        sc.forEach(d=>{
            const x=d.data();
            x.fid=d.id;
            chamados.push(x);
        });
        
        console.log(`✅ ${chamados.length} chamados carregados do Firestore`);
        console.log(`📊 Status dos chamados:`);
        const statusCount = {};
        chamados.forEach(c => {
            statusCount[c.status] = (statusCount[c.status] || 0) + 1;
        });
        console.table(statusCount);
        
        // Carrega inventário
        const si=await db.collection('inventario').get();
        inventario=[];
        si.forEach(d=>{
            const x=d.data();
            x.fid=d.id;
            inventario.push(x);
        });
        console.log(`✅ ${inventario.length} itens de inventário carregados`);
        
        // Carrega estoque
        const se=await db.collection('estoque').get();
        estoque=[];
        se.forEach(d=>{
            const x=d.data();
            x.fid=d.id;
            estoque.push(x);
        });
        console.log(`✅ ${estoque.length} itens de estoque carregados`);
        
        // Carrega movimentações
        const sm=await db.collection('movimentacoes').orderBy('data','desc').limit(200).get();
        movimentacoes=[];
        sm.forEach(d=>{
            const x=d.data();
            x.fid=d.id;
            movimentacoes.push(x);
        });
        console.log(`✅ ${movimentacoes.length} movimentações carregadas`);
        
        console.log('✅ Todos os dados carregados com sucesso!');
        renderDashboard();
        escutarChamados();
        atualizarBadges();
        verificarAgenda();
    }catch(e){
        console.error('❌ Erro ao carregar dados:', e);
        toast('Erro ao carregar dados do servidor','error');
        renderDashboard();
    }
}

function escutarChamados(){
    console.log('👂 Iniciando listener em tempo real para TODOS os chamados...');
    
    // Listener em tempo real para TODOS os chamados (sem filtro)
    db.collection('chamados')
        .orderBy('data_abertura','desc')
        .onSnapshot(snap=>{
            const timestamp = new Date().toLocaleTimeString();
            console.log(`🔄 [${timestamp}] Atualização em tempo real recebida`);
            
            chamados=[];
            snap.forEach(d=>{
                const x=d.data();
                x.fid=d.id;
                chamados.push(x);
            });
            
            console.log(`📊 [${timestamp}] ${chamados.length} chamados no listener`);
            
            // Log detalhado dos status
            const statusCount = {};
            chamados.forEach(c => {
                statusCount[c.status] = (statusCount[c.status] || 0) + 1;
            });
            console.log(`📊 Status após atualização:`, statusCount);
            
            atualizarBadges();
            verificarAgenda();
            
            // Atualiza a UI se estiver visível
            if(document.getElementById('infoTotal')) {
                console.log('🔄 Atualizando dashboard...');
                atualizarDashboard();
            }
            if(document.getElementById('tabelaChamados')) {
                console.log('🔄 Atualizando tabela de chamados...');
                filtrarChamadosUI();
            }
        }, error => {
            console.error('❌ Erro no listener:', error);
        });
}

function atualizarDashboard(){

    let f = chamadosDoDepto;
    
    // Só filtra por período se não for "all"
    if(periodoValue !== 'all'){
        const p=parseInt(periodoValue);
        const dl=new Date();
        dl.setDate(dl.getDate()-p);
        
        f=chamadosDoDepto.filter(c=>{
            const d=toDate(c.data_abertura);
            return!isNaN(d.getTime())&&d>=dl;
        });
    }
    
    console.log(`📊 Dashboard atualizado: ${f.length} chamados no período selecionado`);

    if(infoConcluidos) infoConcluidos.textContent=f.filter(c=>c.status==='Concluído').length;
    if(infoCriticos) infoCriticos.textContent=f.filter(c=>c.prioridade==='Crítica'&&c.status!=='Concluído').length;
    if(infoTaxa) infoTaxa.textContent=f.length>0?Math.round(f.filter(c=>c.status==='Concluído').length/f.length*100)+'%':'0%';
    if(infoSLA) infoSLA.textContent=f.filter(c=>getSLAStatus(c)==='sla-critical').length;
    
    // Destroi gráficos antigos
    Object.values(charts).forEach(c=>{if(c)c.destroy()});
    charts={};
    
    // Gráfico por Setor

    f.forEach(c=>{

        });

function renderLinhasChamados(l){
    if(l.length===0)return'<tr><td colspan="9" style="text-align:center;padding:20px;">📭 Nenhum chamado encontrado</td></tr>';
    
    // Ordena por data (mais recente primeiro)
    const ordenados = l.sort((a,b)=>toDate(b.data_abertura)-toDate(a.data_abertura));
    
    return ordenados.map(c=>{
        let ac=`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();avancarStatus('${c.fid}')" title="Avançar Status">▶</button>`;
        if(depto==='MANUTENCAO')ac+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();atribuirExecutante('${c.fid}')" title="Atribuir Executante">👷</button>`;
        ac+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();abrirComentarios('${c.fid}')" title="Comentários">💬</button>`;
        if(getPerms().isAdmin)ac+=`<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();excluirChamado('${c.fid}')" title="Excluir">🗑️</button>`;
        
        return`<tr onclick="verDetalhes('${c.fid}')" style="cursor:pointer;">
            <td><strong>${sanitizar(c.protocolo||'—')}</strong></td>
            <td>${fmtDataCurta(c.data_abertura)}</td>
            <td>${sanitizar(c.titulo||'—')}</td>
            <td>${sanitizar(c.solicitante||'—')}</td>
            <td>${sanitizar(c.setor||'—')}</td>
            <td><span class="badge ${getPrioridadeClass(c.prioridade)}">${sanitizar(c.prioridade||'—')}</span></td>
            <td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></td>
            <td><span class="sla-alert ${getSLAStatus(c)}">${getSLATexto(c)}</span></td>
            <td onclick="event.stopPropagation();">${ac}</td>
        </tr>`;
    }).join('');
}

function filtrarChamadosUI(){
    const sf=document.getElementById('filtroStatus')?.value||'';
    const pf=document.getElementById('filtroPrioridade')?.value||'';
    const bf=(document.getElementById('filtroBusca')?.value||'').toLowerCase();
    
    let l=getChamadosDoDepartamento();
    
    console.log(`🔍 Filtrando: Status="${sf}", Prioridade="${pf}", Busca="${bf}"`);
    console.log(`📊 Antes do filtro: ${l.length} chamados`);
    
    if(sf)l=l.filter(c=>c.status===sf);
    if(pf)l=l.filter(c=>c.prioridade===pf);
    if(bf)l=l.filter(c=>(c.titulo||'').toLowerCase().includes(bf)||(c.protocolo||'').toLowerCase().includes(bf));
    
    console.log(`📊 Após filtro: ${l.length} chamados`);
    
    const tb=document.getElementById('tabelaChamados');
    if(tb)tb.innerHTML=renderLinhasChamados(l);
}

async function avancarStatus(id){
    try{
        const doc=await db.collection('chamados').doc(id).get();
        if(!doc.exists){toast('Chamado não encontrado','error');return}
        const d=doc.data();
        const fluxo={'A Fazer':'Em Andamento','Em Andamento':'Pendente','Pendente':'Concluído','Concluído':'A Fazer'};
        const ns=fluxo[d.status||'A Fazer']||'A Fazer';
        const upd={status:ns,data_atualizacao:firebase.firestore.Timestamp.now()};
        if(ns==='Em Andamento'||ns==='Concluído')upd.tecnico=usuarioLogado.nome;
        const h=d.historico||[];
        h.push({data:new Date().toISOString(),acao:`Status alterado para: ${ns} por ${usuarioLogado.nome} (${nomeDepto})`});
        upd.historico=h;
        await doc.ref.update(upd);
        toast(`✅ Status alterado para "${ns}"`,'success');
    }catch(e){
        console.error('Erro ao avançar status:', e);

async function excluirChamado(id){
    if(!confirm('Tem certeza que deseja excluir este chamado? Esta ação não pode ser desfeita.'))return;
    try{
        await db.collection('chamados').doc(id).delete();
        toast('🗑️ Chamado excluído com sucesso!','success');
    }catch(e){
        toast('Erro ao excluir chamado','error');
    }
}

            <div style="background:#F7FAFC;padding:10px;border-radius:6px;"><strong>Setor:</strong> ${sanitizar(c.setor||'—')}</div>
        </div>

            <button class="btn btn-primary btn-sm" onclick="avancarStatus('${c.fid}');this.closest('.modal-overlay').remove();">▶ Avançar</button>
            <button class="btn btn-outline btn-sm" onclick="abrirComentarios('${c.fid}');this.closest('.modal-overlay').remove();">💬 Comentários</button>
            ${getPerms().isAdmin?`<button class="btn btn-danger btn-sm" onclick="excluirChamado('${c.fid}');this.closest('.modal-overlay').remove();">🗑️ Excluir</button>`:''}
        </div>
    `,'750px');
}

function abrirComentarios(id){
    comentarioChamadoId=id;
    const c=chamados.find(x=>x.fid===id);
    if(!c)return;
    const cs=(c.comentarios||[]).map(co=>`
        <div style="background:#F7FAFC;padding:8px;border-radius:6px;margin-bottom:4px;">
            <strong>${sanitizar(co.autor)}</strong> <small>${fmtData(co.data)}</small>
            <p>${sanitizar(co.texto)}</p>
        </div>
    `).join('');
    abrirModal(`
        <div class="modal-header">
            <h3>💬 Comentários</h3>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
        </div>
        <p style="margin-bottom:10px;"><strong>Protocolo:</strong> ${sanitizar(c.protocolo||'')}</p>
        <div style="max-height:200px;overflow-y:auto;margin:10px 0;">${cs||'<p style="color:#A0AEC0;">Nenhum comentário ainda</p>'}</div>
        <div style="display:flex;gap:6px;">
            <textarea id="textoComentario" placeholder="Digite seu comentário..." style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;resize:none;height:38px;"></textarea>
            <button class="btn btn-primary btn-sm" onclick="salvarComentario()">Enviar</button>
        </div>
    `);
}

async function salvarComentario(){
    const t=document.getElementById('textoComentario')?.value.trim();
    if(!t)return;
    try{
        const d=await db.collection('chamados').doc(comentarioChamadoId).get();
        const cs=d.data().comentarios||[];
        cs.push({
            autor:`${usuarioLogado.nome} (${nomeDepto})`,
            data:new Date().toISOString(),
            texto:t
        });
        await d.ref.update({comentarios:cs});
        document.querySelector('.modal-overlay')?.remove();
        toast('✅ Comentário adicionado!','success');
    }catch(e){
        toast('Erro ao salvar comentário','error');
    }
}

            </div>
            <div class="config-body">
                <form onsubmit="alterarSenha(event)" style="display:grid;gap:10px;margin-top:10px;">
                    <div class="form-group"><label>Senha Atual *</label><input type="password" id="senhaAtual" required></div>
                    <div class="form-group"><label>Nova Senha *</label><input type="password" id="senhaNova" required minlength="6"></div>
                    <div class="form-group"><label>Confirmar *</label><input type="password" id="senhaNovaConfirma" required minlength="6"></div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Alterar Senha</button>
                </form>
            </div>
        </div>
    </div>`;
}

async function alterarSenha(e){
    e.preventDefault();
    const sa=document.getElementById('senhaAtual')?.value,
          sn=document.getElementById('senhaNova')?.value,
          sc=document.getElementById('senhaNovaConfirma')?.value;
    if(!sa||!sn||!sc){toast('Preencha todos os campos','error');return}
    if(sn!==sc){toast('Senhas não conferem','error');return}
    if(sn.length<6){toast('Mínimo 6 caracteres','error');return}
    try{
        const us=await db.collection('usuarios').where('usuario','==',usuarioLogado.usuario).get();
        if(us.empty){toast('Usuário não encontrado','error');return}
        if(us.docs[0].data().senha!==sa){toast('Senha atual incorreta','error');return}
        await us.docs[0].ref.update({senha:sn,primeiro_acesso:false});
        toast('✅ Senha alterada com sucesso!','success');
        e.target.reset();
    }catch(e){
        toast('Erro ao alterar senha','error');
    }
}

async function gerarRelatorioPDF(){
    try{
        toast('📄 Gerando relatório...','info');
        const chamadosDoDepto = getChamadosDoDepartamento();
        const t=chamadosDoDepto.length;
        const co=chamadosDoDepto.filter(c=>c.status==='Concluído').length;
        const tx=t>0?Math.round(co/t*100):0;
        
        const el=document.createElement('div');
        el.style.cssText='padding:40px;background:#fff;width:1000px;position:absolute;left:-9999px;font-family:Arial;';
        
        el.innerHTML=`
        <div style="text-align:center;border-bottom:3px solid #06224a;padding-bottom:20px;margin-bottom:20px;">
            <h1 style="color:#06224a;">HelpHosp Premium</h1>
            <h2 style="color:#3182CE;">${sanitizar(nomeDepto)}</h2>
            <p>${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0;">
            <div style="background:#F7FAFC;padding:16px;border-radius:8px;text-align:center;"><p>TOTAL</p><p style="font-size:32px;">${t}</p></div>
            <div style="background:#F0FFF4;padding:16px;border-radius:8px;text-align:center;"><p style="color:#38A169;">CONCLUÍDOS</p><p style="font-size:32px;">${co}</p></div>
            <div style="background:#FFFBEB;padding:16px;border-radius:8px;text-align:center;"><p style="color:#DD6B20;">TAXA</p><p style="font-size:32px;">${tx}%</p></div>
            <div style="background:#FFF5F5;padding:16px;border-radius:8px;text-align:center;"><p style="color:#E53E3E;">SLA ATRASADO</p><p style="font-size:32px;">${chamadosDoDepto.filter(c=>getSLAStatus(c)==='sla-critical').length}</p></div>
        </div>`;
        
        document.body.appendChild(el);
        const cv=await html2canvas(el,{scale:2,useCORS:true,logging:false});
        document.body.removeChild(el);
        
        const{jsPDF}=window.jspdf;
        const pdf=new jsPDF('p','mm','a4');
        const iw=200,ih=(cv.height*iw)/cv.width;
        pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,iw,ih);
        pdf.save(`relatorio-${depto.toLowerCase()}-${new Date().toISOString().slice(0,10)}.pdf`);
        toast('✅ Relatório gerado!','success');
    }catch(e){
        console.error('Erro PDF:',e);
        toast('Erro ao gerar relatório','error');
    }
}
