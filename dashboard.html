function renderIPs(){const main=document.getElementById('mainContent');db.collection('ips_rede').get().then(snap=>{const ips=[];snap.forEach(d=>{const x=d.data();x.fid=d.id;ips.push(x)});const l=ips.length===0?'<tr><td colspan="7" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum</td></tr>':ips.map(ip=>`<tr><td><strong>${sanitizar(ip.dispositivo||'—')}</strong></td><td>${sanitizar(ip.tipo||'—')}</td><td><code>${sanitizar(ip.ip||'—')}</code></td><td>${sanitizar(ip.mac||'—')}</td><td>${sanitizar(ip.localizacao||'—')}</td><td>${sanitizar(ip.setor||'—')}</td><td><button class="btn btn-sm btn-outline" onclick="editarIP('${ip.fid}')">✏️</button><button class="btn btn-sm btn-danger" onclick="excluirIP('${ip.fid}')">🗑️</button></td></tr>`).join('');main.innerHTML=`<div class="top-bar"><h1>🌐 IPs & Rede</h1><button class="btn btn-primary" onclick="abrirModalIP()"><i class="fas fa-plus"></i> Novo</button></div><div class="table-card"><table><thead><tr><th>Dispositivo</th><th>Tipo</th><th>IP</th><th>MAC</th><th>Local</th><th>Setor</th><th>Ações</th></tr></thead><tbody>${l}</tbody></table></div>`})}
function abrirModalIP(id=null){if(id)db.collection('ips_rede').doc(id).get().then(d=>{if(d.exists)mostrarModalIP(id,d.data())});else mostrarModalIP(null,{})}
function mostrarModalIP(id,ip){const opts=setores.map(s=>`<option value="${s}" ${ip.setor===s?'selected':''}>${s}</option>`).join('');abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'🌐 Novo'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarIP(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Dispositivo *</label><input type="text" id="ipDisp" required value="${ip.dispositivo||''}"></div><div class="form-group"><label>Tipo</label><select id="ipTipo"><option value="">Selecione...</option>${['💻 Computador','🖨️ Impressora','🖧 Switch','📡 Roteador','📞 Telefone','📷 Câmera','📺 TV'].map(t=>`<option ${ip.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label>IP *</label><input type="text" id="ipEnd" required value="${ip.ip||''}"></div><div class="form-group"><label>MAC</label><input type="text" id="ipMAC" value="${ip.mac||''}"></div></div><div class="form-row"><div class="form-group"><label>Local</label><input type="text" id="ipLoc" value="${ip.localizacao||''}"></div><div class="form-group"><label>Setor *</label><select id="ipSetor" required><option value="">Selecione...</option>${opts}</select></div></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button><button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button></div></form>`)}
async function salvarIP(e,id){e.preventDefault();const d={dispositivo:document.getElementById('ipDisp')?.value.trim(),tipo:document.getElementById('ipTipo')?.value,ip:document.getElementById('ipEnd')?.value.trim(),mac:document.getElementById('ipMAC')?.value.trim(),localizacao:document.getElementById('ipLoc')?.value.trim(),setor:document.getElementById('ipSetor')?.value};if(!d.dispositivo||!d.ip||!d.setor){toast('Preencha obrigatórios','error');return}try{if(id)await db.collection('ips_rede').doc(id).update(d);else await db.collection('ips_rede').add(d);document.querySelector('.modal-overlay')?.remove();renderIPs();toast('✅ Salvo!','success')}catch(e){toast('Erro','error')}}
function editarIP(id){abrirModalIP(id)}
async function excluirIP(id){if(!confirm('Excluir?'))return;try{await db.collection('ips_rede').doc(id).delete();renderIPs();toast('🗑️ Excluído!','success')}catch(e){toast('Erro','error')}}

function renderEquipe(){const main=document.getElementById('mainContent');const p=getPerms();if(!p.podeEquipe){main.innerHTML=`<div class="top-bar"><h1>👥 Equipe</h1></div><p style="text-align:center;padding:40px;color:#A0AEC0;">🔒 Restrito</p>`;return}db.collection('usuarios').where('departamento','==',depto).get().then(snap=>{let l='';snap.forEach(d=>{const u=d.data();l+=`<tr><td><strong>${sanitizar(u.nome||'')}</strong></td><td>@${sanitizar(u.usuario||'')}</td><td>${sanitizar(u.cargo||'')}</td><td>${sanitizar(u.whatsapp||'—')}</td><td><span class="badge ${u.mostrarContato!==false?'badge-green':'badge-amber'}">${u.mostrarContato!==false?'Visível':'Oculto'}</span></td><td>${u.usuario!==usuarioLogado.usuario?`<button class="btn btn-sm btn-outline" onclick="editarTecnico('${d.id}')">✏️</button><button class="btn btn-sm btn-danger" onclick="removerTecnico('${d.id}')">🗑️</button>`:'<span class="badge badge-amber">Você</span>'}</td></tr>`});if(!l)l='<tr><td colspan="6" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum</td></tr>';main.innerHTML=`<div class="top-bar"><h1>👥 Equipe — ${sanitizar(nomeDepto)}</h1><button class="btn btn-primary" onclick="abrirModalTecnico()"><i class="fas fa-plus"></i> Novo</button></div><div class="table-card"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Cargo</th><th>WhatsApp</th><th>Contato</th><th>Ações</th></tr></thead><tbody>${l}</tbody></table></div>`})}
function abrirModalTecnico(id=null){if(id)db.collection('usuarios').doc(id).get().then(d=>{if(d.exists)mostrarModalTecnico(id,d.data())});else mostrarModalTecnico(null,{})}
function mostrarModalTecnico(id,u){const cargos=depto==='TI'?['Técnico de Suporte TI','Analista de Sistemas','Analista de Redes','Técnico de Informática']:['Supervisor de Manutenção','Técnico de Manutenção','Eletricista','Encanador','Técnico de Refrigeração','Pedreiro','Pintor','Marceneiro','Auxiliar de Manutenção'];abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'👤 Novo'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarTecnico(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Nome *</label><input type="text" id="tecnicoNome" required value="${u.nome||''}"></div><div class="form-group"><label>Usuário *</label><input type="text" id="tecnicoUsuario" required value="${u.usuario||''}" ${id?'readonly':''}></div><div class="form-group"><label>Cargo *</label><select id="tecnicoCargo">${cargos.map(c=>`<option ${u.cargo===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-group"><label>WhatsApp *</label><input type="text" id="tecnicoWhatsApp" required value="${u.whatsapp||''}"></div><div class="form-group"><label>Mostrar no portal?</label><select id="tecnicoMostrar"><option value="true" ${u.mostrarContato!==false?'selected':''}>✅ Sim</option><option value="false" ${u.mostrarContato===false?'selected':''}>❌ Não</option></select></div>${!id?'<p style="font-size:10px;color:#A0AEC0;">🔑 Senha: 12345</p>':''}<div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button><button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button></div></form>`)}
async function salvarTecnico(e,id){e.preventDefault();const n=document.getElementById('tecnicoNome')?.value.trim(),u=document.getElementById('tecnicoUsuario')?.value.toLowerCase().trim(),w=document.getElementById('tecnicoWhatsApp')?.value.trim(),c=document.getElementById('tecnicoCargo')?.value,m=document.getElementById('tecnicoMostrar')?.value==='true';if(!n||!u||!w||!c){toast('Preencha todos','error');return}try{if(id){await db.collection('usuarios').doc(id).update({nome:n,cargo:c,whatsapp:w,mostrarContato:m})}else{const ex=await db.collection('usuarios').where('usuario','==',u).get();if(!ex.empty){toast('Usuário existe','error');return}await db.collection('usuarios').add({nome:n,usuario:u,senha:'12345',cargo:c,tipo:'tecnico',whatsapp:w,mostrarContato:m,status:'ativo',primeiro_acesso:true,departamento:depto})}document.querySelector('.modal-overlay')?.remove();renderEquipe();toast('✅ Salvo!','success')}catch(e){toast('Erro','error')}}
function editarTecnico(id){abrirModalTecnico(id)}
async function removerTecnico(id){if(!confirm('Remover?'))return;try{await db.collection('usuarios').doc(id).delete();renderEquipe();toast('🗑️ Removido!','success')}catch(e){toast('Erro','error')}}

function renderArquivos(){const main=document.getElementById('mainContent');main.innerHTML=`<div class="top-bar"><h1>📁 Arquivos</h1><button class="btn btn-primary" onclick="abrirUploadFoto()"><i class="fas fa-upload"></i> Upload</button></div><div class="filtros-bar"><select id="filtroCatFoto" onchange="carregarFotos()"><option value="">Todas</option><option value="defeito">🔴 Defeito</option><option value="instalacao">🟢 Instalação</option><option value="servico">🔧 Serviço</option><option value="geral">📷 Geral</option></select></div><div class="foto-grid" id="listaFotos">Carregando...</div>`;carregarFotos()}
async function carregarFotos(){try{const cat=document.getElementById('filtroCatFoto')?.value||'';let q=db.collection('arquivos').orderBy('data','desc');if(cat)q=q.where('categoria','==',cat);const s=await q.limit(50).get();const f=[];s.forEach(d=>{const x=d.data();x.fid=d.id;f.push(x)});const c=document.getElementById('listaFotos');if(!c)return;if(f.length===0){c.innerHTML='<div style="text-align:center;padding:40px;color:#A0AEC0;">📭 Nenhuma</div>';return}c.innerHTML=f.map(x=>`<div class="foto-card"><img src="${x.url}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22><rect fill=%22%23F3F4F6%22 width=%22200%22 height=%22150%22/><text x=%22100%22 y=%2275%22 text-anchor=%22middle%22 fill=%22%23A0AEC0%22>📷</text></svg>'"><div class="foto-info"><div style="font-weight:600;">${sanitizar(x.categoria||'Geral')}</div><div style="font-size:10px;">${fmtDataCurta(x.data)}</div>${x.descricao?`<div>${sanitizar(x.descricao)}</div>`:''}<button class="btn btn-sm btn-danger" style="margin-top:4px;width:100%;" onclick="excluirFoto('${x.fid}')">🗑️</button></div></div>`).join('')}catch(e){}}
function abrirUploadFoto(){abrirModal(`<div class="modal-header"><h3>📤 Upload</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="uploadFoto(event)" style="display:grid;gap:8px;"><div class="form-group"><label>Categoria</label><select id="fotoCat"><option value="defeito">🔴 Defeito</option><option value="instalacao">🟢 Instalação</option><option value="servico">🔧 Serviço</option><option value="geral">📷 Geral</option></select></div><div class="form-group"><label>Descrição</label><textarea id="fotoDesc" rows="2"></textarea></div><div class="form-group"><label>Arquivo *</label><input type="file" id="fotoArq" accept="image/*" required></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Enviar</button><button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button></div></form>`)}
async function uploadFoto(e){e.preventDefault();const f=document.getElementById('fotoArq')?.files[0];if(!f){toast('Selecione arquivo','error');return}try{const r=storage.ref('fotos/'+Date.now()+'_'+f.name);await r.put(f);const u=await r.getDownloadURL();await db.collection('arquivos').add({url:u,categoria:document.getElementById('fotoCat')?.value||'geral',descricao:document.getElementById('fotoDesc')?.value.trim()||'',autor:usuarioLogado.nome,departamento:depto,data:firebase.firestore.Timestamp.now()});document.querySelector('.modal-overlay')?.remove();carregarFotos();toast('✅ Enviada!','success')}catch(e){toast('Erro','error')}}
async function excluirFoto(id){if(!confirm('Excluir?'))return;try{await db.collection('arquivos').doc(id).delete();carregarFotos();toast('🗑️ Excluída!','success')}catch(e){toast('Erro','error')}}

function renderAgenda(){const main=document.getElementById('mainContent');main.innerHTML=`<div class="top-bar"><h1>📅 Agenda</h1><button class="btn btn-primary" onclick="abrirModalAgenda()"><i class="fas fa-plus"></i> Agendar</button></div><div id="listaAgenda">Carregando...</div>`;carregarAgenda()}
async function carregarAgenda(){try{const s=await db.collection('agenda').orderBy('data','asc').get();const i=[];s.forEach(d=>{const x=d.data();x.fid=d.id;i.push(x)});const h=new Date();h.setHours(0,0,0,0);const c=document.getElementById('listaAgenda');if(!c)return;if(i.length===0){c.innerHTML='<p style="text-align:center;padding:40px;color:#A0AEC0;">📭 Nenhum</p>';return}c.innerHTML=i.map(a=>{const d=toDate(a.data);const ho=d>=h&&d<new Date(h.getTime()+86400000);const at=d<h;const bg=ho?'background:#FEF3C7;border-left-color:#F59E0B;':at?'background:#FEE2E2;border-left-color:#E53E3E;':'';return`<div class="agenda-item" style="${bg}"><div style="display:flex;justify-content:space-between;"><div><strong>${sanitizar(a.titulo||'—')}</strong><div>📅 ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div><div>📍 ${sanitizar(a.local||'—')} | 👤 ${sanitizar(a.responsavel||'—')}</div>${a.descricao?`<p>${sanitizar(a.descricao)}</p>`:''}</div><div>${ho?'<span class="badge badge-amber">Hoje</span>':''}${at?'<span class="badge badge-red">Atrasado</span>':''}<button class="btn btn-sm btn-danger" onclick="excluirAgenda('${a.fid}')">🗑️</button></div></div></div>`}).join('')}catch(e){}}
function abrirModalAgenda(id=null){if(id)db.collection('agenda').doc(id).get().then(d=>{if(d.exists)mostrarModalAgenda(id,d.data())});else mostrarModalAgenda(null,{})}
function mostrarModalAgenda(id,d){const ds=d.data?toDate(d.data).toISOString().slice(0,16):'';abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'📅 Agendar'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarAgenda(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Título *</label><input type="text" id="agTitulo" required value="${d.titulo||''}"></div><div class="form-row"><div class="form-group"><label>Data/Hora *</label><input type="datetime-local" id="agData" required value="${ds}"></div><div class="form-group"><label>Local</label><input type="text" id="agLocal" value="${d.local||''}"></div></div><div class="form-group"><label>Responsável</label><input type="text" id="agResp" value="${d.responsavel||usuarioLogado.nome}"></div><div class="form-group"><label>Descrição</label><textarea id="agDesc" rows="2">${d.descricao||''}</textarea></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button><button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button></div></form>`)}
async function salvarAgenda(e,id){e.preventDefault();const d={titulo:document.getElementById('agTitulo')?.value.trim(),data:firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('agData')?.value)),local:document.getElementById('agLocal')?.value.trim(),responsavel:document.getElementById('agResp')?.value.trim(),descricao:document.getElementById('agDesc')?.value.trim(),criadoPor:usuarioLogado.nome,departamento:depto};if(!d.titulo||!document.getElementById('agData')?.value){toast('Preencha obrigatórios','error');return}try{if(id)await db.collection('agenda').doc(id).update(d);else await db.collection('agenda').add(d);document.querySelector('.modal-overlay')?.remove();carregarAgenda();toast('✅ Salvo!','success')}catch(e){toast('Erro','error')}}
async function excluirAgenda(id){if(!confirm('Excluir?'))return;try{await db.collection('agenda').doc(id).delete();carregarAgenda();toast('🗑️ Excluído!','success')}catch(e){toast('Erro','error')}}

async function renderConfig(){const main=document.getElementById('mainContent');await loadConfig();const sl=setores.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #F3F4F6;"><span>📍 ${sanitizar(s)}</span><button class="btn btn-sm btn-danger" onclick="removerSetor(${i})">🗑️</button></div>`).join('');const dl=departamentosChamados.map((d,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #F3F4F6;"><span>📋 ${sanitizar(d==='TI'?'🖥️ TI':d==='MANUTENCAO'?'🔧 Manutenção':d)}</span><button class="btn btn-sm btn-danger" onclick="removerDepto(${i})">🗑️</button></div>`).join('');main.innerHTML=`<div class="top-bar"><h1>⚙️ Configurações</h1></div><div style="max-width:700px;"><div class="config-section" onclick="this.classList.toggle('open')"><div style="display:flex;justify-content:space-between;"><h3>🔐 Alterar Senha</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><form onsubmit="alterarSenha(event)" style="display:grid;gap:8px;margin-top:10px;"><div class="form-group"><label>Senha Atual</label><input type="password" id="senhaAtual" required></div><div class="form-group"><label>Nova Senha</label><input type="password" id="senhaNova" required minlength="8"></div><div class="form-group"><label>Confirmar</label><input type="password" id="senhaNovaConfirma" required minlength="8"></div><button type="submit" class="btn btn-primary">Alterar</button></form></div></div><div class="config-section" onclick="this.classList.toggle('open')"><div style="display:flex;justify-content:space-between;"><h3>🏥 Setores</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><div class="filtros-bar" style="margin-top:10px;"><input type="text" id="novoSetor" placeholder="Nome..." style="flex:1;"><button class="btn btn-primary" onclick="adicionarSetor()"><i class="fas fa-plus"></i></button></div><div style="max-height:250px;overflow-y:auto;">${sl}</div></div></div><div class="config-section" onclick="this.classList.toggle('open')"><div style="display:flex;justify-content:space-between;"><h3>📋 Departamentos</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><div class="filtros-bar" style="margin-top:10px;"><input type="text" id="novoDepto" placeholder="Nome..." style="flex:1;"><button class="btn btn-primary" onclick="adicionarDepto()"><i class="fas fa-plus"></i></button></div><div style="max-height:250px;overflow-y:auto;">${dl}</div></div></div></div>`}
async function adicionarSetor(){const i=document.getElementById('novoSetor');const n=i?.value.trim();if(!n){toast('Digite nome','error');return}if(setores.includes(n)){toast('Já existe','error');return}setores.push(n);setores.sort();try{await db.collection('configuracoes').doc('setores').set({setores});i.value='';renderConfig();toast('✅ Adicionado!','success')}catch(e){toast('Erro','error')}}
async function removerSetor(i){if(!confirm('Remover?'))return;setores.splice(i,1);try{await db.collection('configuracoes').doc('setores').set({setores});renderConfig();toast('🗑️ Removido!','success')}catch(e){toast('Erro','error')}}
async function adicionarDepto(){const i=document.getElementById('novoDepto');const n=i?.value.trim().toUpperCase();if(!n){toast('Digite nome','error');return}if(departamentosChamados.includes(n)){toast('Já existe','error');return}departamentosChamados.push(n);try{await db.collection('configuracoes').doc('departamentos_chamados').set({departamentos:departamentosChamados});i.value='';renderConfig();toast('✅ Adicionado!','success')}catch(e){toast('Erro','error')}}
async function removerDepto(i){if(!confirm('Remover?'))return;departamentosChamados.splice(i,1);try{await db.collection('configuracoes').doc('departamentos_chamados').set({departamentos:departamentosChamados});renderConfig();toast('🗑️ Removido!','success')}catch(e){toast('Erro','error')}}
async function alterarSenha(e){e.preventDefault();const sa=document.getElementById('senhaAtual')?.value,sn=document.getElementById('senhaNova')?.value,sc=document.getElementById('senhaNovaConfirma')?.value;if(!sa||!sn||!sc){toast('Preencha todos','error');return}if(sn!==sc){toast('Não conferem','error');return}if(sn.length<8){toast('Mín 8 caracteres','error');return}try{const us=await db.collection('usuarios').where('usuario','==',usuarioLogado.usuario).get();if(us.empty){toast('Não encontrado','error');return}if(us.docs[0].data().senha!==sa){toast('Senha incorreta','error');return}await us.docs[0].ref.update({senha:sn,primeiro_acesso:false});toast('✅ Alterada!','success');e.target.reset()}catch(e){toast('Erro','error')}}
async function gerarRelatorioPDF(){try{const el=document.createElement('div');el.style.cssText='padding:30px;background:#fff;width:900px;position:absolute;left:-9999px;';const t=chamados.length,a=chamados.filter(c=>c.status!=='Concluído').length,co=chamados.filter(c=>c.status==='Concluído').length,tx=t>0?Math.round(co/t*100):0;el.innerHTML=`<div style="text-align:center;border-bottom:3px solid #3182CE;"><h1>HelpHosp</h1><h2>${sanitizar(nomeDepto)}</h2></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0;"><div style="background:#F7FAFC;padding:16px;border-radius:8px;text-align:center;"><p>TOTAL</p><p style="font-size:32px;">${t}</p></div><div style="background:#FFF5F5;padding:16px;border-radius:8px;text-align:center;"><p style="color:#E53E3E;">ABERTOS</p><p style="font-size:32px;">${a}</p></div><div style="background:#F0FFF4;padding:16px;border-radius:8px;text-align:center;"><p style="color:#38A169;">CONCLUÍDOS</p><p style="font-size:32px;">${co}</p></div><div style="background:#FFFBEB;padding:16px;border-radius:8px;text-align:center;"><p style="color:#DD6B20;">TAXA</p><p style="font-size:32px;">${tx}%</p></div></div>`;document.body.appendChild(el);const cv=await html2canvas(el,{scale:2});document.body.removeChild(el);const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,200,(cv.height*200)/cv.width);pdf.save(`relatorio-${nomeDepto.toLowerCase()}.pdf`);toast('📄 Gerado!','success')}catch(e){toast('Erro','error')}}

// ============================================
// INICIALIZAÇÃO
// ============================================
async function init(){if(!checkAuth())return;await loadConfig();initUI();if(Notification.permission==='default')Notification.requestPermission()}
window.addEventListener('load',init);if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(init,100);
</script>
