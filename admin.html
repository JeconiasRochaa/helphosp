<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 30%, #e0f0e8 70%, #f0f4e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cabeçalho estilo GestHOSP */
        .login-header {
            background: linear-gradient(135deg, #0B3B5C 0%, #1a5a7a 50%, #0B3B5C 100%);
            padding: 35px 30px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .login-logo {
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
            color: #0B3B5C;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 13px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .login-header .subtitle {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.6;
            margin-top: 8px;
        }

        /* Corpo */
        .login-body {
            padding: 40px 35px 35px;
        }

        .login-body .welcome {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-body .welcome h2 {
            font-size: 18px;
            color: #1a1a2e;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .login-body .welcome p {
            font-size: 13px;
            color: #888;
        }

        .erro {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            text-align: center;
        }
        .erro.show { display: block; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 48px;
            height: 100%;
            background: #f5f7fa;
            border-radius: 12px 0 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0B3B5C;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-right: none;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 14px 14px 60px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: all 0.3s;
        }

        .form-group select {
            padding-left: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0B3B5C;
            box-shadow: 0 0 0 4px rgba(11,59,92,0.08);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0B3B5C, #1a5a7a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0d4a6e, #1e6a90);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(11,59,92,0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            padding: 0 35px 25px;
            font-size: 12px;
            color: #999;
        }

        .login-footer a {
            color: #0B3B5C;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer .links {
            margin-top: 10px;
            font-size: 11px;
        }

        .login-footer .links span {
            color: #ccc;
            margin: 0 8px;
        }

        @media (max-width: 480px) {
            .login-body { padding: 30px 20px 25px; }
            .login-header { padding: 25px 20px 20px; }
            .login-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Cabeçalho -->
    <div class="login-header">
        <div class="login-logo">
            <i class="fas fa-laptop-medical"></i>
        </div>
        <h1>HelpHosp</h1>
        <p>Sistema de Chamados Hospitalar</p>
        <div class="subtitle">Área Técnica</div>
    </div>

    <!-- Corpo -->
    <div class="login-body">
        <div class="welcome">
            <h2>Bem-vindo(a)!</h2>
            <p>Informe suas credenciais para acessar o sistema</p>
        </div>

        <div id="erroLogin" class="erro"></div>

        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Usuário</label>
                <div class="input-wrapper">
                    <div class="input-icon"><i class="fas fa-user"></i></div>
                    <input type="text" id="usuario" placeholder="Digite seu usuário" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <div class="input-icon"><i class="fas fa-lock"></i></div>
                    <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> Enviar
            </button>
        </form>
    </div>

    <!-- Rodapé -->
    <div class="login-footer">
        <p>← <a href="index.html">Voltar para área do usuário</a></p>
        <div class="links">
            <a href="#">Esqueci minha senha</a>
        </div>
    </div>
</div>

<script>
const fc = {
    apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
    authDomain: "helphosp.firebaseapp.com",
    projectId: "helphosp",
    storageBucket: "helphosp.firebasestorage.app",
    messagingSenderId: "1075623193163",
    appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
};
firebase.initializeApp(fc);
const db = firebase.firestore();

// Criar admin automaticamente se não existir
db.collection('usuarios').where('usuario', '==', 'jeconias').get().then(snap => {
    if (snap.empty) {
        db.collection('usuarios').add({
            nome: 'Jeconias Rocha',
            usuario: 'jeconias',
            senha: 'Parana2026',
            cargo: 'Coordenador TI',
            departamento: 'TI',
            tipo: 'admin',
            whatsapp: '82981845421',
            status: 'ativo',
            primeiro_acesso: false,
            data_criacao: new Date().toISOString()
        });
        console.log('✅ Admin criado!');
    }
});

// Bloqueio por tentativas
var tentativas = 0;
var bloqueadoAte = localStorage.getItem('bloqueado_ate') || 0;

if (Date.now() < parseInt(bloqueadoAte)) {
    document.body.innerHTML = '<div style="text-align:center;padding:80px;font-family:sans-serif;"><h1 style="color:#ef4444;">⛔ Acesso Bloqueado</h1><p>Aguarde ' + Math.ceil((parseInt(bloqueadoAte) - Date.now()) / 60000) + ' minutos.</p></div>';
}

function login(e) {
    e.preventDefault();

    if (Date.now() < parseInt(localStorage.getItem('bloqueado_ate') || 0)) {
        document.getElementById('erroLogin').textContent = '⛔ Acesso bloqueado. Aguarde.';
        document.getElementById('erroLogin').classList.add('show');
        return;
    }

    var usuario = document.getElementById('usuario').value.toLowerCase().trim();
    var senha = document.getElementById('senha').value;
    var erroDiv = document.getElementById('erroLogin');
    
    erroDiv.classList.remove('show');

    if (!usuario || !senha) {
        erroDiv.textContent = 'Preencha todos os campos!';
        erroDiv.classList.add('show');
        return;
    }

    db.collection('usuarios').where('usuario', '==', usuario).get()
        .then(function(snapshot) {
            if (snapshot.empty) {
                tentativaErrada(erroDiv);
                return;
            }

            var doc = snapshot.docs[0];
            var user = doc.data();

            if (user.senha !== senha) {
                tentativaErrada(erroDiv);
                return;
            }

            if (user.status !== 'ativo') {
                erroDiv.textContent = 'Usuário inativo. Contate o administrador.';
                erroDiv.classList.add('show');
                return;
            }

            // Login bem-sucedido
            tentativas = 0;
            localStorage.removeItem('bloqueado_ate');

            localStorage.setItem('usuario_logado', JSON.stringify({
                id: doc.id,
                nome: user.nome,
                usuario: user.usuario,
                cargo: user.cargo,
                departamento: user.departamento || 'TI',
                tipo: user.tipo || 'tecnico',
                expira: Date.now() + (8 * 60 * 60 * 1000)
            }));

            if (user.primeiro_acesso) {
                window.location.href = 'trocar-senha.html?id=' + doc.id;
            } else {
                window.location.href = 'dashboard.html';
            }
        })
        .catch(function(error) {
            erroDiv.textContent = 'Erro de conexão. Tente novamente.';
            erroDiv.classList.add('show');
        });
}

function tentativaErrada(erroDiv) {
    tentativas++;
    if (tentativas >= 3) {
        var bloqueio = Date.now() + (5 * 60 * 1000);
        localStorage.setItem('bloqueado_ate', bloqueio);
        alert('⛔ Acesso bloqueado por 5 minutos!');
        return;
    }
    erroDiv.textContent = 'Usuário ou senha inválidos! (' + tentativas + '/3 tentativas)';
    erroDiv.classList.add('show');
}
</script>
</body>
</html>
