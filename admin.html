<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Acesso Técnico</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --azul-escuro: #06224a;
            --azul-medio: #0d3d75;
            --branco: #ffffff;
            --cinza-claro: #c9d2df;
            --dourado: #c8a94a;
            --dourado-escuro: #a88a3a;
            --erro: #e74c3c;
            --sucesso: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--azul-escuro);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* GRADE DE FUNDO */
        .bg-grid {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* EFEITO DE BRILHO */
        .glow {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(200,169,74,0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* ECG DOURADO */
        .ecg-line {
            position: fixed; bottom: 0; left: 0;
            width: 100%; height: 80px;
            pointer-events: none; z-index: 0;
            opacity: 0.4;
        }
        .ecg-line svg { width: 100%; height: 100%; }
        .ecg-path {
            fill: none; stroke: var(--dourado);
            stroke-width: 2;
            animation: ecgMove 4s linear infinite;
        }
        .ecg-path-2 { animation-delay: 1s; }
        .ecg-path-3 { animation-delay: 2s; }
        .ecg-path-4 { animation-delay: 3s; }

        @keyframes ecgMove {
            0% { stroke-dashoffset: 1200; }
            100% { stroke-dashoffset: 0; }
        }

        /* CONTAINER PRINCIPAL */
        .login-wrapper {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* LOGO */
        .logo-container {
            margin-bottom: 18px;
        }
        .logo-icon {
            width: 80px; height: 80px;
            background: rgba(200,169,74,0.1);
            border: 2px solid var(--dourado);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            animation: brasaoFloat 3s ease-in-out infinite;
        }
        .logo-icon i {
            font-size: 36px;
            color: var(--dourado);
        }

        @keyframes brasaoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* NOME DO SISTEMA */
        .system-name {
            font-size: 48px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 4px;
            line-height: 1;
        }
        .system-name .help {
            color: var(--cinza-claro);
            font-weight: 300;
        }
        .system-name .hosp {
            color: var(--branco);
            font-weight: 700;
        }

        .system-subtitle {
            color: var(--cinza-claro);
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 18px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* LINHA DOURADA */
        .golden-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--dourado), transparent);
            margin: 0 auto 18px;
            border-radius: 2px;
        }

        /* SLOGAN */
        .slogan {
            color: var(--cinza-claro);
            font-size: 13px;
            font-style: italic;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* CARD DO FORMULÁRIO */
        .login-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 30px 28px;
            backdrop-filter: blur(5px);
        }

        .login-card h3 {
            color: var(--cinza-claro);
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: 400;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* MENSAGEM DE ERRO */
        .erro {
            background: rgba(231,76,60,0.15);
            color: var(--erro);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: none;
            text-align: center;
            border: 1px solid rgba(231,76,60,0.3);
        }
        .erro.show { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CAMPOS */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--cinza-claro);
            margin-bottom: 6px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }
        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dourado);
            font-size: 15px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 14px 14px 44px;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: var(--branco);
            font-size: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        .form-group select {
            padding-left: 14px;
            cursor: pointer;
        }
        .form-group select option {
            background: var(--azul-escuro);
            color: var(--branco);
        }

        .form-group input::placeholder {
            color: rgba(201,210,223,0.4);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--dourado);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(200,169,74,0.08);
        }

        .form-group input:focus ~ .input-icon {
            opacity: 1;
        }

        /* BOTÃO */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--azul-medio), var(--azul-escuro));
            color: var(--branco);
            border: 1px solid rgba(200,169,74,0.3);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0f4d8a, #0a3055);
            border-color: var(--dourado);
            box-shadow: 0 8px 25px rgba(200,169,74,0.2);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* RODAPÉ */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .login-footer a {
            color: var(--cinza-claro);
            text-decoration: none;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .login-footer a:hover {
            opacity: 1;
            color: var(--dourado);
        }

        /* RESPONSIVO */
        @media (max-width: 480px) {
            .system-name { font-size: 38px; }
            .system-subtitle { font-size: 9px; letter-spacing: 3px; }
            .login-card { padding: 22px 18px; }
        }
    </style>
</head>
<body>

    <!-- GRADE DE FUNDO -->
    <div class="bg-grid"></div>

    <!-- EFEITO DE BRILHO -->
    <div class="glow"></div>

    <!-- ECG DOURADO -->
    <div class="ecg-line">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path class="ecg-path" d="M0,60 L100,60 L120,60 L130,10 L140,110 L150,60 L300,60"/>
            <path class="ecg-path ecg-path-2" d="M300,60 L400,60 L420,60 L430,10 L440,110 L450,60 L600,60"/>
            <path class="ecg-path ecg-path-3" d="M600,60 L700,60 L720,60 L730,10 L740,110 L750,60 L900,60"/>
            <path class="ecg-path ecg-path-4" d="M900,60 L1000,60 L1020,60 L1030,10 L1040,110 L1050,60 L1200,60"/>
        </svg>
    </div>

    <!-- CONTAINER PRINCIPAL -->
    <div class="login-wrapper">

        <!-- LOGO -->
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
        </div>

        <!-- NOME DO SISTEMA -->
        <div class="system-name">
            <span class="help">Help</span><span class="hosp">Hosp</span>
        </div>
        <div class="system-subtitle">Sistema de Chamados Hospitalar</div>

        <!-- LINHA DOURADA -->
        <div class="golden-line"></div>

        <!-- SLOGAN -->
        <div class="slogan">Área Técnica</div>

        <!-- CARD DO FORMULÁRIO -->
        <div class="login-card">
            <h3>Bem-vindo(a)! Informe suas credenciais</h3>

            <!-- ERRO -->
            <div class="erro" id="erroLogin"></div>

            <form onsubmit="login(event)">
                <!-- DEPARTAMENTO -->
                <div class="form-group">
                    <label>Departamento</label>
                    <select id="departamento">
                        <option value="">Selecione o departamento...</option>
                        <option value="TI">🖥️ Tecnologia da Informação</option>
                        <option value="MANUTENCAO">🔧 Manutenção</option>
                    </select>
                </div>

                <!-- USUÁRIO -->
                <div class="form-group">
                    <label>Usuário</label>
                    <div class="input-wrapper">
                        <div class="input-icon"><i class="fas fa-user"></i></div>
                        <input type="text" id="usuario" placeholder="Digite seu usuário" required>
                    </div>
                </div>

                <!-- SENHA -->
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <div class="input-icon"><i class="fas fa-lock"></i></div>
                        <input type="password" id="senha" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>

        <!-- RODAPÉ -->
        <div class="login-footer">
            <a href="index.html">← Voltar para área do usuário</a>
        </div>
    </div>

    <script>
        const fc = {
            apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
            authDomain: "helphosp.firebaseapp.com",
            projectId: "helphosp",
            storageBucket: "helphosp.firebasestorage.app",
            messagingSenderId: "1075623193163",
            appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
        };
        firebase.initializeApp(fc);
        const db = firebase.firestore();

        var tentativas = 0;

        function login(e) {
            e.preventDefault();

            var departamento = document.getElementById('departamento').value;
            var usuario = document.getElementById('usuario').value.toLowerCase().trim();
            var senha = document.getElementById('senha').value;
            var erroDiv = document.getElementById('erroLogin');
            erroDiv.classList.remove('show');

            if (!departamento) { erroDiv.textContent = 'Selecione o departamento!'; erroDiv.classList.add('show'); return; }
            if (!usuario || !senha) { erroDiv.textContent = 'Preencha todos os campos!'; erroDiv.classList.add('show'); return; }

            db.collection('usuarios').where('usuario', '==', usuario).get()
                .then(function(snapshot) {
                    if (snapshot.empty) { erroDiv.textContent = 'Usuário ou senha inválidos!'; erroDiv.classList.add('show'); return; }

                    var doc = snapshot.docs[0], user = doc.data();

                    if (user.tipo !== 'admin' && user.departamento !== departamento) {
                        erroDiv.textContent = 'Departamento incorreto para este usuário!';
                        erroDiv.classList.add('show'); return;
                    }

                    if (user.senha !== senha) { erroDiv.textContent = 'Usuário ou senha inválidos!'; erroDiv.classList.add('show'); return; }
                    if (user.status !== 'ativo') { erroDiv.textContent = 'Usuário inativo!'; erroDiv.classList.add('show'); return; }

                    tentativas = 0;
                    localStorage.setItem('usuario_logado', JSON.stringify({
                        id: doc.id, nome: user.nome, usuario: user.usuario,
                        cargo: user.cargo, departamento: user.departamento || departamento,
                        tipo: user.tipo || 'tecnico', expira: Date.now() + (8 * 60 * 60 * 1000)
                    }));

                    if (user.primeiro_acesso) { window.location.href = 'trocar-senha.html?id=' + doc.id; }
                    else { window.location.href = 'dashboard.html'; }
                })
                .catch(function(error) { erroDiv.textContent = 'Erro de conexão!'; erroDiv.classList.add('show'); });
        }
    </script>
</body>
</html>
