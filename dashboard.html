<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel Técnico</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #F0F4F8;
            --card: #FFFFFF;
            --sidebar: #1a3a5c;
            --primary: #1a3a5c;
            --accent: #3182CE;
            --gold: #D69E2E;
            --success: #38A169;
            --warning: #DD6B20;
            --danger: #E53E3E;
            --text: #1A202C;
            --border: #E2E8F0;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            font-size: 14px;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            text-align: center;
            padding: 10px 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 16px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            border: 2px solid rgba(214,158,46,0.5);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(214,158,46,0.1);
        }
        .logo i { font-size: 26px; color: var(--gold); }

        .sidebar-header h2 { font-size: 18px; font-weight: 700; }
        .help { color: #A0AEC0; }
        .hosp { color: #FFF; }
        .subtitle { font-size: 7px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }

        .user-box {
            background: rgba(255,255,255,0.04);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--gold), #b8861e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }
        .user-details h4 { font-size: 11px; color: #FFF; }
        .user-details small { font-size: 8px; color: rgba(255,255,255,0.5); }

        .nav-section { margin-bottom: 8px; }
        .nav-title {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 4px;
            padding-left: 8px;
            font-weight: 700;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
            color: #CBD5E0;
            font-size: 11px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #FFF; }
        .nav-item.active { background: rgba(214,158,46,0.15); color: #F6E05E; }
        .nav-item i { width: 16px; text-align: center; }

        .badge-notify {
            background: var(--danger);
            color: #fff;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;
            text-align: center;
            line-height: 18px;
            font-size: 9px;
            font-weight: 700;
            display: none;
            margin-left: auto;
        }

        .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
        }
        .btn-logout:hover { background: rgba(229,62,62,0.15); color: #FCA5A5; }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 20px 24px;
            min-height: 100vh;
        }

        .secao { display: none; }
        .secao.ativa { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar h1 { font-size: 18px; font-weight: 700; }

        .info-bar {
            background: linear-gradient(135deg, #1a3a5c 0%, #2c5282 100%);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 12px;
        }
        .info-bar .info-item { text-align: center; min-width: 60px; }
        .info-bar .info-val { font-size: 24px; font-weight: 700; }
        .info-bar .info-lbl { font-size: 9px; opacity: 0.8; text-transform: uppercase; }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .chart-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .chart-card h3 { font-size: 12px; margin-bottom: 12px; font-weight: 600; }
        .chart-card canvas { width: 100% !important; height: 220px !important; }

        .table-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 12px;
        }
        .table-card h3 { font-size: 12px; margin-bottom: 12px; font-weight: 600; }

        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th {
            background: #F7FAFC;
            color: #4A5568;
            padding: 9px 10px;
            text-align: left;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 2px solid #E2E8F0;
        }
        td { padding: 8px 10px; border-bottom: 1px solid #EDF2F7; font-size: 10px; }
        tr:hover td { background: #F0F4F8; cursor: pointer; }

        .badge {
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 8px;
            font-weight: 700;
        }
        .badge-blue { background: #DBEAFE; color: #1D4ED8; }
        .badge-green { background: #D1FAE5; color: #065F46; }
        .badge-amber { background: #FEF3C7; color: #92400E; }
        .badge-red { background: #FEE2E2; color: #991B1B; }

        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: #1a3a5c; color: #fff; }
        .btn-primary:hover { background: #2c5282; }
        .btn-outline { background: transparent; border: 1.5px solid #E2E8F0; color: #4A5568; }
        .btn-outline:hover { background: #F7FAFC; }
        .btn-danger { background: #FFF5F5; color: #E53E3E; border: 1px solid #FED7D7; }
        .btn-danger:hover { background: #FED7D7; }
        .btn-sm { padding: 3px 7px; font-size: 8px; border-radius: 5px; }

        .filtros-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .filtros-bar select, .filtros-bar input {
            padding: 7px 10px;
            background: #FFF;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 10px;
            outline: none;
        }
        .filtros-bar input { flex: 1; min-width: 120px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.ativa { display: flex; }
        .modal-box {
            background: #FFF;
            border-radius: var(--radius);
            padding: 20px 24px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #A0AEC0;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 9px; font-weight: 700; margin-bottom: 3px; color: #4A5568; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 11px;
            outline: none;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #FFF;
            border-left: 4px solid #3182CE;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 11px;
            z-index: 9999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            animation: toastIn 0.3s;
        }
        .toast.error { border-left-color: #E53E3E; }
        .toast.success { border-left-color: #38A169; }
        @keyframes toastIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .estoque-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        .estoque-item {
            background: #FFF;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #E2E8F0;
            text-align: center;
            position: relative;
            cursor: pointer;
        }
        .estoque-item .emoji { font-size: 36px; }
        .estoque-item h4 { font-size: 11px; margin: 6px 0; }
        .estoque-item .qtd { font-size: 16px; font-weight: 700; color: #1a3a5c; }
        .estoque-item .actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 3px; }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 110;
            background: #1a3a5c;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: flex; align-items: center; justify-content: center; }
            .main-content { margin-left: 0; padding: 12px; padding-top: 50px; }
            .charts-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .estoque-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
    <i class="fas fa-bars"></i>
</button>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo"><i class="fas fa-hospital"></i></div>
        <h2><span class="help">Help</span><span class="hosp">Hosp</span></h2>
        <div class="subtitle">Painel Técnico</div>
    </div>
    <div class="user-box">
        <div class="user-avatar" id="userAvatar">T</div>
        <div class="user-details">
            <h4 id="userName">—</h4>
            <small id="userRole">—</small>
        </div>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <!-- O conteúdo será gerado dinamicamente -->
</main>

<script>
// Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
    authDomain: "helphosp.firebaseapp.com",
    projectId: "helphosp",
    storageBucket: "helphosp.firebasestorage.app",
    messagingSenderId: "1075623193163",
    appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Variáveis globais
let usuarioLogado = null;
let depto = 'TI';
let nomeDepto = 'Tecnologia da Informação';
let chamados = [];
let charts = {};

// Autenticação
function checkAuth() {
    const u = localStorage.getItem('usuario_logado');
    if (!u) { window.location.href = 'admin.html'; return false; }
    try {
        usuarioLogado = JSON.parse(u);
        if (usuarioLogado.expira && Date.now() > usuarioLogado.expira) {
            localStorage.removeItem('usuario_logado');
            window.location.href = 'admin.html';
            return false;
        }
        depto = usuarioLogado.departamento || 'TI';
        nomeDepto = depto === 'TI' ? 'Tecnologia da Informação' : 'Manutenção';
        return true;
    } catch (e) {
        window.location.href = 'admin.html';
        return false;
    }
}

function getPerms() {
    const isAdmin = usuarioLogado.tipo === 'admin' || usuarioLogado.usuario === 'edson';
    const isSupManut = usuarioLogado.usuario === 'bruno' || usuarioLogado.usuario === 'benicio';
    return {
        isAdmin,
        isSupManut,
        podeEquipe: isAdmin || (depto === 'MANUTENCAO' && isSupManut),
        isTI: depto === 'TI',
        isManut: depto === 'MANUTENCAO'
    };
}

function logout() {
    if (confirm('Sair do sistema?')) {
        localStorage.removeItem('usuario_logado');
        window.location.href = 'admin.html';
    }
}

// Utilitários
function toast(msg, tipo = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + tipo;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

function fmtData(d) {
    if (!d) return '—';
    try {
        const dt = d?.toDate ? d.toDate() : new Date(d);
        return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return '—'; }
}

function fmtDataCurta(d) {
    if (!d) return '—';
    try {
        const dt = d?.toDate ? d.toDate() : new Date(d);
        const agora = new Date();
        const diff = Math.floor((agora - dt) / 1000);
        if (diff < 60) return 'agora';
        if (diff < 3600) return Math.floor(diff / 60) + 'min';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        return Math.floor(diff / 86400) + 'd';
    } catch (e) { return '—'; }
}

function toDate(d) {
    if (!d) return new Date(0);
    return d?.toDate ? d.toDate() : new Date(d);
}

function sanitizar(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function getStatusClass(s) {
    const c = { 'Concluído': 'badge-green', 'Em Andamento': 'badge-amber', 'Pendente': 'badge-red', 'A Fazer': 'badge-blue' };
    return c[s] || 'badge-blue';
}

function getPrioridadeClass(p) {
    const c = { 'Baixa': 'badge-blue', 'Média': 'badge-amber', 'Alta': 'badge-red', 'Crítica': 'badge-red' };
    return c[p] || 'badge-blue';
}

// Interface
function initUI() {
    document.getElementById('userName').textContent = usuarioLogado.nome;
    document.getElementById('userRole').textContent = usuarioLogado.cargo + ' · ' + nomeDepto;
    document.getElementById('userAvatar').textContent = usuarioLogado.nome.charAt(0).toUpperCase();
    
    buildMenu();
    renderDashboard();
    carregarChamados();
    escutarChamados();
}

function buildMenu() {
    const p = getPerms();
    const nav = document.getElementById('sidebarNav');
    let h = '<div class="nav-section"><div class="nav-title">Principal</div>';
    h += navItem('dashboard', 'chart-pie', 'Dashboard', true);
    h += navItem('chamados', 'ticket-alt', 'Chamados', false, 'badgeChamados');
    h += navItem('indicadores', 'chart-line', 'Indicadores');
    if (p.isTI || p.isAdmin) h += navItem('gesthosp', 'hospital-user', 'GestHosp', false, 'badgeGestHosp');
    h += '</div><div class="nav-section"><div class="nav-title">Gestão</div>';
    if (p.isTI || p.isAdmin) {
        h += navItem('toners', 'print', 'Toners');
        h += navItem('estoque', 'box', 'Estoque');
        h += navItem('inventario', 'clipboard-list', 'Inventário');
        h += navItem('ips', 'network-wired', 'IPs & Rede');
    }
    if (p.podeEquipe) h += navItem('equipe', 'users-cog', 'Equipe');
    h += navItem('config', 'cog', 'Configurações');
    h += '</div>';
    nav.innerHTML = h;
}

function navItem(secao, icone, texto, ativo = false, badgeId = null) {
    const badge = badgeId ? `<span class="badge-notify" id="${badgeId}">0</span>` : '';
    return `<div class="nav-item${ativo ? ' active' : ''}" data-secao="${secao}" onclick="navegar('${secao}', this)">
        <i class="fas fa-${icone}"></i><span>${texto}</span>${badge}
    </div>`;
}

function navegar(secao, el) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
    if (window.innerWidth < 1025) document.getElementById('sidebar').classList.remove('open');
    
    const main = document.getElementById('mainContent');
    
    switch (secao) {
        case 'dashboard': renderDashboard(); break;
        case 'chamados': renderChamados(); break;
        case 'gesthosp': renderGestHosp(); break;
        case 'indicadores': renderIndicadores(); break;
        case 'toners': renderToners(); break;
        case 'estoque': renderEstoque(); break;
        case 'inventario': renderInventario(); break;
        case 'ips': renderIPs(); break;
        case 'equipe': renderEquipe(); break;
        case 'config': renderConfig(); break;
    }
}

// Dashboard
function renderDashboard() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
        <div class="secao ativa">
            <div class="top-bar">
                <h1>📊 Dashboard — ${sanitizar(nomeDepto)}</h1>
                <div style="display:flex;gap:6px;">
                    <select id="periodo" onchange="atualizarDashboard()" style="padding:6px 8px;background:#fff;border:1.5px solid #E2E8F0;border-radius:6px;font-size:10px;">
                        <option value="7">7 dias</option>
                        <option value="30" selected>30 dias</option>
                        <option value="90">90 dias</option>
                    </select>
                    <button class="btn btn-primary" onclick="gerarRelatorioPDF()"><i class="fas fa-file-pdf"></i> Relatório</button>
                </div>
            </div>
            <div class="info-bar">
                <div class="info-item"><div class="info-val" id="infoTotal">0</div><div class="info-lbl">Total</div></div>
                <div class="info-item"><div class="info-val" id="infoAbertos" style="color:#FBD38D;">0</div><div class="info-lbl">Abertos</div></div>
                <div class="info-item"><div class="info-val" id="infoConcluidos" style="color:#68D391;">0</div><div class="info-lbl">Concluídos</div></div>
                <div class="info-item"><div class="info-val" id="infoCriticos" style="color:#FC8181;">0</div><div class="info-lbl">Críticos</div></div>
                <div class="info-item"><div class="info-val" id="infoTaxa" style="color:#63B3ED;">0%</div><div class="info-lbl">Resolução</div></div>
            </div>
            <div class="charts-grid">
                <div class="chart-card"><h3>📈 Por Setor</h3><canvas id="graficoSetor"></canvas></div>
                <div class="chart-card"><h3>🎯 Por Prioridade</h3><canvas id="graficoPrioridade"></canvas></div>
            </div>
            <div class="table-card">
                <h3>🚨 Últimos Chamados</h3>
                <table><thead><tr><th>Protocolo</th><th>Data</th><th>Título</th><th>Setor</th><th>Prioridade</th><th>Status</th></tr></thead><tbody id="ultimosChamados"></tbody></table>
            </div>
        </div>
    `;
    atualizarDashboard();
}

function atualizarDashboard() {
    const periodo = parseInt(document.getElementById('periodo')?.value || 30);
    const dataLimite = new Date();
    dataLimite.setDate(dataLimite.getDate() - periodo);
    
    const filtrados = chamados.filter(c => {
        const data = toDate(c.data_abertura);
        return !isNaN(data.getTime()) && data >= dataLimite;
    });
    
    const total = filtrados.length;
    const abertos = filtrados.filter(c => c.status !== 'Concluído').length;
    const concluidos = filtrados.filter(c => c.status === 'Concluído').length;
    const criticos = filtrados.filter(c => c.prioridade === 'Crítica' && c.status !== 'Concluído').length;
    const taxa = total > 0 ? Math.round((concluidos / total) * 100) : 0;
    
    document.getElementById('infoTotal').textContent = total;
    document.getElementById('infoAbertos').textContent = abertos;
    document.getElementById('infoConcluidos').textContent = concluidos;
    document.getElementById('infoCriticos').textContent = criticos;
    document.getElementById('infoTaxa').textContent = taxa + '%';
    
    // Destruir gráficos antigos
    Object.values(charts).forEach(c => { if (c) c.destroy(); });
    charts = {};
    
    // Gráfico por Setor
    const dadosSetor = {};
    filtrados.forEach(c => {
        let setor = c.setor || 'Outros';
        if (c.tipo === 'gesthosp') setor = '🏥 GestHosp';
        dadosSetor[setor] = (dadosSetor[setor] || 0) + 1;
    });
    
    const cores = ['#3182CE', '#38A169', '#805AD5', '#DD6B20', '#E53E3E', '#6366F1', '#D69E2E', '#EC4899'];
    const ctx1 = document.getElementById('graficoSetor');
    if (ctx1 && Object.keys(dadosSetor).length > 0) {
        charts.setor = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: Object.keys(dadosSetor),
                datasets: [{
                    data: Object.values(dadosSetor),
                    backgroundColor: cores.slice(0, Object.keys(dadosSetor).length),
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                cutout: '60%',
                plugins: { legend: { position: 'bottom', labels: { font: { size: 9 }, color: '#4A5568' } } }
            }
        });
    }
    
    // Gráfico por Prioridade
    const dadosPrioridade = {};
    filtrados.filter(c => c.tipo !== 'gesthosp').forEach(c => {
        const prioridade = c.prioridade || 'Média';
        dadosPrioridade[prioridade] = (dadosPrioridade[prioridade] || 0) + 1;
    });
    
    const ctx2 = document.getElementById('graficoPrioridade');
    if (ctx2 && Object.keys(dadosPrioridade).length > 0) {
        charts.prioridade = new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: Object.keys(dadosPrioridade),
                datasets: [{
                    data: Object.values(dadosPrioridade),
                    backgroundColor: ['#38A169', '#DD6B20', '#E53E3E', '#C53030'],
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { font: { size: 9 }, color: '#4A5568' } } }
            }
        });
    }
    
    // Últimos chamados
    const ultimos = [...filtrados].sort((a, b) => toDate(b.data_abertura) - toDate(a.data_abertura)).slice(0, 8);
    const tu = document.getElementById('ultimosChamados');
    if (tu) {
        tu.innerHTML = ultimos.length === 0 
            ? '<tr><td colspan="6" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum chamado</td></tr>'
            : ultimos.map(c => `
                <tr onclick="verDetalhes('${c.fid}')" style="cursor:pointer;">
                    <td><strong>${sanitizar(c.protocolo || '—')}</strong></td>
                    <td>${fmtDataCurta(c.data_abertura)}</td>
                    <td>${sanitizar(c.titulo || '—')}</td>
                    <td>${sanitizar(c.setor || '—')}</td>
                    <td><span class="badge ${getPrioridadeClass(c.prioridade)}">${sanitizar(c.prioridade || '—')}</span></td>
                    <td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status || '—')}</span></td>
                </tr>
            `).join('');
    }
}

// Chamados
async function carregarChamados() {
    try {
        const snap = await db.collection('chamados').orderBy('data_abertura', 'desc').get();
        chamados = [];
        snap.forEach(doc => {
            const dados = doc.data();
            dados.fid = doc.id;
            const p = getPerms();
            if (p.isAdmin || (dados.departamento || 'TI') === depto) {
                chamados.push(dados);
            }
        });
    } catch (e) {
        console.error('Erro ao carregar chamados:', e);
    }
}

function escutarChamados() {
    db.collection('chamados').orderBy('data_abertura', 'desc').onSnapshot(snap => {
        chamados = [];
        const p = getPerms();
        snap.forEach(doc => {
            const dados = doc.data();
            dados.fid = doc.id;
            if (p.isAdmin || (dados.departamento || 'TI') === depto) {
                chamados.push(dados);
            }
        });
        atualizarDashboard();
        atualizarBadges();
    });
}

function atualizarBadges() {

function renderLinhasChamados(lista) {
    if (lista.length === 0) return '<tr><td colspan="9" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum chamado</td></tr>';
    return lista.map(c => {
        const sc = getStatusClass(c.status);
        return `<tr onclick="verDetalhes('${c.fid}')" style="cursor:pointer;">
            <td><strong>${sanitizar(c.protocolo || '—')}</strong></td>
            <td>${fmtDataCurta(c.data_abertura)}</td>
            <td>${sanitizar(c.titulo || '—')}</td>
            <td>${sanitizar(c.solicitante || '—')}</td>
            <td>${sanitizar(c.setor || '—')}</td>
            <td>${sanitizar(c.prioridade || '—')}</td>
            <td>${sanitizar(c.tecnico || '—')}</td>
            <td><span class="badge ${sc}">${sanitizar(c.status || '—')}</span></td>
            <td onclick="event.stopPropagation();">
                <button class="btn btn-sm btn-primary" onclick="avancarStatus('${c.fid}')">▶</button>
                <button class="btn btn-sm btn-outline" onclick="abrirComentarios('${c.fid}')">💬</button>

        </tr>`;
    }).join('');
}

function filtrarChamadosUI() {
    const sf = document.getElementById('filtroStatus')?.value || '';
    const pf = document.getElementById('filtroPrioridade')?.value || '';
    const bf = (document.getElementById('filtroBusca')?.value || '').toLowerCase();
    
    let lista = chamados.filter(c => c.tipo !== 'gesthosp');
    if (sf) lista = lista.filter(c => c.status === sf);
    if (pf) lista = lista.filter(c => c.prioridade === pf);
    if (bf) lista = lista.filter(c => 
        (c.titulo || '').toLowerCase().includes(bf) ||
        (c.protocolo || '').toLowerCase().includes(bf) ||
        (c.solicitante || '').toLowerCase().includes(bf)
    );
    
    lista.sort((a, b) => toDate(b.data_abertura) - toDate(a.data_abertura));
    
    const tb = document.getElementById('tabelaChamados');
    if (tb) tb.innerHTML = renderLinhasChamados(lista);
}

async function avancarStatus(id) {
    try {
        const doc = await db.collection('chamados').doc(id).get();
        if (!doc.exists) { toast('Não encontrado', 'error'); return; }
        
        const dados = doc.data();
        const fluxo = { 'A Fazer': 'Em Andamento', 'Em Andamento': 'Pendente', 'Pendente': 'Concluído', 'Concluído': 'A Fazer' };
        const novoStatus = fluxo[dados.status || 'A Fazer'] || 'A Fazer';
        
        const upd = {
            status: novoStatus,
            data_atualizacao: firebase.firestore.Timestamp.now()
        };
        
        if (novoStatus === 'Em Andamento' || novoStatus === 'Concluído') {
            upd.tecnico = usuarioLogado.nome;
        }
        
        const hist = dados.historico || [];
        hist.push({ data: new Date().toISOString(), acao: `Status: ${novoStatus} por ${usuarioLogado.nome}` });
        upd.historico = hist;
        
        await doc.ref.update(upd);
        toast('✅ Status atualizado!', 'success');
    } catch (e) {
        toast('Erro ao atualizar', 'error');
    }
}

async function excluirChamado(id) {
    if (!confirm('Excluir este chamado?')) return;
    try {
        await db.collection('chamados').doc(id).delete();
        toast('🗑️ Excluído!', 'success');
    } catch (e) {
        toast('Erro ao excluir', 'error');
    }
}

let comentarioChamadoId = null;

function abrirComentarios(id) {
    comentarioChamadoId = id;
    const chamado = chamados.find(c => c.fid === id);
    if (!chamado) return;
    
    const comentarios = (chamado.comentarios || []).map(co => 
        `<div style="background:#F7FAFC;padding:8px;border-radius:6px;margin-bottom:4px;">
            <strong>${sanitizar(co.autor)}</strong> <small>${fmtData(co.data)}</small>
            <p style="margin-top:2px;">${sanitizar(co.texto)}</p>

async function salvarComentario() {
    const texto = document.getElementById('textoComentario')?.value.trim();
    if (!texto) return;
    
    try {
        const doc = await db.collection('chamados').doc(comentarioChamadoId).get();
        const comentarios = doc.data().comentarios || [];
        comentarios.push({
            autor: usuarioLogado.nome + ' (' + nomeDepto + ')',
            data: new Date().toISOString(),
            texto: texto
        });
        await doc.ref.update({ comentarios });
        document.querySelector('.modal-overlay')?.remove();
        toast('✅ Comentário adicionado!', 'success');
    } catch (e) {
        toast('Erro ao salvar', 'error');
    }
}

function renderIndicadores() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
        <div class="secao ativa">
            <div class="top-bar"><h1>📊 Indicadores</h1></div>
            <div class="filtros-bar">
                <select id="indTipo" onchange="atualizarIndicadoresUI()">
                    <option value="mensal">Mensal</option>
                    <option value="semanal">Semanal</option>
                </select>
                <select id="indPeriodo1" onchange="atualizarIndicadoresUI()"></select>
                <span style="font-weight:600;">vs</span>
                <select id="indPeriodo2" onchange="atualizarIndicadoresUI()"></select>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;" id="indicadorGrid"></div>
            <div class="charts-grid">
                <div class="chart-card"><h3>📈 Comparativo</h3><canvas id="graficoComparativo"></canvas></div>
                <div class="chart-card"><h3>🎯 Resolução</h3><canvas id="graficoResolucao"></canvas></div>
            </div>
        </div>
    `;
    
    // Preencher períodos
    const tipo = 'mensal';
    const agora = new Date();
    const periodos = [];
    
    for (let i = 11; i >= 0; i--) {
        const data = new Date(agora.getFullYear(), agora.getMonth() - i, 1);
        periodos.push({
            value: data.toISOString().slice(0, 7),
            label: data.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })
        });
    }
    
    const s1 = document.getElementById('indPeriodo1');
    const s2 = document.getElementById('indPeriodo2');
    if (s1 && s2) {
        const opts = periodos.map(p => `<option value="${p.value}">${p.label}</option>`).join('');
        s1.innerHTML = opts;
        s2.innerHTML = opts;
        s1.value = periodos[periodos.length - 2]?.value || '';
        s2.value = periodos[periodos.length - 1]?.value || '';
    }
    
    atualizarIndicadoresUI();
}

function atualizarIndicadoresUI() {
    const tipo = document.getElementById('indTipo')?.value || 'mensal';
    const p1 = document.getElementById('indPeriodo1')?.value;
    const p2 = document.getElementById('indPeriodo2')?.value;
    
    if (!p1 || !p2) return;
    
    const cr = chamados.filter(c => c.tipo !== 'gesthosp');
    
    const fp = (p) => cr.filter(c => {
        const d = toDate(c.data_abertura);
        return d.toISOString().slice(0, 7) === p;
    });
    
    const d1 = fp(p1);
    const d2 = fp(p2);
    
    const t1 = d1.length;
    const t2 = d2.length;
    const c1 = d1.filter(c => c.status === 'Concluído').length;
    const c2 = d2.filter(c => c.status === 'Concluído').length;
    const tx1 = t1 > 0 ? Math.round((c1 / t1) * 100) : 0;
    const tx2 = t2 > 0 ? Math.round((c2 / t2) * 100) : 0;
    
    const grid = document.getElementById('indicadorGrid');
    if (grid) {
        grid.innerHTML = `

            <div class="table-card">
                <table>
                    <thead><tr><th>Setor</th><th>Última Troca</th><th>Próxima Prevista</th><th>Técnico</th><th>Tipo</th><th>Dias</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="tabelaToners">${renderLinhasToners()}</tbody>
                </table>
            </div>
        </div>
    `;
}

function renderLinhasToners() {
    const setoresImp = ['Recepção Geral', 'Recepção CR', 'Administração', 'UTI I', 'UTI II', 'Farmácia', 'CAF Principal', 'CAF CR', 'Faturamento', 'NIR', 'Oncologia I', 'Oncologia II', 'Centro Cirúrgico'];
    const ct = chamados.filter(c => c.isToner || c.tipo === 'toner');
    
    const td = {};
    setoresImp.forEach(s => { td[s] = { ultima: null, hist: [], dias: 0, status: 'normal' }; });
    
    ct.forEach(t => {
        const s = t.setor;
        if (s && td[s]) {
            const d = toDate(t.data_troca_toner || t.data_abertura);
            td[s].hist.push({ data: d, tecnico: t.solicitante || 'TI', tipo: t.tipo_troca || 'preventiva', obs: t.observacao || '' });
        }
    });
    
    Object.keys(td).forEach(s => {
        td[s].hist.sort((a, b) => b.data - a.data);
        if (td[s].hist.length > 0) {
            td[s].ultima = td[s].hist[0];
            td[s].dias = Math.floor((new Date() - td[s].ultima.data) / 86400000);
            if (td[s].dias > 90) td[s].status = 'critico';
            else if (td[s].dias > 60) td[s].status = 'atencao';
        }
    });
    
    return Object.entries(td).map(([s, d]) => {
        if (!d.ultima) return `<tr><td><strong>${sanitizar(s)}</strong></td><td colspan="7" style="text-align:center;color:#A0AEC0;">Nenhuma troca</td></tr>`;
        
        const si = d.status === 'critico' ? '🔴' : d.status === 'atencao' ? '🟡' : '🟢';
        const st = d.status === 'critico' ? 'Crítico' : d.status === 'atencao' ? 'Atenção' : 'Normal';
        const cd = d.dias > 90 ? 'color:#E53E3E;' : d.dias > 60 ? 'color:#DD6B20;' : 'color:#38A169;';
        const pp = new Date(d.ultima.data);
        pp.setDate(pp.getDate() + 90);
        const dr = Math.floor((pp - new Date()) / 86400000);
        
        return `<tr style="${d.status === 'critico' ? 'background:#FFF5F5;' : ''}">
            <td><strong>${sanitizar(s)}</strong></td>
            <td>${fmtData(d.ultima.data)}</td>
            <td>${dr > 0 ? fmtData(pp) : '<span style="color:#E53E3E;">Vencida</span>'}</td>
            <td>${sanitizar(d.ultima.tecnico)}</td>
            <td>${d.ultima.tipo === 'preventiva' ? '🟢 Preventiva' : '🔴 Necessária'}</td>
            <td style="${cd}font-weight:600;">${d.dias}d</td>
            <td>${si} ${st}</td>
            <td><button class="btn btn-sm btn-outline" onclick="verHistoricoToner('${s}')">📜 ${d.hist.length}</button></td>
        </tr>`;
    }).join('');
}

function verHistoricoToner(s) {
    const ct = chamados.filter(c => (c.isToner || c.tipo === 'toner') && c.setor === s)
        .sort((a, b) => toDate(b.data_troca_toner || b.data_abertura) - toDate(a.data_troca_toner || a.data_abertura));
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay ativa';
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <h3>📜 Histórico - ${sanitizar(s)}</h3>
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            </div>
            <div>
                ${ct.length > 0 ? ct.map(t => `
                    <div style="padding:8px;border-bottom:1px solid #F3F4F6;">
                        <strong>${fmtData(toDate(t.data_troca_toner || t.data_abertura))}</strong>
                        — ${t.tipo_troca === 'preventiva' ? '🟢 Preventiva' : '🔴 Necessária'}
                        <br><small>${sanitizar(t.solicitante || 'TI')}${t.observacao ? ' - ' + sanitizar(t.observacao) : ''}</small>
                    </div>
                `).join('') : '<p style="color:#A0AEC0;">Nenhum histórico</p>'}
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

                <td>${sanitizar(ip.tipo || '—')}</td>
                <td><code>${sanitizar(ip.ip || '—')}</code></td>
                <td>${sanitizar(ip.mac || '—')}</td>
                <td>${sanitizar(ip.localizacao || '—')}</td>
                <td>${sanitizar(ip.setor || '—')}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick="editarIP('${ip.fid}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="excluirIP('${ip.fid}')">🗑️</button>
                </td>
            </tr>`).join('');
        
        main.innerHTML = `
            <div class="secao ativa">
                <div class="top-bar"><h1>🌐 IPs & Rede</h1><button class="btn btn-primary" onclick="abrirModalIP()"><i class="fas fa-plus"></i> Novo Dispositivo</button></div>
                <div class="table-card">
                    <table>
                        <thead><tr><th>Dispositivo</th><th>Tipo</th><th>IP</th><th>MAC</th><th>Local</th><th>Setor</th><th>Ações</th></tr></thead>
                        <tbody>${linhas}</tbody>
                    </table>
                </div>
            </div>
        `;
    });
}

function abrirModalIP(id = null) {
    if (id) {
        db.collection('ips_rede').doc(id).get().then(doc => {
            if (doc.exists) {
                const ip = doc.data();
                mostrarModalIP(id, ip);
            }
        });
    } else {
        mostrarModalIP(null, {});
    }
}

function mostrarModalIP(id, ip) {
    const setoresOptions = ['Administração','Almoxarifado','CAF Principal','CAF CR','Centro Cirúrgico','Clínica Cirurgica','Clínica Médica I','Clínica Médica II','Comunicação','Direção Administrativa','Emergência/Vermelha','Farmácia','Faturamento','Fisioterapia','Hotelaria','Laboratório','Manutenção','NIR','Nutrição','Oncologia I','Oncologia II','Outros','Pediatria','RH','Raio-X','Recepção CR','Recepção Geral','Same','TI','Tomografia','UTI I','UTI II'].map(s => `<option value="${s}" ${ip.setor === s ? 'selected' : ''}>${s}</option>`).join('');
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay ativa';
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <h3>${id ? '✏️ Editar Dispositivo' : '🌐 Novo Dispositivo'}</h3>
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            </div>
            <form onsubmit="salvarIP(event, '${id || ''}')" style="display:grid;gap:8px;">
                <div class="form-group"><label>Dispositivo *</label><input type="text" id="ipDispositivo" required value="${ip.dispositivo || ''}"></div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="ipTipo">
                        <option value="">Selecione...</option>
                        <option ${ip.tipo === '💻 Computador' ? 'selected' : ''}>💻 Computador</option>
                        <option ${ip.tipo === '🖨️ Impressora' ? 'selected' : ''}>🖨️ Impressora</option>
                        <option ${ip.tipo === '🖧 Switch' ? 'selected' : ''}>🖧 Switch</option>
                        <option ${ip.tipo === '📡 Roteador' ? 'selected' : ''}>📡 Roteador</option>
                        <option ${ip.tipo === '📞 Telefone' ? 'selected' : ''}>📞 Telefone</option>
                        <option ${ip.tipo === '📷 Câmera' ? 'selected' : ''}>📷 Câmera</option>
                        <option ${ip.tipo === '📺 TV' ? 'selected' : ''}>📺 TV</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>IP *</label><input type="text" id="ipEndereco" required value="${ip.ip || ''}"></div>
                    <div class="form-group"><label>MAC</label><input type="text" id="ipMAC" value="${ip.mac || ''}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Local</label><input type="text" id="ipLocal" value="${ip.localizacao || ''}"></div>
                    <div class="form-group"><label>Setor *</label><select id="ipSetor" required><option value="">Selecione...</option>${setoresOptions}</select></div>
                </div>
                <div class="form-group"><label>Obs</label><textarea id="ipObs" rows="2">${ip.observacao || ''}</textarea></div>
                <div style="display:flex;gap:6px;">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
                </div>
            </form>
        </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

async function salvarIP(e, id) {
    e.preventDefault();
    const dados = {
        dispositivo: document.getElementById('ipDispositivo')?.value.trim(),
        tipo: document.getElementById('ipTipo')?.value,
        ip: document.getElementById('ipEndereco')?.value.trim(),
        mac: document.getElementById('ipMAC')?.value.trim(),
        localizacao: document.getElementById('ipLocal')?.value.trim(),
        setor: document.getElementById('ipSetor')?.value,
        observacao: document.getElementById('ipObs')?.value.trim()
    };
    
    if (!dados.dispositivo || !dados.ip || !dados.setor) { toast('Preencha os campos obrigatórios', 'error'); return; }
    
    try {
        if (id) {
            await db.collection('ips_rede').doc(id).update(dados);
        } else {
            await db.collection('ips_rede').add(dados);
        }
        document.querySelector('.modal-overlay')?.remove();
        renderIPs();
        toast('✅ Salvo!', 'success');
    } catch (e) {
        toast('Erro ao salvar', 'error');
    }
}

function editarIP(id) { abrirModalIP(id); }

async function excluirIP(id) {
    if (!confirm('Excluir este dispositivo?')) return;
    try {
        await db.collection('ips_rede').doc(id).delete();
        renderIPs();
        toast('🗑️ Excluído!', 'success');
    } catch (e) {
        toast('Erro ao excluir', 'error');
    }
}

// Equipe
function renderEquipe() {
    const main = document.getElementById('mainContent');
    
    const p = getPerms();
    if (!p.podeEquipe) {
        main.innerHTML = `<div class="secao ativa"><div class="top-bar"><h1>👥 Equipe</h1></div><p style="text-align:center;padding:40px;color:#A0AEC0;">🔒 Acesso restrito</p></div>`;
        return;
    }
    
    db.collection('usuarios').where('departamento', '==', depto).get().then(snap => {
        let linhas = '';
        snap.forEach(doc => {
            const u = doc.data();
            let acoes = '';
            if (u.usuario !== usuarioLogado.usuario) {
                acoes = `<button class="btn btn-sm btn-danger" onclick="removerTecnico('${doc.id}')">🗑️</button>`;
            } else {
                acoes = '<span class="badge badge-amber">Você</span>';
            }
            linhas += `<tr>
                <td><strong>${sanitizar(u.nome || '')}</strong></td>
                <td>@${sanitizar(u.usuario || '')}</td>
                <td>${sanitizar(u.cargo || '')}</td>
                <td>${sanitizar(u.whatsapp || '—')}</td>
                <td><span class="badge ${u.status === 'ativo' ? 'badge-green' : 'badge-amber'}">${sanitizar(u.status || '')}</span></td>
                <td>${acoes}</td>
            </tr>`;
        });
        
        if (!linhas) linhas = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#A0AEC0;">Nenhum membro</td></tr>';
        
        main.innerHTML = `
            <div class="secao ativa">
                <div class="top-bar"><h1>👥 Equipe — ${sanitizar(nomeDepto)}</h1><button class="btn btn-primary" onclick="abrirModalTecnico()"><i class="fas fa-plus"></i> Novo Membro</button></div>
                <div class="table-card">
                    <table>
                        <thead><tr><th>Nome</th><th>Usuário</th><th>Cargo</th><th>WhatsApp</th><th>Status</th><th>Ações</th></tr></thead>
                        <tbody>${linhas}</tbody>
                    </table>
                </div>
            </div>
        `;
    });
}

function abrirModalTecnico() {
    const cargos = depto === 'TI' 
        ? ['Técnico de Suporte TI', 'Analista de Sistemas', 'Analista de Redes', 'Técnico de Informática']
        : ['Supervisor de Manutenção', 'Técnico de Manutenção', 'Eletricista', 'Encanador', 'Técnico de Refrigeração', 'Pedreiro', 'Pintor', 'Marceneiro', 'Auxiliar de Manutenção'];
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay ativa';
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <h3>👤 Novo Membro</h3>
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            </div>
            <form onsubmit="salvarTecnico(event)" style="display:grid;gap:8px;">
                <div class="form-group"><label>Nome *</label><input type="text" id="tecnicoNome" required></div>
                <div class="form-group"><label>Usuário *</label><input type="text" id="tecnicoUsuario" required></div>
                <div class="form-group"><label>Cargo *</label><select id="tecnicoCargo">${cargos.map(c => `<option>${c}</option>`).join('')}</select></div>
                <div class="form-group"><label>WhatsApp *</label><input type="text" id="tecnicoWhatsApp" required></div>
                <p style="font-size:9px;color:#A0AEC0;">🔑 Senha inicial: 12345</p>
                <div style="display:flex;gap:6px;">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                    <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
                </div>
            </form>
        </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
}

async function salvarTecnico(e) {
    e.preventDefault();
    const nome = document.getElementById('tecnicoNome')?.value.trim();
    const usuario = document.getElementById('tecnicoUsuario')?.value.toLowerCase().trim();
    const whatsapp = document.getElementById('tecnicoWhatsApp')?.value.trim();
    const cargo = document.getElementById('tecnicoCargo')?.value;
    
    if (!nome || !usuario || !whatsapp || !cargo) { toast('Preencha todos os campos', 'error'); return; }
    
    try {
        const existe = await db.collection('usuarios').where('usuario', '==', usuario).get();
        if (!existe.empty) { toast('Usuário já existe', 'error'); return; }
        
        await db.collection('usuarios').add({
            nome, usuario, senha: '12345', cargo, tipo: 'tecnico',
            whatsapp, status: 'ativo', primeiro_acesso: true, departamento: depto
        });
        document.querySelector('.modal-overlay')?.remove();
        renderEquipe();
        toast('✅ Cadastrado!', 'success');
    } catch (e) {
        toast('Erro ao cadastrar', 'error');
    }
}

async function removerTecnico(id) {
    if (!confirm('Remover este membro?')) return;
    try {
        await db.collection('usuarios').doc(id).delete();
        renderEquipe();
        toast('🗑️ Removido!', 'success');
    } catch (e) {
        toast('Erro ao remover', 'error');
    }
}

// Configurações
function renderConfig() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
        <div class="secao ativa">
            <div class="top-bar"><h1>⚙️ Configurações</h1></div>
            <div style="display:grid;gap:16px;max-width:600px;">
                <div class="table-card">
                    <h3>🔐 Alterar Senha</h3>
                    <form onsubmit="alterarSenha(event)" style="display:grid;gap:8px;">
                        <div class="form-group"><label>Senha Atual</label><input type="password" id="senhaAtual" required></div>
                        <div class="form-group"><label>Nova Senha</label><input type="password" id="senhaNova" required minlength="8"></div>
                        <div class="form-group"><label>Confirmar Senha</label><input type="password" id="senhaNovaConfirma" required minlength="8"></div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Alterar</button>
                    </form>
                </div>
            </div>
        </div>
    `;
}

async function alterarSenha(e) {
    e.preventDefault();
    const sa = document.getElementById('senhaAtual')?.value;
    const sn = document.getElementById('senhaNova')?.value;
    const sc = document.getElementById('senhaNovaConfirma')?.value;
    
    if (!sa || !sn || !sc) { toast('Preencha todos os campos', 'error'); return; }
    if (sn !== sc) { toast('Senhas não conferem', 'error'); return; }
    if (sn.length < 8) { toast('Mínimo 8 caracteres', 'error'); return; }
    
    try {
        const us = await db.collection('usuarios').where('usuario', '==', usuarioLogado.usuario).get();
        if (us.empty) { toast('Usuário não encontrado', 'error'); return; }
        
        const ud = us.docs[0];
        if (ud.data().senha !== sa) { toast('Senha atual incorreta', 'error'); return; }
        
        await ud.ref.update({ senha: sn, primeiro_acesso: false });
        toast('✅ Senha alterada!', 'success');
        e.target.reset();
    } catch (e) {
        toast('Erro ao alterar', 'error');
    }
}

// Relatórios
async function gerarRelatorioPDF() {
    try {
        const el = document.createElement('div');
        el.style.cssText = 'padding:30px;background:#fff;width:1000px;position:absolute;left:-9999px;font-family:sans-serif;';
        
        const t = chamados.length;
        const a = chamados.filter(c => c.status !== 'Concluído').length;
        const co = chamados.filter(c => c.status === 'Concluído').length;
        const tx = t > 0 ? Math.round((co / t) * 100) : 0;
        
        el.innerHTML = `
            <div style="text-align:center;border-bottom:3px solid #3182CE;padding-bottom:16px;">
                <h1 style="color:#1a3a5c;">HelpHosp</h1><h2>${sanitizar(nomeDepto)}</h2>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0;">
                <div style="background:#F7FAFC;padding:16px;border-radius:8px;text-align:center;"><p>TOTAL</p><p style="font-size:32px;">${t}</p></div>
                <div style="background:#FFF5F5;padding:16px;border-radius:8px;text-align:center;"><p style="color:#E53E3E;">ABERTOS</p><p style="font-size:32px;color:#E53E3E;">${a}</p></div>
                <div style="background:#F0FFF4;padding:16px;border-radius:8px;text-align:center;"><p style="color:#38A169;">CONCLUÍDOS</p><p style="font-size:32px;color:#38A169;">${co}</p></div>
                <div style="background:#FFFBEB;padding:16px;border-radius:8px;text-align:center;"><p style="color:#DD6B20;">TAXA</p><p style="font-size:32px;color:#DD6B20;">${tx}%</p></div>
            </div>
        `;
        
        document.body.appendChild(el);
        const cv = await html2canvas(el, { scale: 2 });
        document.body.removeChild(el);
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        pdf.addImage(cv.toDataURL('image/png'), 'PNG', 5, 5, 200, (cv.height * 200) / cv.width);
        pdf.save(`relatorio-${nomeDepto.toLowerCase().replace(/\s/g, '-')}.pdf`);
        
        toast('📄 Relatório gerado!', 'success');
    } catch (e) {
        toast('Erro ao gerar relatório', 'error');
    }
}

// Inicialização
async function init() {
    if (!checkAuth()) return;
    initUI();
    if (Notification.permission === 'default') Notification.requestPermission();
}

window.addEventListener('load', init);
</script>
