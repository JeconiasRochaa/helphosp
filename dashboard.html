        @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
        .menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:110;background:var(--primary);color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}

        .inv-card{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
        .inv-card:hover{box-shadow:0 6px 16px rgba(0,0,0,0.1);border-color:#3182CE}
        .inv-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo"><i class="fas fa-hospital"></i></div><h2><span class="help">Help</span><span class="hosp">Hosp</span></h2><div class="subtitle">Painel Premium</div></div>

    </div>
</aside>
<main class="main-content" id="mainContent"><div style="text-align:center;padding:60px;"><div style="font-size:40px;">🔄</div><h3>Carregando...</h3></div></main>

<script>
// ============================================
// FIREBASE CONFIG
// ============================================
const fc={apiKey:"AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",authDomain:"helphosp.firebaseapp.com",projectId:"helphosp",storageBucket:"helphosp.firebasestorage.app",messagingSenderId:"1075623193163",appId:"1:1075623193163:web:cf54ee082d1c97a9aa7bce"};
firebase.initializeApp(fc);const db=firebase.firestore();const storage=firebase.storage();

const SETORES_PADRAO=['Administração','Almoxarifado','Farmacia CAF','Centro Cirúrgico','Clínica Cirurgica','Clínica Médica I','Clínica Médica II','Comunicação','Direção Administrativa','Direção Enfermagem','Direção geral','Direção Medica','Emergência/Vermelha','Engenharia Clinica','Farmácia','Faturamento','Fisioterapia','Hotelaria','Juridico','Laboratório','Manutenção','NIR','Nutrição','Oncologia I','Oncologia II','Outros','Ouvidoria','Patrimonio','Pediatria','Psicologia','RH','Raio-X','Recepção CR','Recepção Geral','Recepção Nefrologia','Same','Serviço Social','Sesmt','Telemedicina','Tomografia','UTI I','UTI II'];
const SETORES_TONERS=['Administração','Faturamento','UTI I','UTI II','NIR','Oncologia I & II','Recepção Geral','Recepção CR','Farmácia CAF','Centro Cirúrgico'];
let setores=[...SETORES_PADRAO],departamentosChamados=['TI','MANUTENCAO'];
let usuarioLogado=null,depto='TI',nomeDepto='Tecnologia da Informação';
let chamados=[],inventario=[],estoque=[],movimentacoes=[],charts={},comentarioChamadoId=null,logoHospital=null,logoGoverno=null;
let ipsRede=[],agenda=[],arquivos=[],equipe=[];

// ============================================
// TEMA
// ============================================
function toggleTheme(){const h=document.documentElement,i=document.getElementById('themeIcon');if(h.getAttribute('data-theme')==='dark'){h.removeAttribute('data-theme');i.className='fas fa-moon';localStorage.setItem('theme','light');}else{h.setAttribute('data-theme','dark');i.className='fas fa-sun';localStorage.setItem('theme','dark');}}
(function(){if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeIcon').className='fas fa-sun';}})();

// ============================================
// UTILITÁRIOS
// ============================================
function toast(m,t='info'){const e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=`<i class="fas fa-${t==='success'?'check-circle':t==='error'?'exclamation-circle':'info-circle'}"></i> ${m}`;document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
function fmtData(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt.getTime()))return'—';return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function fmtDataCurta(d){if(!d)return'—';try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt.getTime()))return'—';const a=new Date();const diff=Math.floor((a-dt)/1000);if(diff<60)return'agora';if(diff<3600)return Math.floor(diff/60)+'min';if(diff<86400)return Math.floor(diff/3600)+'h';return Math.floor(diff/86400)+'d'}catch(e){return'—'}}
function toDate(d){if(!d)return new Date(0);return d?.toDate?d.toDate():new Date(d)}
function sanitizar(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function getStatusClass(s){const c={'Concluído':'badge-green','Em Andamento':'badge-amber','Pendente':'badge-red','A Fazer':'badge-blue'};return c[s]||'badge-blue'}
function getPrioridadeClass(p){const c={'Baixa':'badge-blue','Média':'badge-amber','Alta':'badge-red','Crítica':'badge-red'};return c[p]||'badge-blue'}
function abrirModal(conteudo,mw='750px'){const m=document.createElement('div');m.className='modal-overlay ativa';m.innerHTML=`<div class="modal-box" style="max-width:${mw};">${conteudo}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m}
function getSLAStatus(c){if(c.status==='Concluído')return'sla-ok';const sla={'Crítica':3600000,'Alta':14400000,'Média':86400000,'Baixa':172800000};const ab=toDate(c.data_abertura),ag=new Date(),pr=sla[c.prioridade]||86400000,tr=pr-(ag-ab);if(tr<=0)return'sla-critical';if(tr<pr*0.3)return'sla-warning';return'sla-ok'}
function getSLATexto(c){const s=getSLAStatus(c);if(s==='sla-critical')return'🔴 Atrasado';if(s==='sla-warning')return'🟡 Próximo';return'🟢 No prazo'}

// ============================================
// AUTENTICAÇÃO
// ============================================
function checkAuth(){
    const u=localStorage.getItem('usuario_logado');
    if(!u){window.location.href='admin.html';return false}
    try{
        usuarioLogado=JSON.parse(u);
        if(usuarioLogado.expira&&Date.now()>usuarioLogado.expira){
            localStorage.removeItem('usuario_logado');
            window.location.href='admin.html';
            return false;
        }
        usuarioLogado.expira=Date.now()+86400000;
        localStorage.setItem('usuario_logado',JSON.stringify(usuarioLogado));
        depto=usuarioLogado.departamento||'TI';
        nomeDepto=depto==='TI'?'Tecnologia da Informação':'Manutenção';
        return true;
    }catch(e){
        localStorage.removeItem('usuario_logado');
        window.location.href='admin.html';
        return false;
    }
}
function getPerms(){
    const isAdmin=usuarioLogado.tipo==='admin'||usuarioLogado.usuario==='edson';
    return{isAdmin,isTI:depto==='TI',isManut:depto==='MANUTENCAO',podeEquipe:isAdmin||(depto==='MANUTENCAO'&&(usuarioLogado.usuario==='bruno'||usuarioLogado.usuario==='benicio'))};
}
function logout(){if(confirm('Sair do sistema?')){localStorage.removeItem('usuario_logado');window.location.href='admin.html'}}

// ============================================
// CONFIGURAÇÕES E LOGOS
// ============================================
async function loadConfig(){
    try{
        const ds=await db.collection('configuracoes').doc('setores').get();
        if(ds.exists&&ds.data().setores)setores=ds.data().setores;
        const dd=await db.collection('configuracoes').doc('departamentos_chamados').get();
        if(dd.exists&&dd.data().departamentos)departamentosChamados=dd.data().departamentos;
        const dl=await db.collection('configuracoes').doc('logos').get();
        if(dl.exists){
            if(dl.data().hospital)logoHospital=dl.data().hospital;
            if(dl.data().governo)logoGoverno=dl.data().governo;
        }
    }catch(e){}
}

// ============================================
// FILTRO DE CHAMADOS - CORRIGIDO
// ============================================
function getChamadosDoDepartamento(){
    return chamados.filter(c=>{
        const cd=c.departamento||'';
        if(cd===depto)return true;
        if(!cd){
            if(depto==='TI')return true;
            if(depto==='MANUTENCAO'){
                const sm=['Manutenção','Hotelaria','Engenharia Clinica','Patrimonio','Almoxarifado'];
                if(sm.includes(c.setor))return true;
                if(c.executante)return true;
                return false;
            }
        }
        return false;
    });
}

// ============================================
// INTERFACE
// ============================================
function initUI(){
    document.getElementById('userName').textContent=usuarioLogado.nome;
    document.getElementById('userRole').textContent=`${usuarioLogado.cargo} · ${nomeDepto}`;
    document.getElementById('userAvatar').textContent=usuarioLogado.nome.charAt(0).toUpperCase();
    buildMenu();
    carregarTodosDados();
}
function buildMenu(){
    const p=getPerms();
    const nav=document.getElementById('sidebarNav');
    let h='<div class="nav-section"><div class="nav-title">Principal</div>';
    h+=navItem('dashboard','chart-pie','Dashboard',true);
    h+=navItem('chamados','ticket-alt','Chamados',false,'badgeChamados');
    h+=navItem('sla','clock','Monitor SLA',false,'badgeSLA');
    h+=navItem('indicadores','chart-line','Indicadores');
    h+='</div><div class="nav-section"><div class="nav-title">Gestão</div>';
    if(p.isTI||p.isAdmin){
        h+=navItem('toners','print','Toners');
        h+=navItem('estoque','box','Estoque');
        h+=navItem('inventario','clipboard-list','Inventário');
        h+=navItem('ips','network-wired','IPs & Rede');
    }
    if(p.podeEquipe)h+=navItem('equipe','users-cog','Equipe');
    h+='</div><div class="nav-section"><div class="nav-title">Recursos</div>';
    h+=navItem('arquivos','folder-open','Arquivos');
    h+=navItem('agenda','calendar-alt','Agenda',false,'badgeAgenda');
    h+=navItem('config','cog','Configurações');
    h+='</div>';
    nav.innerHTML=h;
}
function navItem(s,ic,tx,at=false,bd=null){
    const badge=bd?`<span class="badge-notify" id="${bd}">0</span>`:'';
    return`<div class="nav-item${at?' active':''}" data-secao="${s}" onclick="navegar('${s}',this)"><i class="fas fa-${ic}"></i><span>${tx}</span>${badge}</div>`;
}
function navegar(s,el){
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    if(el)el.classList.add('active');
    if(window.innerWidth<1025)document.getElementById('sidebar').classList.remove('open');
    switch(s){
        case'dashboard':renderDashboard();break;
        case'chamados':renderChamados();break;
        case'sla':renderSLA();break;
        case'indicadores':renderIndicadores();break;
        case'toners':renderToners();break;
        case'estoque':renderEstoque();break;
        case'inventario':renderInventario();break;
        case'ips':renderIPs();break;
        case'equipe':renderEquipe();break;
        case'arquivos':renderArquivos();break;
        case'agenda':renderAgenda();break;
        case'config':renderConfig();break;
    }
}

async function carregarTodosDados(){
    try{
        // CARREGA TODOS OS CHAMADOS (SEM FILTRO)
        const sc=await db.collection('chamados').orderBy('data_abertura','desc').get();
        chamados=[];sc.forEach(d=>{const x=d.data();x.fid=d.id;chamados.push(x);});
        
        const si=await db.collection('inventario').get();
        inventario=[];si.forEach(d=>{const x=d.data();x.fid=d.id;inventario.push(x);});
        
        const se=await db.collection('estoque').get();
        estoque=[];se.forEach(d=>{const x=d.data();x.fid=d.id;estoque.push(x);});
        
        const sm=await db.collection('movimentacoes').orderBy('data','desc').limit(200).get();
        movimentacoes=[];sm.forEach(d=>{const x=d.data();x.fid=d.id;movimentacoes.push(x);});
        
        const sip=await db.collection('ips_rede').orderBy('setor').get();
        ipsRede=[];sip.forEach(d=>{const x=d.data();x.fid=d.id;ipsRede.push(x);});
        
        const sag=await db.collection('agenda').orderBy('data','asc').get();
        agenda=[];sag.forEach(d=>{const x=d.data();x.fid=d.id;agenda.push(x);});
        
        const sar=await db.collection('arquivos').orderBy('data','desc').get();
        arquivos=[];sar.forEach(d=>{const x=d.data();x.fid=d.id;arquivos.push(x);});
        
        const seq=await db.collection('usuarios').where('departamento','==',depto).get();
        equipe=[];seq.forEach(d=>{const x=d.data();x.fid=d.id;equipe.push(x);});
        
        renderDashboard();
        escutarChamados();
        atualizarBadges();
        verificarAgenda();
    }catch(e){console.error(e);renderDashboard();}
}

function escutarChamados(){
    db.collection('chamados').orderBy('data_abertura','desc').onSnapshot(snap=>{
        chamados=[];snap.forEach(d=>{const x=d.data();x.fid=d.id;chamados.push(x);});
        atualizarBadges();
        if(document.getElementById('infoTotal'))atualizarDashboard();
        if(document.getElementById('tabelaChamados'))filtrarChamadosUI();
    });
}
function atualizarBadges(){
    const cd=getChamadosDoDepartamento();
    const b1=document.getElementById('badgeChamados');
    if(b1){const n=cd.filter(c=>c.status!=='Concluído').length;b1.style.display=n>0?'inline-block':'none';b1.textContent=n>99?'99+':n}
    const b2=document.getElementById('badgeSLA');
    if(b2){const n=cd.filter(c=>getSLAStatus(c)==='sla-critical').length;b2.style.display=n>0?'inline-block':'none';b2.textContent=n}
}
async function verificarAgenda(){
    try{
        const h=new Date();h.setHours(0,0,0,0);
        const s=await db.collection('agenda').where('data','>=',firebase.firestore.Timestamp.fromDate(h)).get();
        const b=document.getElementById('badgeAgenda');
        if(b){b.style.display=s.size>0?'inline-block':'none';b.textContent=s.size}
    }catch(e){}
}

c=>`<tr onclick="verDetalhes('${c.fid}')" style="cursor:pointer;"><td><strong>${sanitizar(c.protocolo||'—')}</strong></td><td>${sanitizar(c.titulo||'—')}</td><td>${sanitizar(c.setor||'—')}</td><td><span class="badge ${getPrioridadeClass(c.prioridade)}">${sanitizar(c.prioridade||'—')}</span></td><td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></td><td><span class="sla-alert ${getSLAStatus(c)}">${getSLATexto(c)}</span></td><td>${fmtDataCurta(c.data_abertura)}</td></tr>`).join('')}</tbody></table></div>`;

}
function atualizarDashboard(){
    const periodoValue=document.getElementById('periodo')?.value||'30';
    const cd=getChamadosDoDepartamento();
    let f=cd;
    if(periodoValue!=='all'){
        const p=parseInt(periodoValue),dl=new Date();dl.setDate(dl.getDate()-p);
        f=cd.filter(c=>{const d=toDate(c.data_abertura);return!isNaN(d.getTime())&&d>=dl;});
    }
    document.getElementById('infoTotal').textContent=f.length;
    document.getElementById('infoAbertos').textContent=f.filter(c=>c.status!=='Concluído').length;
    document.getElementById('infoConcluidos').textContent=f.filter(c=>c.status==='Concluído').length;
    document.getElementById('infoCriticos').textContent=f.filter(c=>c.prioridade==='Crítica'&&c.status!=='Concluído').length;
    document.getElementById('infoTaxa').textContent=f.length>0?Math.round(f.filter(c=>c.status==='Concluído').length/f.length*100)+'%':'0%';
    document.getElementById('infoSLA').textContent=f.filter(c=>getSLAStatus(c)==='sla-critical').length;
    Object.values(charts).forEach(c=>{if(c)c.destroy()});charts={};
    const ds={};f.forEach(c=>{const s=c.setor||'Outros';ds[s]=(ds[s]||0)+1});
    const cores=['#3182CE','#38A169','#805AD5','#DD6B20','#E53E3E','#6366F1','#D69E2E','#EC4899'];
    const ctx1=document.getElementById('graficoSetor');
    if(ctx1)charts.setor=new Chart(ctx1,{type:'doughnut',data:{labels:Object.keys(ds).slice(0,8),datasets:[{data:Object.values(ds).slice(0,8),backgroundColor:cores,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'bottom',labels:{padding:15}}}}});
    const dp={};f.forEach(c=>{const pr=c.prioridade||'Média';dp[pr]=(dp[pr]||0)+1});
    const ctx2=document.getElementById('graficoPrioridade');
    if(ctx2)charts.prioridade=new Chart(ctx2,{type:'pie',data:{labels:Object.keys(dp),datasets:[{data:Object.values(dp),backgroundColor:['#38A169','#DD6B20','#E53E3E','#C53030'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:15}}}}});
}

async function gerarRelatorioPDF(){
    try{
        toast('📄 Gerando relatório...','info');
        const cd=getChamadosDoDepartamento(),t=cd.length,co=cd.filter(c=>c.status==='Concluído').length,tx=t>0?Math.round(co/t*100):0;
        const el=document.createElement('div');
        el.style.cssText='padding:40px;background:#fff;width:1000px;position:absolute;left:-9999px;font-family:Arial;';
        el.innerHTML=`<div style="text-align:center;border-bottom:3px solid #06224a;padding-bottom:20px;margin-bottom:20px;"><h1 style="color:#06224a;">HelpHosp Premium</h1><h2 style="color:#3182CE;">${sanitizar(nomeDepto)}</h2><p>${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}</p></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0;"><div style="background:#F7FAFC;padding:16px;border-radius:8px;text-align:center;"><p>TOTAL</p><p style="font-size:32px;">${t}</p></div><div style="background:#F0FFF4;padding:16px;border-radius:8px;text-align:center;"><p style="color:#38A169;">CONCLUÍDOS</p><p style="font-size:32px;">${co}</p></div><div style="background:#FFFBEB;padding:16px;border-radius:8px;text-align:center;"><p style="color:#DD6B20;">TAXA</p><p style="font-size:32px;">${tx}%</p></div><div style="background:#FFF5F5;padding:16px;border-radius:8px;text-align:center;"><p style="color:#E53E3E;">SLA ATRASADO</p><p style="font-size:32px;">${cd.filter(c=>getSLAStatus(c)==='sla-critical').length}</p></div></div>`;
        document.body.appendChild(el);
        const cv=await html2canvas(el,{scale:2,useCORS:true,logging:false});document.body.removeChild(el);
        const{jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
        const iw=200,ih=(cv.height*iw)/cv.width;pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,iw,ih);
        pdf.save(`relatorio-${depto.toLowerCase()}-${new Date().toISOString().slice(0,10)}.pdf`);
        toast('✅ Relatório gerado!','success');
    }catch(e){console.error(e);toast('Erro','error');}
}

function renderSLA(){
    const main=document.getElementById('mainContent'),cd=getChamadosDoDepartamento();

}

function renderChamados(){
    const main=document.getElementById('mainContent'),cd=getChamadosDoDepartamento();
    main.innerHTML=`<div class="top-bar"><h1>📋 Chamados — ${sanitizar(nomeDepto)}</h1><small style="color:var(--text-secondary);">Total: ${cd.length} chamados</small></div><div class="filtros-bar"><select id="filtroStatus" onchange="filtrarChamadosUI()"><option value="">Todos os Status</option><option>A Fazer</option><option>Em Andamento</option><option>Pendente</option><option>Concluído</option></select><select id="filtroPrioridade" onchange="filtrarChamadosUI()"><option value="">Todas as Prioridades</option><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select><input type="text" id="filtroBusca" placeholder="🔍 Buscar..." onkeyup="filtrarChamadosUI()"><button class="btn btn-outline btn-sm" onclick="document.getElementById('filtroStatus').value='';document.getElementById('filtroPrioridade').value='';document.getElementById('filtroBusca').value='';filtrarChamadosUI();"><i class="fas fa-times"></i> Limpar</button></div><div class="table-card"><table><thead><tr><th>Protocolo</th><th>Data</th><th>Título</th><th>Solicitante</th><th>Setor</th><th>Prioridade</th><th>Status</th><th>SLA</th><th>Ações</th></tr></thead><tbody id="tabelaChamados">${renderLinhasChamados(cd)}</tbody></table></div>`;
}
function renderLinhasChamados(l){
    if(l.length===0)return'<tr><td colspan="9" style="text-align:center;padding:20px;">📭 Nenhum chamado encontrado</td></tr>';
    return l.sort((a,b)=>toDate(b.data_abertura)-toDate(a.data_abertura)).map(c=>{
        let ac=`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();avancarStatus('${c.fid}')">▶</button>`;
        if(depto==='MANUTENCAO')ac+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();atribuirExecutante('${c.fid}')">👷</button>`;
        ac+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();abrirComentarios('${c.fid}')">💬</button>`;
        if(getPerms().isAdmin)ac+=`<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();excluirChamado('${c.fid}')">🗑️</button>`;
        return`<tr onclick="verDetalhes('${c.fid}')" style="cursor:pointer;"><td><strong>${sanitizar(c.protocolo||'—')}</strong></td><td>${fmtDataCurta(c.data_abertura)}</td><td>${sanitizar(c.titulo||'—')}</td><td>${sanitizar(c.solicitante||'—')}</td><td>${sanitizar(c.setor||'—')}</td><td><span class="badge ${getPrioridadeClass(c.prioridade)}">${sanitizar(c.prioridade||'—')}</span></td><td><span class="badge ${getStatusClass(c.status)}">${sanitizar(c.status||'—')}</span></td><td><span class="sla-alert ${getSLAStatus(c)}">${getSLATexto(c)}</span></td><td onclick="event.stopPropagation();">${ac}</td></tr>`;
    }).join('');
}
function filtrarChamadosUI(){
    const sf=document.getElementById('filtroStatus')?.value||'',pf=document.getElementById('filtroPrioridade')?.value||'',bf=(document.getElementById('filtroBusca')?.value||'').toLowerCase();
    let l=getChamadosDoDepartamento();
    if(sf)l=l.filter(c=>c.status===sf);
    if(pf)l=l.filter(c=>c.prioridade===pf);
    if(bf)l=l.filter(c=>(c.titulo||'').toLowerCase().includes(bf)||(c.protocolo||'').toLowerCase().includes(bf));
    const tb=document.getElementById('tabelaChamados');
    if(tb)tb.innerHTML=renderLinhasChamados(l);
}

async function avancarStatus(id){
    try{
        const doc=await db.collection('chamados').doc(id).get();
        if(!doc.exists){toast('Não encontrado','error');return}
        const d=doc.data();
        const fluxo={'A Fazer':'Em Andamento','Em Andamento':'Pendente','Pendente':'Concluído','Concluído':'A Fazer'};
        const ns=fluxo[d.status||'A Fazer']||'A Fazer';
        const upd={status:ns,data_atualizacao:firebase.firestore.Timestamp.now()};
        if(ns==='Em Andamento'||ns==='Concluído')upd.tecnico=usuarioLogado.nome;
        const h=d.historico||[];
        h.push({data:new Date().toISOString(),acao:`Status: ${ns} por ${usuarioLogado.nome} (${nomeDepto})`});
        upd.historico=h;
        await doc.ref.update(upd);
        toast(`✅ Status: ${ns}`,'success');
    }catch(e){toast('Erro','error');}
}
async function atribuirExecutante(id){
    try{
        const snap=await db.collection('usuarios').where('departamento','==','MANUTENCAO').where('status','==','ativo').get();
        const t=[];snap.forEach(d=>t.push(d.data()));
        abrirModal(`<div class="modal-header"><h3>👷 Atribuir Executante</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarExecutante(event,'${id}')" style="display:grid;gap:8px;"><div class="form-group"><label>Profissional *</label><select id="execSel" required><option value="">Selecione...</option>${t.map(x=>`<option value="${x.nome}">${x.nome} - ${x.cargo}</option>`).join('')}</select></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button><button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button></div></form>`);
    }catch(e){toast('Erro','error');}
}
async function salvarExecutante(e,id){
    e.preventDefault();
    const exec=document.getElementById('execSel')?.value;
    if(!exec){toast('Selecione','error');return}
    try{await db.collection('chamados').doc(id).update({executante:exec});document.querySelector('.modal-overlay')?.remove();toast('✅ Definido!','success');}catch(e){toast('Erro','error');}
}
async function excluirChamado(id){
    if(!confirm('Excluir?'))return;
    try{await db.collection('chamados').doc(id).delete();toast('🗑️ Excluído!','success');}catch(e){toast('Erro','error');}
}
function verDetalhes(id){
    const c=chamados.find(x=>x.fid===id);
    if(!c)return;

function atualizarIndicadoresUI(){
    const tipo=document.getElementById('indTipo')?.value||'30';
    const cd=getChamadosDoDepartamento();
    let f;const agora=new Date();
    if(tipo==='mensal'){const d=new Date(agora.getFullYear(),agora.getMonth(),1);f=cd.filter(c=>toDate(c.data_abertura)>=d)}
    else{const dias=parseInt(tipo),dl=new Date();dl.setDate(dl.getDate()-dias);f=cd.filter(c=>{const d=toDate(c.data_abertura);return!isNaN(d.getTime())&&d>=dl;})}
    const t=f.length,ca=f.filter(c=>c.status==='Concluído').length,cr=f.filter(c=>c.prioridade==='Crítica').length;
    document.getElementById('indicadorGrid').innerHTML=`<div class="stat-card"><div class="stat-icon blue"><i class="fas fa-clipboard-list"></i></div><div class="stat-info"><small>Total</small><strong>${t}</strong></div></div><div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><small>Concluídos</small><strong>${ca}</strong></div></div><div class="stat-card"><div class="stat-icon amber"><i class="fas fa-clock"></i></div><div class="stat-info"><small>Pendentes</small><strong>${t-ca}</strong></div></div><div class="stat-card"><div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><small>Críticos</small><strong>${cr}</strong></div></div>`;
    document.getElementById('tabelaStatusInd').innerHTML=['A Fazer','Em Andamento','Pendente','Concluído'].map(s=>{const q=f.filter(c=>c.status===s).length;return`<tr><td><span class="badge ${getStatusClass(s)}">${s}</span></td><td><strong>${q}</strong></td><td>${t>0?Math.round(q/t*100):0}%</td></tr>`;}).join('');
    Object.values(charts).forEach(c=>{if(c)c.destroy()});charts={};
    const dp={};f.forEach(c=>{const pr=c.prioridade||'Média';dp[pr]=(dp[pr]||0)+1});
    const ctx2=document.getElementById('graficoPrioridadeInd');
    if(ctx2)charts.prioridadeInd=new Chart(ctx2,{type:'pie',data:{labels:Object.keys(dp),datasets:[{data:Object.values(dp),backgroundColor:['#38A169','#DD6B20','#E53E3E','#C53030'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}
async function exportarIndicadoresPDF(){
    try{
        toast('📄 Gerando PDF...','info');
        const cd=getChamadosDoDepartamento(),t=cd.length,ca=cd.filter(c=>c.status==='Concluído').length;
        const el=document.createElement('div');
        el.style.cssText='padding:40px;background:#fff;width:1000px;position:absolute;left:-9999px;font-family:Arial;';
        el.innerHTML=`<h1>Indicadores - ${sanitizar(nomeDepto)}</h1><p>${new Date().toLocaleDateString('pt-BR')}</p><table style="width:100%;border-collapse:collapse;"><thead><tr><th>Status</th><th>Qtd</th><th>%</th></tr></thead><tbody>${['A Fazer','Em Andamento','Pendente','Concluído'].map(s=>{const q=cd.filter(c=>c.status===s).length;return`<tr><td>${s}</td><td>${q}</td><td>${t>0?Math.round(q/t*100):0}%</td></tr>`;}).join('')}</tbody></table>`;

function renderToners(){
    const main=document.getElementById('mainContent');
    const tonerChamados=chamados.filter(c=>c.tipo==='toner').sort((a,b)=>toDate(b.data_troca_toner||b.data_abertura)-toDate(a.data_troca_toner||a.data_abertura));
    const ultimasTrocas={};tonerChamados.forEach(t=>{const s=t.setor;if(!ultimasTrocas[s])ultimasTrocas[s]=t;});
    const l=SETORES_TONERS.map(s=>{
        const ult=ultimasTrocas[s];
        if(!ult)return`<tr><td><strong>${s}</strong></td><td colspan="7" style="text-align:center;">Nenhuma troca</td></tr>`;
        const d=toDate(ult.data_troca_toner||ult.data_abertura),dias=Math.floor((new Date()-d)/86400000);
        const st=dias>90?'crítico':dias>60?'atenção':'normal';
        return`<tr style="${st==='crítico'?'background:#FFF5F5;':''}"><td><strong>${s}</strong></td><td>${fmtData(d)}</td><td>${sanitizar(ult.solicitante||ult.tecnico||'—')}</td><td>${ult.tipo_troca==='preventiva'?'🟢 Preventiva':'🔴 Necessária'}</td><td style="font-weight:600;">${dias} dias</td><td>${st==='crítico'?'🔴 Crítico':st==='atenção'?'🟡 Atenção':'🟢 Normal'}</td><td>${sanitizar(ult.observacao||'—')}</td><td><button class="btn btn-sm btn-outline" onclick="registrarTrocaTonerSetor('${s}')">🔄 Trocar</button></td></tr>`;
    }).join('');
    main.innerHTML=`<div class="top-bar"><h1>🖨️ Monitor de Toners</h1><button class="btn btn-primary btn-sm" onclick="abrirModalToner()"><i class="fas fa-plus"></i> Registrar Troca</button></div><div class="table-card"><table><thead><tr><th>Setor</th><th>Última Troca</th><th>Técnico</th><th>Tipo</th><th>Dias</th><th>Status</th><th>Obs</th><th>Ação</th></tr></thead><tbody>${l}</tbody></table></div>`;

function moverParaSetor(eid){
    const item=estoque.find(e=>e.fid===eid);
    if(!item)return;
    abrirModal(`<div class="modal-header"><h3>📤 Mover para Setor</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><p style="background:#F7FAFC;padding:10px;border-radius:8px;margin-bottom:12px;"><strong>${sanitizar(item.emoji||'📦')} ${sanitizar(item.nome)}</strong> — Disponível: ${item.quantidade||1}</p><form onsubmit="confirmarMoverSetor(event,'${eid}')" style="display:grid;gap:8px;"><div class="form-group"><label>Setor Destino *</label><select id="moverSetor" required><option value="">Selecione...</option>${setores.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label>Quantidade *</label><input type="number" id="moverQtd" value="1" min="1" max="${item.quantidade||1}" required></div><div class="form-group"><label>Motivo *</label><select id="moverMotivo" required><option value="">Selecione...</option><option>Novo equipamento</option><option>Substituição</option><option>Reposição</option><option>Expansão</option><option>Emergência</option></select></div></div><div class="form-group"><label>Tipo de Equipamento</label><select id="moverTipoEquip"><option value="computadores">💻 Computador</option><option value="impressoras">🖨️ Impressora</option><option value="ramais">📞 Ramal</option><option value="tvs">📺 TV</option><option value="redes">📡 Rede</option><option value="outros">📱 Outros</option></select></div><button type="submit" class="btn btn-success">Confirmar</button></form>`);
}
async function confirmarMoverSetor(e,eid){
    e.preventDefault();
    const setor=document.getElementById('moverSetor')?.value,qtd=parseInt(document.getElementById('moverQtd')?.value)||1,motivo=document.getElementById('moverMotivo')?.value,tipoEquip=document.getElementById('moverTipoEquip')?.value||'outros';
    const item=estoque.find(x=>x.fid===eid);
    if(!item||!setor||!motivo)return;
    try{
        const rest=(item.quantidade||1)-qtd;
        if(rest<=0)await db.collection('estoque').doc(eid).delete();
        else await db.collection('estoque').doc(eid).update({quantidade:rest});
        const is=await db.collection('inventario').where('setor','==',setor).get();
        if(is.empty){
            const n={setor,computadores:0,impressoras:0,ramais:0,tvs:0,redes:0,outros:0};
            n[tipoEquip]=qtd;
            await db.collection('inventario').add(n);
        }else{
            const d=is.docs[0],da=d.data();da[tipoEquip]=(da[tipoEquip]||0)+qtd;
            await d.ref.update({[tipoEquip]:da[tipoEquip]});
        }
        await db.collection('movimentacoes').add({data:firebase.firestore.Timestamp.now(),quantidade:qtd,tipo:tipoEquip,itemNome:item.nome,setorDestino:setor,motivo,tecnico:usuarioLogado.nome,departamento:depto});
        document.querySelector('.modal-overlay')?.remove();
        toast(`✅ ${qtd} un. movida(s) para ${setor}!`,'success');
        renderEstoque();
    }catch(e){toast('Erro','error');}
}
function abrirModalEstoqueItem(id=null){
    const item=id?estoque.find(e=>e.fid===id):null;
    abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'📦 Novo'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarEstoqueItem(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Emoji</label><input type="text" id="estoqueEmoji" maxlength="2" value="${item?.emoji||'📦'}"></div><div class="form-group"><label>Nome *</label><input type="text" id="estoqueNome" required value="${sanitizar(item?.nome||'')}"></div><div class="form-row"><div class="form-group"><label>Status</label><select id="estoqueStatus"><option value="Em estoque">🟢 Em estoque</option><option value="Com defeito">🔴 Com defeito</option><option value="Em manutenção">🟡 Em manutenção</option></select></div><div class="form-group"><label>Quantidade *</label><input type="number" id="estoqueQtd" value="${item?.quantidade||1}" min="1"></div></div><button type="submit" class="btn btn-primary">Salvar</button></form>`);
}
async function salvarEstoqueItem(e,id){
    e.preventDefault();
    const d={emoji:document.getElementById('estoqueEmoji')?.value||'📦',nome:document.getElementById('estoqueNome')?.value.trim(),status:document.getElementById('estoqueStatus')?.value||'Em estoque',quantidade:parseInt(document.getElementById('estoqueQtd')?.value)||1};

    try{
        if(id)await db.collection('estoque').doc(id).update(d);

        document.querySelector('.modal-overlay')?.remove();
        renderEstoque();

    }catch(e){toast('Erro','error');}

function editarEstoqueItem(id){abrirModalEstoqueItem(id);}
async function excluirEstoqueItem(id){

    try{await db.collection('estoque').doc(id).delete();renderEstoque();toast('🗑️ Excluído!','success');}catch(e){toast('Erro','error');}
}

function filtrarInventarioUI(){

    let l=[...inventario];

function renderArquivos(){
    const main=document.getElementById('mainContent');
    main.innerHTML=`<div class="top-bar"><h1>📁 Arquivos e Fotos</h1><button class="btn btn-primary btn-sm" onclick="abrirUploadFoto()"><i class="fas fa-upload"></i> Upload</button></div><div class="filtros-bar"><select id="filtroCatFoto" onchange="carregarFotos()"><option value="">Todas</option><option value="defeito">🔴 Defeito</option><option value="instalacao">🟢 Instalação</option><option value="servico">🔧 Serviço</option><option value="geral">📷 Geral</option></select></div><div class="foto-grid" id="listaFotos">Carregando...</div>`;
    carregarFotos();
}
async function carregarFotos(){
    try{
        const cat=document.getElementById('filtroCatFoto')?.value||'';
        let q=db.collection('arquivos').orderBy('data','desc');
        if(cat)q=q.where('categoria','==',cat);
        const s=await q.limit(50).get();
        arquivos=[];s.forEach(d=>{const x=d.data();x.fid=d.id;arquivos.push(x);});
        const c=document.getElementById('listaFotos');
        if(!c)return;
        if(arquivos.length===0){c.innerHTML='<div style="text-align:center;padding:40px;">📭 Nenhuma foto</div>';return}
        c.innerHTML=arquivos.map(x=>`<div class="foto-card"><img src="${x.url}" onerror="this.style.display='none'" style="cursor:pointer;" onclick="window.open('${x.url}','_blank')"><div class="foto-info"><strong>${sanitizar(x.categoria||'Geral')}</strong><br><small>${fmtDataCurta(x.data)} • ${sanitizar(x.autor||'—')}</small><br><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();excluirFoto('${x.fid}')">🗑️</button></div></div>`).join('');
    }catch(e){}
}
function abrirUploadFoto(){
    abrirModal(`<div class="modal-header"><h3>📤 Upload de Foto</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="uploadFoto(event)" style="display:grid;gap:10px;"><div class="form-group"><label>Categoria</label><select id="fotoCat"><option value="defeito">🔴 Defeito</option><option value="instalacao">🟢 Instalação</option><option value="servico">🔧 Serviço</option><option value="geral">📷 Geral</option></select></div><div class="form-group"><label>Descrição</label><textarea id="fotoDesc" rows="2"></textarea></div><div class="form-group"><label>Arquivo *</label><input type="file" id="fotoArq" accept="image/*" required style="padding:8px;border:2px dashed var(--border);border-radius:8px;background:var(--bg);"></div><button type="submit" class="btn btn-primary">Enviar</button></form>`);
}
async function uploadFoto(e){
    e.preventDefault();
    const file=document.getElementById('fotoArq')?.files[0];
    if(!file){toast('Selecione','error');return}
    try{
        const nomeArquivo=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.]/g,'_');
        const uploadTask=storage.ref('fotos/'+nomeArquivo).put(file);
        uploadTask.on('state_changed',null,error=>toast('Erro: '+error.message,'error'),async ()=>{
            const url=await uploadTask.snapshot.ref.getDownloadURL();
            await db.collection('arquivos').add({url,categoria:document.getElementById('fotoCat')?.value||'geral',descricao:document.getElementById('fotoDesc')?.value.trim()||'',autor:usuarioLogado.nome,departamento:depto,data:firebase.firestore.Timestamp.now(),nomeArquivo});
            document.querySelector('.modal-overlay')?.remove();carregarFotos();toast('✅ Enviada!','success');
        });
    }catch(e){toast('Erro','error');}
}
async function excluirFoto(id){if(!confirm('Excluir?'))return;try{await db.collection('arquivos').doc(id).delete();carregarFotos();toast('🗑️ Excluída!','success');}catch(e){toast('Erro','error');}}

async function salvarAgenda(e,id){
    e.preventDefault();
    const d={titulo:document.getElementById('agTitulo')?.value.trim(),data:firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('agData')?.value)),local:document.getElementById('agLocal')?.value.trim(),responsavel:document.getElementById('agResp')?.value.trim(),descricao:document.getElementById('agDesc')?.value.trim(),criadoPor:usuarioLogado.nome,departamento:depto};
    if(!d.titulo||!document.getElementById('agData')?.value)return;
    try{if(id)await db.collection('agenda').doc(id).update(d);else await db.collection('agenda').add(d);document.querySelector('.modal-overlay')?.remove();carregarAgenda();toast('✅ Salvo!','success');}catch(e){toast('Erro','error');}
}
async function excluirAgenda(id){if(!confirm('Excluir?'))return;try{await db.collection('agenda').doc(id).delete();carregarAgenda();toast('🗑️ Excluído!','success');}catch(e){toast('Erro','error');}}

// ============================================
// CONFIGURAÇÕES
// ============================================
async function renderConfig(){
    const main=document.getElementById('mainContent');
    await loadConfig();
    main.innerHTML=`<div class="top-bar"><h1>⚙️ Configurações</h1></div><div style="max-width:600px;"><div class="config-section open"><div style="display:flex;justify-content:space-between;align-items:center;" onclick="this.parentElement.classList.toggle('open')"><h3>🔐 Alterar Senha</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><form onsubmit="alterarSenha(event)" style="display:grid;gap:10px;margin-top:10px;"><div class="form-group"><label>Senha Atual *</label><input type="password" id="senhaAtual" required></div><div class="form-group"><label>Nova Senha *</label><input type="password" id="senhaNova" required minlength="6"></div><div class="form-group"><label>Confirmar *</label><input type="password" id="senhaNovaConfirma" required minlength="6"></div><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Alterar</button></form></div></div></div>`;
}
async function alterarSenha(e){
    e.preventDefault();
    const sa=document.getElementById('senhaAtual')?.value,sn=document.getElementById('senhaNova')?.value,sc=document.getElementById('senhaNovaConfirma')?.value;
    if(!sa||!sn||!sc){toast('Preencha todos','error');return}
    if(sn!==sc){toast('Não conferem','error');return}
    if(sn.length<6){toast('Mínimo 6 caracteres','error');return}
    try{
        const us=await db.collection('usuarios').where('usuario','==',usuarioLogado.usuario).get();
        if(us.empty){toast('Usuário não encontrado','error');return}
        if(us.docs[0].data().senha!==sa){toast('Senha incorreta','error');return}
        await us.docs[0].ref.update({senha:sn,primeiro_acesso:false});
        toast('✅ Senha alterada!','success');e.target.reset();
    }catch(e){toast('Erro','error');}
}

// ============================================
// INICIALIZAÇÃO
// ============================================
async function init(){
    if(!checkAuth())return;
    await loadConfig();
    initUI();
}
window.addEventListener('load',init);
if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(init,100);
</script>
