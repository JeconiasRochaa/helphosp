<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestHOSP - Prontuário Eletrônico do Paciente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ========== FUNDO COM GRADE ========== -->
    <div class="bg-grid"></div>

    <!-- ========== EFEITO DE BRILHO ========== -->
    <div class="glow"></div>

    <!-- ========== CONTAINER PRINCIPAL ========== -->
    <div class="login-wrapper">
        
        <!-- BRASÃO / LOGO -->
        <div class="logo-container">
            <img src="img/logo.png" alt="Brasão" class="brasao" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="brasao-fallback" style="display:none;">
                <i class="fas fa-shield-alt"></i>
            </div>
        </div>

        <!-- NOME DO SISTEMA -->
        <div class="system-name">
            <span class="gest">Gest</span><span class="hosp">HOSP</span>
        </div>
        <div class="system-subtitle">PRONTUÁRIO ELETRÔNICO DO PACIENTE</div>
        
        <!-- LINHA DOURADA -->
        <div class="golden-line"></div>
        
        <!-- SLOGAN -->
        <div class="slogan">Sistema de Gestão Hospitalar</div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- CAMPO USUÁRIO -->
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="usuario" placeholder="Usuário" required autocomplete="username">
            </div>

            <!-- CAMPO SENHA -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="senha" placeholder="Senha" required autocomplete="current-password">
                <button type="button" class="toggle-password" onclick="togglePassword()" tabindex="-1">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <!-- OPÇÕES -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="lembrar">
                    <span>Lembrar-me</span>
                </label>
                <a href="#" class="forgot-password">Esqueci minha senha</a>
            </div>

            <!-- BOTÃO ENTRAR -->
            <button type="submit" class="btn-entrar">
                <span>Entrar</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <!-- MENSAGEM DE ERRO -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- MENSAGEM DE SUCESSO -->
            <div class="success-message" id="successMessage"></div>
        </form>

        <!-- CREDENCIAIS DE TESTE -->
        <div class="test-credentials">
            <small>🔑 admin / 123456</small>
        </div>
    </div>

    <!-- ========== LINHA ECG ANIMADA ========== -->
    <div class="ecg-line">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path class="ecg-path" d="M0,60 L100,60 L120,60 L130,10 L140,110 L150,60 L300,60"/>
            <path class="ecg-path ecg-path-2" d="M300,60 L400,60 L420,60 L430,10 L440,110 L450,60 L600,60"/>
            <path class="ecg-path ecg-path-3" d="M600,60 L700,60 L720,60 L730,10 L740,110 L750,60 L900,60"/>
            <path class="ecg-path ecg-path-4" d="M900,60 L1000,60 L1020,60 L1030,10 L1040,110 L1050,60 L1200,60"/>
        </svg>
    </div>

    <!-- ========== SCRIPT ========== -->
    <script src="script.js"></script>
</body>
</html>
