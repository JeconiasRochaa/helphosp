<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Login Técnico</title>
    
    <script>
    // ========== FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
        authDomain: "helphosp.firebaseapp.com",
        projectId: "helphosp",
        storageBucket: "helphosp.firebasestorage.app",
        messagingSenderId: "1075623193163",
        appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ========== INICIALIZAR ADMIN ==========
    function inicializarAdmin() {
        db.collection('usuarios').where('usuario', '==', 'jeconias').get()
            .then(function(snapshot) {
                if (snapshot.empty) {
                    // Criar admin se não existir
                    db.collection('usuarios').add({
                        nome: 'Jeconias Rocha',
                        usuario: 'jeconias',
                        senha: 'Parana2026',
                        cargo: 'Analista de Sistemas',
                        tipo: 'admin',
                        whatsapp: '82981845421',
                        status: 'ativo',
                        primeiro_acesso: false,
                        data_criacao: new Date().toISOString(),
                        ultima_alteracao_senha: new Date().toISOString()
                    }).then(function() {
                        console.log('✅ Admin Jeconias criado!');
                    }).catch(function(error) {
                        console.error('Erro ao criar admin:', error);
                    });
                } else {
                    console.log('✅ Admin Jeconias já existe!');
                }
            })
            .catch(function(error) {
                console.error('Erro ao verificar admin:', error);
            });
    }

    // ========== LOGIN ==========
    function fazerLogin(event) {
        event.preventDefault();
        
        var user = document.getElementById('loginUsuario').value.toLowerCase().trim();
        var senha = document.getElementById('loginSenha').value;
        var errorDiv = document.getElementById('loginError');
        
        console.log('🔍 Tentando login:', user);
        
        // BUSCAR NO FIREBASE
        db.collection('usuarios').where('usuario', '==', user).get()
            .then(function(snapshot) {
                if (snapshot.empty) {
                    console.log('❌ Usuário não encontrado no Firebase');
                    errorDiv.innerHTML = '❌ Usuário não encontrado!<br><small>Verifique o nome de usuário.</small>';
                    errorDiv.classList.add('show');
                    setTimeout(function() { errorDiv.classList.remove('show'); }, 5000);
                    return;
                }
                
                var doc = snapshot.docs[0];
                var usuario = doc.data();
                usuario.id = doc.id;
                
                console.log('✅ Usuário encontrado:', usuario.nome);
                
                // Verificar senha
                if (usuario.senha !== senha) {
                    console.log('❌ Senha incorreta');
                    errorDiv.innerHTML = '❌ Senha incorreta!<br><small>Tente novamente.</small>';
                    errorDiv.classList.add('show');
                    setTimeout(function() { errorDiv.classList.remove('show'); }, 5000);
                    return;
                }
                
                // Verificar status
                if (usuario.status && usuario.status !== 'ativo') {
                    errorDiv.textContent = '❌ Usuário inativo. Contate o administrador.';
                    errorDiv.classList.add('show');
                    setTimeout(function() { errorDiv.classList.remove('show'); }, 5000);
                    return;
                }
                
                // LOGIN COM SUCESSO!
                console.log('✅ Login bem-sucedido!');
                
                localStorage.setItem('usuario_logado', JSON.stringify({
                    id: usuario.id,
                    nome: usuario.nome,
                    usuario: usuario.usuario,
                    cargo: usuario.cargo,
                    tipo: usuario.tipo
                }));
                
                // Verificar primeiro acesso
                if (usuario.primeiro_acesso === true) {
                    console.log('⚠️ Primeiro acesso - redirecionando para trocar senha');
                    window.location.href = 'trocar-senha.html?id=' + usuario.id;
                } else {
                    console.log('➡️ Redirecionando para dashboard');
                    window.location.href = 'dashboard.html';
                }
            })
            .catch(function(error) {
                console.error('❌ Erro no Firebase:', error);
                errorDiv.textContent = '❌ Erro de conexão. Tente novamente.';
                errorDiv.classList.add('show');
                setTimeout(function() { errorDiv.classList.remove('show'); }, 5000);
            });
    }

    // Limpar sessão anterior
    localStorage.removeItem('usuario_logado');
    
    // Inicializar
    inicializarAdmin();
    
    console.log('🚀 Sistema de login pronto!');
</script>
