<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de Chamado</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        button { padding: 20px 40px; font-size: 18px; cursor: pointer; background: #4f46e5; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>🧪 Simular Novo Chamado</h1>
    <button onclick="criarChamadoTeste()">Criar Chamado de Teste</button>
    <script>
        function criarChamadoTeste() {
            var chamados = JSON.parse(localStorage.getItem('db_chamados')) || [];
            chamados.push({
                id: Date.now(),
                protocolo: 'CH-' + new Date().toISOString().replace(/[-:T]/g, '').substring(0, 14),
                solicitante: 'Teste ' + Math.floor(Math.random() * 100),
                setor: ['UTI I', 'Emergencia/Vermelha', 'Farmacia'][Math.floor(Math.random() * 3)],
                categoria: ['Computador', 'Impressora', 'Sistema'][Math.floor(Math.random() * 3)],
                prioridade: ['Baixa', 'Média', 'Alta', 'Crítica'][Math.floor(Math.random() * 4)],
                titulo: 'Chamado teste ' + new Date().toLocaleTimeString(),
                descricao: 'Teste de notificação',
                status: 'A Fazer',
                data_abertura: new Date().toISOString(),
                historico: [{ data: new Date().toISOString(), acao: 'Teste' }]
            });
            localStorage.setItem('db_chamados', JSON.stringify(chamados));
            alert('✅ Chamado criado! Abra o dashboard para ver a notificação.');
        }
    </script>
</body>
</html>
