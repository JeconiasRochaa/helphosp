function renderIPs(){const main=document.getElementById('mainContent');db.collection('ips_rede').orderBy('setor').get().then(snap=>{const ips=[];snap.forEach(d=>{const x=d.data();x.fid=d.id;ips.push(x);});const l=ips.length===0?'<tr><td colspan="8" style="text-align:center;padding:20px;">Nenhum IP cadastrado</td></tr>':ips.map(ip=>`<tr><td><strong>${sanitizar(ip.dispositivo||'—')}</strong></td><td>${sanitizar(ip.tipo||'—')}</td><td><code>${sanitizar(ip.ip||'—')}</code></td><td>${sanitizar(ip.mac||'—')}</td><td>${sanitizar(ip.localizacao||'—')}</td><td>${sanitizar(ip.setor||'—')}</td><td><span class="badge ${ip.status==='Ativo'?'badge-green':'badge-red'}">${sanitizar(ip.status||'Ativo')}</span></td><td><button class="btn btn-sm btn-outline" onclick="editarIP('${ip.fid}')">✏️</button><button class="btn btn-sm btn-danger" onclick="excluirIP('${ip.fid}')">🗑️</button></td></tr>`).join('');main.innerHTML=`<div class="top-bar"><h1>🌐 IPs & Rede</h1><div style="display:flex;gap:6px;"><button class="btn btn-primary btn-sm" onclick="abrirModalIP()"><i class="fas fa-plus"></i> Novo</button><button class="btn btn-outline btn-sm" onclick="gerarRelatorioIPs()"><i class="fas fa-file-pdf"></i> Relatório</button></div></div><div class="filtros-bar"><input type="text" id="filtroIPs" placeholder="🔍 Filtrar por dispositivo, IP ou setor..." onkeyup="filtrarIPsUI()" style="flex:1;"></div><div class="table-card"><table><thead><tr><th>Dispositivo</th><th>Tipo</th><th>IP</th><th>MAC</th><th>Local</th><th>Setor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaIPs">${l}</tbody></table></div>`;});}
function filtrarIPsUI(){const f=(document.getElementById('filtroIPs')?.value||'').toLowerCase();const tb=document.getElementById('tabelaIPs');if(!tb)return;db.collection('ips_rede').orderBy('setor').get().then(snap=>{const ips=[];snap.forEach(d=>{const x=d.data();x.fid=d.id;ips.push(x);});const filtradas=f?ips.filter(ip=>(ip.dispositivo||'').toLowerCase().includes(f)||(ip.ip||'').toLowerCase().includes(f)||(ip.setor||'').toLowerCase().includes(f)):ips;tb.innerHTML=filtradas.length===0?'<tr><td colspan="8" style="text-align:center;">Nenhum encontrado</td></tr>':filtradas.map(ip=>`<tr><td><strong>${sanitizar(ip.dispositivo||'—')}</strong></td><td>${sanitizar(ip.tipo||'—')}</td><td><code>${sanitizar(ip.ip||'—')}</code></td><td>${sanitizar(ip.mac||'—')}</td><td>${sanitizar(ip.localizacao||'—')}</td><td>${sanitizar(ip.setor||'—')}</td><td><span class="badge ${ip.status==='Ativo'?'badge-green':'badge-red'}">${sanitizar(ip.status||'Ativo')}</span></td><td><button class="btn btn-sm btn-outline" onclick="editarIP('${ip.fid}')">✏️</button><button class="btn btn-sm btn-danger" onclick="excluirIP('${ip.fid}')">🗑️</button></td></tr>`).join('');});}
function abrirModalIP(id=null){if(id)db.collection('ips_rede').doc(id).get().then(d=>{if(d.exists)mostrarModalIP(id,d.data());});else mostrarModalIP(null,{});}
function mostrarModalIP(id,ip){const opts=setores.map(s=>`<option value="${s}" ${ip.setor===s?'selected':''}>${s}</option>`).join('');abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'🌐 Novo IP'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarIP(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Dispositivo *</label><input type="text" id="ipDisp" required value="${ip.dispositivo||''}" placeholder="Ex: Computador Recepção"></div><div class="form-group"><label>Tipo</label><select id="ipTipo"><option value="">Selecione...</option>${['💻 Computador','🖨️ Impressora','🖧 Switch','📡 Roteador','📞 Telefone','📷 Câmera','📺 TV','🖥️ Servidor'].map(t=>`<option ${ip.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-row"><div class="form-group"><label>IP *</label><input type="text" id="ipEnd" required value="${ip.ip||''}" placeholder="192.168.0.1"></div><div class="form-group"><label>MAC</label><input type="text" id="ipMAC" value="${ip.mac||''}" placeholder="00:1A:2B:3C:4D:5E"></div></div><div class="form-row"><div class="form-group"><label>Localização</label><input type="text" id="ipLoc" value="${ip.localizacao||''}" placeholder="Sala 101"></div><div class="form-group"><label>Setor *</label><select id="ipSetor" required><option value="">Selecione...</option>${opts}</select></div></div><div class="form-row"><div class="form-group"><label>Status</label><select id="ipStatus"><option value="Ativo" ${ip.status==='Ativo'?'selected':''}>🟢 Ativo</option><option value="Inativo" ${ip.status==='Inativo'?'selected':''}>🔴 Inativo</option><option value="Reservado" ${ip.status==='Reservado'?'selected':''}>🟡 Reservado</option></select></div><div class="form-group"><label>Observação</label><input type="text" id="ipObs" value="${ip.observacao||''}"></div></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button></div></form>`);}
async function salvarIP(e,id){e.preventDefault();const d={dispositivo:document.getElementById('ipDisp')?.value.trim(),tipo:document.getElementById('ipTipo')?.value,ip:document.getElementById('ipEnd')?.value.trim(),mac:document.getElementById('ipMAC')?.value.trim(),localizacao:document.getElementById('ipLoc')?.value.trim(),setor:document.getElementById('ipSetor')?.value,status:document.getElementById('ipStatus')?.value||'Ativo',observacao:document.getElementById('ipObs')?.value.trim()||''};if(!d.dispositivo||!d.ip||!d.setor){toast('Preencha obrigatórios','error');return}try{if(id)await db.collection('ips_rede').doc(id).update(d);else await db.collection('ips_rede').add(d);document.querySelector('.modal-overlay')?.remove();renderIPs();toast('✅ Salvo!','success');}catch(e){toast('Erro','error');}}
function editarIP(id){abrirModalIP(id);}
async function excluirIP(id){if(!confirm('Excluir?'))return;try{await db.collection('ips_rede').doc(id).delete();renderIPs();toast('🗑️ Excluído!','success');}catch(e){toast('Erro','error');}}
async function gerarRelatorioIPs(){try{toast('📄 Gerando relatório de IPs...','info');const snap=await db.collection('ips_rede').orderBy('setor').get();const ips=[];snap.forEach(d=>{const x=d.data();ips.push(x);});const el=document.createElement('div');el.style.cssText='padding:30px;background:#fff;width:1100px;position:absolute;left:-9999px;font-family:Arial;';let logosHTML='';if(logoHospital||logoGoverno){logosHTML=`<div style="display:flex;justify-content:center;gap:40px;margin-bottom:20px;">${logoHospital?`<img src="${logoHospital}" style="max-height:50px;">`:''}${logoGoverno?`<img src="${logoGoverno}" style="max-height:50px;">`:''}</div>`;}el.innerHTML=`${logosHTML}<h1>Relatório de IPs & Rede</h1><p>Total: ${ips.length} dispositivos | ${new Date().toLocaleDateString('pt-BR')}</p><table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:16px;"><thead><tr style="background:#06224a;color:white;"><th>Dispositivo</th><th>Tipo</th><th>IP</th><th>MAC</th><th>Local</th><th>Setor</th><th>Status</th></tr></thead><tbody>${ips.map(ip=>`<tr><td>${ip.dispositivo||'—'}</td><td>${ip.tipo||'—'}</td><td>${ip.ip||'—'}</td><td>${ip.mac||'—'}</td><td>${ip.localizacao||'—'}</td><td>${ip.setor||'—'}</td><td>${ip.status||'Ativo'}</td></tr>`).join('')}</tbody></table>`;document.body.appendChild(el);const cv=await html2canvas(el,{scale:2,useCORS:true});document.body.removeChild(el);const{jsPDF}=window.jspdf;const pdf=new jsPDF('l','mm','a4');const iw=277,ih=(cv.height*iw)/cv.width;pdf.addImage(cv.toDataURL('image/png'),'PNG',5,5,iw,ih);pdf.save('relatorio-ips.pdf');toast('✅ Relatório de IPs gerado!','success');}catch(e){console.error(e);toast('Erro','error');}}

function renderEquipe(){const main=document.getElementById('mainContent');const p=getPerms();if(!p.podeEquipe){main.innerHTML=`<div class="top-bar"><h1>👥 Equipe</h1></div><p style="text-align:center;padding:40px;">🔒 Acesso restrito</p>`;return;}db.collection('usuarios').where('departamento','==',depto).get().then(snap=>{let l='';snap.forEach(d=>{const u=d.data();l+=`<tr><td><strong>${sanitizar(u.nome||'')}</strong></td><td>@${sanitizar(u.usuario||'')}</td><td>${sanitizar(u.cargo||'')}</td><td>${sanitizar(u.whatsapp||'—')}</td><td><span class="badge ${u.mostrarContato!==false?'badge-green':'badge-amber'}">${u.mostrarContato!==false?'Visível':'Oculto'}</span></td><td>${u.usuario!==usuarioLogado.usuario?`<button class="btn btn-sm btn-outline" onclick="editarTecnico('${d.id}')">✏️</button><button class="btn btn-sm btn-danger" onclick="removerTecnico('${d.id}')">🗑️</button>`:'<span class="badge badge-amber">Você</span>'}</td></tr>`;});if(!l)l='<tr><td colspan="6" style="text-align:center;">Nenhum</td></tr>';main.innerHTML=`<div class="top-bar"><h1>👥 Equipe — ${sanitizar(nomeDepto)}</h1><button class="btn btn-primary btn-sm" onclick="abrirModalTecnico()"><i class="fas fa-plus"></i> Novo</button></div><div class="table-card"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Cargo</th><th>WhatsApp</th><th>Contato</th><th>Ações</th></tr></thead><tbody>${l}</tbody></table></div>`;});}
function abrirModalTecnico(id=null){if(id)db.collection('usuarios').doc(id).get().then(d=>{if(d.exists)mostrarModalTecnico(id,d.data());});else mostrarModalTecnico(null,{});}
function mostrarModalTecnico(id,u){const cargos=depto==='TI'?['Técnico de Suporte TI','Analista de Sistemas','Analista de Redes','Técnico de Informática','Coordenador de TI']:['Supervisor de Manutenção','Técnico de Manutenção','Eletricista','Encanador','Técnico de Refrigeração','Pedreiro','Pintor','Marceneiro','Auxiliar de Manutenção'];abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'👤 Novo Técnico'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarTecnico(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Nome *</label><input type="text" id="tecNome" required value="${u.nome||''}"></div><div class="form-group"><label>Usuário *</label><input type="text" id="tecUsuario" required value="${u.usuario||''}" ${id?'readonly':''}></div><div class="form-group"><label>Cargo *</label><select id="tecCargo">${cargos.map(c=>`<option ${u.cargo===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-group"><label>WhatsApp *</label><input type="text" id="tecWhatsApp" required value="${u.whatsapp||''}"></div><div class="form-group"><label>Mostrar no portal?</label><select id="tecMostrar"><option value="true" ${u.mostrarContato!==false?'selected':''}>✅ Sim</option><option value="false" ${u.mostrarContato===false?'selected':''}>❌ Não</option></select></div>${!id?'<p style="font-size:10px;">🔑 Senha inicial: 12345</p>':''}<div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button></div></form>`);}
async function salvarTecnico(e,id){e.preventDefault();const n=document.getElementById('tecNome')?.value.trim(),u=document.getElementById('tecUsuario')?.value.toLowerCase().trim(),w=document.getElementById('tecWhatsApp')?.value.trim(),c=document.getElementById('tecCargo')?.value,m=document.getElementById('tecMostrar')?.value==='true';if(!n||!u||!w||!c){toast('Preencha todos','error');return}try{if(id){await db.collection('usuarios').doc(id).update({nome:n,cargo:c,whatsapp:w,mostrarContato:m});}else{const ex=await db.collection('usuarios').where('usuario','==',u).get();if(!ex.empty){toast('Usuário já existe','error');return}await db.collection('usuarios').add({nome:n,usuario:u,senha:'12345',cargo:c,tipo:'tecnico',whatsapp:w,mostrarContato:m,status:'ativo',primeiro_acesso:true,departamento:depto});}document.querySelector('.modal-overlay')?.remove();renderEquipe();toast('✅ Salvo!','success');}catch(e){toast('Erro','error');}}
function editarTecnico(id){abrirModalTecnico(id);}
async function removerTecnico(id){if(!confirm('Remover?'))return;try{await db.collection('usuarios').doc(id).delete();renderEquipe();toast('🗑️ Removido!','success');}catch(e){toast('Erro','error');}}

function renderArquivos(){const main=document.getElementById('mainContent');main.innerHTML=`<div class="top-bar"><h1>📁 Arquivos e Fotos</h1><button class="btn btn-primary btn-sm" onclick="abrirUploadFoto()"><i class="fas fa-upload"></i> Upload de Foto</button></div><div class="filtros-bar"><select id="filtroCatFoto" onchange="carregarFotos()"><option value="">Todas</option><option value="defeito">🔴 Defeito</option><option value="instalacao">🟢 Instalação</option><option value="servico">🔧 Serviço</option><option value="geral">📷 Geral</option></select></div><div class="foto-grid" id="listaFotos">Carregando...</div>`;carregarFotos();}
async function carregarFotos(){try{const cat=document.getElementById('filtroCatFoto')?.value||'';let q=db.collection('arquivos').orderBy('data','desc');if(cat)q=q.where('categoria','==',cat);const s=await q.limit(50).get();const f=[];s.forEach(d=>{const x=d.data();x.fid=d.id;f.push(x);});const c=document.getElementById('listaFotos');if(!c)return;if(f.length===0){c.innerHTML='<div style="text-align:center;padding:40px;">📭 Nenhuma foto</div>';return;}c.innerHTML=f.map(x=>`<div class="foto-card"><img src="${x.url}" onerror="this.style.display='none'" style="cursor:pointer;" onclick="window.open('${x.url}','_blank')"><div class="foto-info"><strong>${sanitizar(x.categoria||'Geral')}</strong><br><small>${fmtDataCurta(x.data)} • ${sanitizar(x.autor||'—')}</small>${x.descricao?`<br>${sanitizar(x.descricao)}`:''}<br><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();excluirFoto('${x.fid}')">🗑️</button></div></div>`).join('');}catch(e){}}
function abrirUploadFoto(){abrirModal(`<div class="modal-header"><h3>📤 Upload de Foto</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="uploadFoto(event)" style="display:grid;gap:10px;"><div class="form-group"><label>Categoria</label><select id="fotoCat"><option value="defeito">🔴 Defeito</option><option value="instalacao">🟢 Instalação</option><option value="servico">🔧 Serviço</option><option value="geral">📷 Geral</option></select></div><div class="form-group"><label>Descrição</label><textarea id="fotoDesc" rows="2"></textarea></div><div class="form-group"><label>Selecionar Arquivo *</label><input type="file" id="fotoArq" accept="image/*" required style="padding:8px;border:2px dashed var(--border);border-radius:8px;background:var(--bg);"></div><div id="previewFoto" style="display:none;text-align:center;"><img id="previewImg" style="max-width:200px;max-height:200px;border-radius:8px;"></div><div id="progressoUpload" style="display:none;"><div style="background:#E2E8F0;border-radius:10px;height:8px;overflow:hidden;"><div id="barraProgresso" style="background:var(--success);height:100%;width:0%;transition:width 0.3s;"></div></div></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary" id="btnUpload">Enviar</button></div></form>`);setTimeout(()=>{const input=document.getElementById('fotoArq');if(input){input.addEventListener('change',function(){const file=this.files[0];if(file){if(file.size>5*1024*1024){toast('Arquivo muito grande (máx 5MB)','error');this.value='';return;}const reader=new FileReader();reader.onload=function(e){document.getElementById('previewFoto').style.display='block';document.getElementById('previewImg').src=e.target.result;};reader.readAsDataURL(file);}});}},300);}
async function uploadFoto(e){e.preventDefault();const file=document.getElementById('fotoArq')?.files[0];if(!file){toast('Selecione um arquivo','error');return;}if(!file.type.startsWith('image/')){toast('Apenas imagens','error');return;}const btn=document.getElementById('btnUpload');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Enviando...';document.getElementById('progressoUpload').style.display='block';try{const nomeArquivo=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.]/g,'_');const uploadTask=storage.ref('fotos/'+nomeArquivo).put(file);uploadTask.on('state_changed',(snapshot)=>{const progress=(snapshot.bytesTransferred/snapshot.totalBytes)*100;document.getElementById('barraProgresso').style.width=progress+'%';},(error)=>{toast('Erro: '+error.message,'error');btn.disabled=false;btn.innerHTML='Enviar';},async ()=>{const url=await uploadTask.snapshot.ref.getDownloadURL();await db.collection('arquivos').add({url,categoria:document.getElementById('fotoCat')?.value||'geral',descricao:document.getElementById('fotoDesc')?.value.trim()||'',autor:usuarioLogado.nome,departamento:depto,data:firebase.firestore.Timestamp.now(),nomeArquivo});document.querySelector('.modal-overlay')?.remove();carregarFotos();toast('✅ Foto enviada!','success');});}catch(e){toast('Erro','error');btn.disabled=false;btn.innerHTML='Enviar';}}
async function excluirFoto(id){if(!confirm('Excluir?'))return;try{await db.collection('arquivos').doc(id).delete();carregarFotos();toast('🗑️ Excluída!','success');}catch(e){toast('Erro','error');}}

function renderAgenda(){const main=document.getElementById('mainContent');main.innerHTML=`<div class="top-bar"><h1>📅 Agenda</h1><button class="btn btn-primary btn-sm" onclick="abrirModalAgenda()"><i class="fas fa-plus"></i> Agendar</button></div><div id="listaAgenda">Carregando...</div>`;carregarAgenda();}
async function carregarAgenda(){try{const s=await db.collection('agenda').orderBy('data','asc').get();const i=[];s.forEach(d=>{const x=d.data();x.fid=d.id;i.push(x);});const c=document.getElementById('listaAgenda');if(c)c.innerHTML=i.length===0?'<p style="text-align:center;padding:40px;">📭 Nenhum</p>':i.map(a=>{const d=toDate(a.data);return`<div class="agenda-item"><div><strong>${sanitizar(a.titulo||'—')}</strong><div>📅 ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div><div>📍 ${sanitizar(a.local||'—')} | 👤 ${sanitizar(a.responsavel||'—')}</div>${a.descricao?`<p>${sanitizar(a.descricao)}</p>`:''}</div><button class="btn btn-sm btn-danger" onclick="excluirAgenda('${a.fid}')">🗑️</button></div>`;}).join('');}catch(e){}}
function abrirModalAgenda(id=null){if(id)db.collection('agenda').doc(id).get().then(d=>{if(d.exists)mostrarModalAgenda(id,d.data());});else mostrarModalAgenda(null,{});}
function mostrarModalAgenda(id,d){const ds=d.data?toDate(d.data).toISOString().slice(0,16):'';abrirModal(`<div class="modal-header"><h3>${id?'✏️ Editar':'📅 Agendar'}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div><form onsubmit="salvarAgenda(event,'${id||''}')" style="display:grid;gap:8px;"><div class="form-group"><label>Título *</label><input type="text" id="agTitulo" required value="${d.titulo||''}"></div><div class="form-row"><div class="form-group"><label>Data/Hora *</label><input type="datetime-local" id="agData" required value="${ds}"></div><div class="form-group"><label>Local</label><input type="text" id="agLocal" value="${d.local||''}"></div></div><div class="form-group"><label>Responsável</label><input type="text" id="agResp" value="${d.responsavel||usuarioLogado.nome}"></div><div class="form-group"><label>Descrição</label><textarea id="agDesc" rows="2">${d.descricao||''}</textarea></div><div style="display:flex;gap:6px;"><button type="submit" class="btn btn-primary">Salvar</button></div></form>`);}
async function salvarAgenda(e,id){e.preventDefault();const d={titulo:document.getElementById('agTitulo')?.value.trim(),data:firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('agData')?.value)),local:document.getElementById('agLocal')?.value.trim(),responsavel:document.getElementById('agResp')?.value.trim(),descricao:document.getElementById('agDesc')?.value.trim(),criadoPor:usuarioLogado.nome,departamento:depto};if(!d.titulo||!document.getElementById('agData')?.value)return;try{if(id)await db.collection('agenda').doc(id).update(d);else await db.collection('agenda').add(d);document.querySelector('.modal-overlay')?.remove();carregarAgenda();toast('✅ Salvo!','success');}catch(e){toast('Erro','error');}}
async function excluirAgenda(id){if(!confirm('Excluir?'))return;try{await db.collection('agenda').doc(id).delete();carregarAgenda();toast('🗑️ Excluído!','success');}catch(e){toast('Erro','error');}}

// CONFIGURAÇÕES (COM UPLOAD DE LOGOS)
// ============================================
async function renderConfig(){const main=document.getElementById('mainContent');await loadConfig();const sl=setores.map((s,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);"><span>📍 ${sanitizar(s)}</span><button class="btn btn-sm btn-danger" onclick="removerSetor(${i})">🗑️</button></div>`).join('');const dl=departamentosChamados.map((d,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);"><span>📋 ${sanitizar(d)}</span><button class="btn btn-sm btn-danger" onclick="removerDepto(${i})">🗑️</button></div>`).join('');main.innerHTML=`<div class="top-bar"><h1>⚙️ Configurações</h1></div><div style="max-width:700px;"><div class="config-section open"><div style="display:flex;justify-content:space-between;align-items:center;" onclick="this.parentElement.classList.toggle('open')"><h3>🔐 Alterar Senha</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><form onsubmit="alterarSenha(event)" style="display:grid;gap:10px;margin-top:10px;"><div class="form-group"><label>Senha Atual *</label><input type="password" id="senhaAtual" required></div><div class="form-group"><label>Nova Senha *</label><input type="password" id="senhaNova" required minlength="6"></div><div class="form-group"><label>Confirmar *</label><input type="password" id="senhaNovaConfirma" required minlength="6"></div><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Alterar Senha</button></form></div></div><div class="config-section open"><div style="display:flex;justify-content:space-between;align-items:center;" onclick="this.parentElement.classList.toggle('open')"><h3>🖼️ Logos para Relatórios</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><div class="form-row"><div class="form-group"><label>Logo do Hospital</label>${logoHospital?`<img src="${logoHospital}" style="max-height:40px;display:block;margin:5px 0;">`:''}<input type="file" id="logoHospitalFile" accept="image/*"></div><div class="form-group"><label>Logo do Governo</label>${logoGoverno?`<img src="${logoGoverno}" style="max-height:40px;display:block;margin:5px 0;">`:''}<input type="file" id="logoGovernoFile" accept="image/*"></div></div><button class="btn btn-primary btn-sm" onclick="salvarLogos()"><i class="fas fa-save"></i> Salvar Logos</button></div></div><div class="config-section open"><div style="display:flex;justify-content:space-between;align-items:center;" onclick="this.parentElement.classList.toggle('open')"><h3>🏥 Setores (${setores.length})</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><div class="filtros-bar" style="margin:10px 0;"><input type="text" id="novoSetor" placeholder="Nome do novo setor..." style="flex:1;"><button class="btn btn-primary btn-sm" onclick="adicionarSetor()"><i class="fas fa-plus"></i> Adicionar</button></div><div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">${sl}</div></div></div><div class="config-section open"><div style="display:flex;justify-content:space-between;align-items:center;" onclick="this.parentElement.classList.toggle('open')"><h3>📋 Departamentos</h3><i class="fas fa-chevron-down"></i></div><div class="config-body"><div class="filtros-bar" style="margin:10px 0;"><input type="text" id="novoDepto" placeholder="Nome do departamento..." style="flex:1;"><button class="btn btn-primary btn-sm" onclick="adicionarDepto()"><i class="fas fa-plus"></i> Adicionar</button></div><div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">${dl}</div></div></div></div>`;}
async function salvarLogos(){const hf=document.getElementById('logoHospitalFile')?.files[0];const gf=document.getElementById('logoGovernoFile')?.files[0];const updates={};try{if(hf){const ref=storage.ref('logos/hospital_'+Date.now());await ref.put(hf);updates.hospital=await ref.getDownloadURL();}if(gf){const ref=storage.ref('logos/governo_'+Date.now());await ref.put(gf);updates.governo=await ref.getDownloadURL();}if(Object.keys(updates).length>0){await db.collection('configuracoes').doc('logos').set(updates,{merge:true});if(updates.hospital)logoHospital=updates.hospital;if(updates.governo)logoGoverno=updates.governo;toast('✅ Logos salvos!','success');renderConfig();}}catch(e){toast('Erro ao salvar logos','error');}}
async function adicionarSetor(){const i=document.getElementById('novoSetor');const n=i?.value.trim();if(!n){toast('Digite um nome','error');return;}if(setores.includes(n)){toast('Já existe','error');return;}setores.push(n);setores.sort();try{await db.collection('configuracoes').doc('setores').set({setores});i.value='';renderConfig();toast('✅ Adicionado!','success');}catch(e){toast('Erro','error');}}
async function removerSetor(i){if(!confirm('Remover?'))return;setores.splice(i,1);try{await db.collection('configuracoes').doc('setores').set({setores});renderConfig();toast('🗑️ Removido!','success');}catch(e){toast('Erro','error');}}
async function adicionarDepto(){const i=document.getElementById('novoDepto');const n=i?.value.trim().toUpperCase();if(!n){toast('Digite um nome','error');return;}if(departamentosChamados.includes(n)){toast('Já existe','error');return;}departamentosChamados.push(n);try{await db.collection('configuracoes').doc('departamentos_chamados').set({departamentos:departamentosChamados});i.value='';renderConfig();toast('✅ Adicionado!','success');}catch(e){toast('Erro','error');}}
async function removerDepto(i){if(!confirm('Remover?'))return;departamentosChamados.splice(i,1);try{await db.collection('configuracoes').doc('departamentos_chamados').set({departamentos:departamentosChamados});renderConfig();toast('🗑️ Removido!','success');}catch(e){toast('Erro','error');}}
async function alterarSenha(e){e.preventDefault();const sa=document.getElementById('senhaAtual')?.value,sn=document.getElementById('senhaNova')?.value,sc=document.getElementById('senhaNovaConfirma')?.value;if(!sa||!sn||!sc){toast('Preencha todos','error');return;}if(sn!==sc){toast('Não conferem','error');return;}if(sn.length<6){toast('Mínimo 6 caracteres','error');return;}try{const us=await db.collection('usuarios').where('usuario','==',usuarioLogado.usuario).get();if(us.empty){toast('Usuário não encontrado','error');return;}if(us.docs[0].data().senha!==sa){toast('Senha incorreta','error');return;}await us.docs[0].ref.update({senha:sn,primeiro_acesso:false});toast('✅ Senha alterada!','success');e.target.reset();}catch(e){toast('Erro','error');}}

// ============================================
// INICIALIZAÇÃO
// ============================================
async function init(){console.log('🚀 HelpHosp Premium iniciando...');if(!checkAuth())return;console.log('✅ Autenticado:',usuarioLogado.nome,'-',depto);await loadConfig();console.log('✅ Configurações carregadas. Setores:',setores.length);initUI();if(Notification.permission==='default')Notification.requestPermission();}
window.addEventListener('load',init);if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(init,100);
</script>
</body>
</html>
