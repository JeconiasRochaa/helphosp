        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function fmtData(d) {
            if (!d) return '—';
            try {
                const dt = d?.toDate ? d.toDate() : new Date(d);
                if (isNaN(dt.getTime())) return '—';
                return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            } catch (e) {
                return '—';
            }
        }

        function fmtDataCurta(d) {
            if (!d) return '—';
            try {
                const dt = d?.toDate ? d.toDate() : new Date(d);
                if (isNaN(dt.getTime())) return '—';
                const agora = new Date();
                const diff = Math.floor((agora - dt) / 1000);
                if (diff < 60) return 'agora';
                if (diff < 3600) return Math.floor(diff / 60) + 'min';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h';
                return Math.floor(diff / 86400) + 'd';
            } catch (e) {
                return '—';
            }
        }

        function toDate(d) {
            if (!d) return new Date(0);
            return d?.toDate ? d.toDate() : new Date(d);
        }

        function genProtocolo(prefixo = 'CH') {
            const timestamp = Date.now().toString(36).toUpperCase();
            const random = Math.random().toString(36).substring(2, 5).toUpperCase();
            return `${prefixo}-${timestamp}${random}`;
        }

        function toast(mensagem, tipo = 'info') {
            const icons = {
                success: 'check-circle',
                error: 'exclamation-circle',
                info: 'info-circle'
            };
            
            const el = document.createElement('div');
            el.className = `toast ${tipo}`;
            el.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;">
                    <i class="fas fa-${icons[tipo] || icons.info}" style="font-size:18px;"></i>
                    ${mensagem}
                </div>
            `;
            document.body.appendChild(el);
            
            setTimeout(() => {
                if (el.parentElement) {
                    el.remove();
                }
            }, 3500);
        }

        function sugereEmoji(nome) {
            if (!nome) return '📦';
            
            const mapaEmojis = {
                'computador': '💻', 'notebook': '💻', 'pc': '💻',
                'impressora': '🖨️', 'monitor': '🖥️', 'telefone': '📞',

                'nobreak': '🔋', 'tablet': '📱', 'projetor': '🖼️'
            };
            
            const nomeLower = nome.toLowerCase();
            for (const [chave, emoji] of Object.entries(mapaEmojis)) {
                if (nomeLower.includes(chave)) return emoji;
            }
            
            return '📦';
        }

                window.location.href = 'admin.html';
                return false;

        function criarNavItem(secao, icone, texto, ativo = false, badgeId = null) {
            const badge = badgeId ? 
                `<span class="badge-notify" id="${badgeId}" style="margin-left:auto;">0</span>` : 
                '';
            
            return `
                <div class="nav-item${ativo ? ' active' : ''}" 
                     data-secao="${secao}" 
                     onclick="navegar('${secao}', this)">
                    <i class="fas fa-${icone}"></i>
                    <span>${texto}</span>
                    ${badge}
                </div>
            `;
        }

        function navegar(secao, elemento) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            if (elemento) {
                elemento.classList.add('active');
            }
            
            document.querySelectorAll('.secao').forEach(s => {
                s.classList.remove('ativa');
            });
            
            const secaoElement = document.getElementById(`secao-${secao}`);
            if (secaoElement) {
                secaoElement.classList.add('ativa');
            }
            
            if (window.innerWidth < 1025) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.classList.remove('open');
            }
            
            switch (secao) {
                case 'dashboard':
                    atualizarDashboard();
                    break;
                case 'chamados':
                    filtrarChamados();
                    break;
                case 'gesthosp':
                    carregarGestHosp();
                    // Limpar badge do GestHosp quando acessar a seção
                    idsGestHospNotificados.clear();
                    salvarIdsGestHospNotificados();
                    atualizarBadges();
                    break;
                case 'indicadores':
                    atualizarPeriodosIndicadores();
                    break;
                case 'toners':
                    carregarToners();
                    break;
                case 'estoque':
                    carregarEstoque();
                    break;
                case 'inventario':
                    carregarInventario();
                    break;
                case 'ips':
                    carregarIPs();
                    break;
                case 'equipe':
                    carregarEquipe();
                    break;
            }
        }

        // ============================================
        function filtraDepto(lista) {
            const perms = getPerms();
            if (perms.isAdmin) return lista;
            return lista.filter(c => (c.departamento || 'TI') === depto);
        }

        async function carregarChamados() {
            try {
                const snapshot = await db.collection('chamados')
                    .orderBy('data_abertura', 'desc')
                    .get();
                
                const todos = [];
                snapshot.forEach(doc => {
                    const dados = doc.data();
                    dados.fid = doc.id;
                    todos.push(dados);
                });
                
                chamados = filtraDepto(todos);
                chamadosFiltrados = [...chamados];
            } catch (error) {
                console.error('Erro ao carregar chamados:', error);
                toast('Erro ao carregar chamados', 'error');
            }
        }

        function escutarChamados() {
            db.collection('chamados')
                .orderBy('data_abertura', 'desc')
                .onSnapshot(snapshot => {
                    const perms = getPerms();
                    
                    snapshot.docChanges().forEach(change => {
                        const doc = change.doc;
                        const dados = doc.data();
                        dados.fid = doc.id;
                        
                        const depChamado = dados.departamento || 'TI';
                        const meuDepto = perms.isAdmin || depChamado === depto;
                        
                        // Notificação para chamados normais
                        if (change.type === 'added' && meuDepto && 
                            dados.status !== 'Concluído' && 
                            dados.tipo !== 'gesthosp' &&
                            !idsNotificados.has(doc.id)) {
                            notificarNovoChamado(dados);
                            idsNotificados.add(doc.id);
                            salvarIdsNotificados();
                        }
                        
                        // Notificação especial para GestHosp
                        if (change.type === 'added' && meuDepto && 
                            dados.tipo === 'gesthosp' &&
                            !idsGestHospNotificados.has(doc.id)) {
                            notificarGestHosp(dados);
                            idsGestHospNotificados.add(doc.id);
                            salvarIdsGestHospNotificados();
                        }
                        
                        if (change.type === 'modified' && dados.status === 'Concluído') {
                            idsNotificados.delete(doc.id);
                            salvarIdsNotificados();
                        }
                    });
                    
                    const todos = snapshot.docs.map(doc => {
                        const dados = doc.data();
                        dados.fid = doc.id;
                        return dados;
                    });
                    
                    chamados = filtraDepto(todos);
                    
                    const statusFiltro = document.getElementById('filtroStatus')?.value || '';
                    const prioridadeFiltro = document.getElementById('filtroPrioridade')?.value || '';
                    const buscaFiltro = (document.getElementById('filtroBusca')?.value || '').toLowerCase();
                    
                    chamadosFiltrados = chamados.filter(c => c.tipo !== 'gesthosp');
                    
                    if (statusFiltro) {
                        chamadosFiltrados = chamadosFiltrados.filter(c => c.status === statusFiltro);
                    }
                    if (prioridadeFiltro) {
                        chamadosFiltrados = chamadosFiltrados.filter(c => c.prioridade === prioridadeFiltro);
                    }
                    if (buscaFiltro) {
                        chamadosFiltrados = chamadosFiltrados.filter(c =>

                return;
            }
            
            const gestHospChamados = chamados.filter(c => c.tipo === 'gesthosp');
            const tabela = document.getElementById('tabelaGestHosp');
            if (!tabela) return;
            
            if (gestHospChamados.length === 0) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted" style="padding:24px;">
                            📭 Nenhum chamado GestHosp
                        </td>
                    </tr>
                `;
                return;
            }
            
            tabela.innerHTML = gestHospChamados.map(c => {
                let dados = {};
                try {
                    if (c.descricao) dados = JSON.parse(c.descricao);
                } catch (e) {}
                
                const statusClass = c.status === 'Concluído' ? 'badge-green' : 'badge-blue';
                
                return `
                    <tr onclick="verDetalhesChamado('${c.fid}')" style="cursor:pointer;">
                        <td><strong>${sanitizarHTML(c.protocolo || '—')}</strong></td>
                        <td>${fmtDataCurta(c.data_abertura)}</td>
                        <td>
                            <strong>${sanitizarHTML(dados.nome || 'Não informado')}</strong>
                            ${dados.cargo ? `<br><small style="color:#A0AEC0;">${sanitizarHTML(dados.cargo)}</small>` : ''}
                        </td>
                        <td>${sanitizarHTML(dados.cpf || '—')}</td>
                        <td><span class="badge ${statusClass}">${sanitizarHTML(c.status || '—')}</span></td>
                        <td onclick="event.stopPropagation();">
                            <button class="btn btn-sm btn-primary" onclick="avancarStatus('${c.fid}')">
                                ▶
                            </button>
                            <button class="btn btn-sm btn-outline" onclick="abrirComentarios('${c.fid}')">
                                💬
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // [MANTER TODAS AS OUTRAS FUNÇÕES IGUAIS AO CÓDIGO ANTERIOR...]
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        async function inicializar() {
            if (!checkAuth()) return;
            
            showLoading();
            
            try {
                await loadConfig();
                initUI();
                await carregarChamados();
                escutarChamados();
                
                const perms = getPerms();
                if (perms.isTI || perms.isAdmin) {
                    await Promise.all([
                        carregarEstoque(),
                        carregarInventario(),
                        carregarIPs()
                    ]);
                    
                    db.collection('movimentacoes')
                        .orderBy('data', 'desc')
                        .limit(200)
                        .get()
                        .then(snapshot => {
                            movimentacoes = [];
                            snapshot.forEach(doc => {
                                const dados = doc.data();
                                dados.fid = doc.id;
                                movimentacoes.push(dados);
                            });
                        })
                        .catch(console.error);
                }
                
                if (perms.podeEquipe) {
                    await carregarEquipe();
                }
                
                if (Notification.permission === 'default') {
                    Notification.requestPermission();
                }
                
                atualizarDashboard();
                atualizarBadges(); // Atualizar badges na inicialização
                
            } catch (error) {
                console.error('Erro na inicialização:', error);
                toast('Erro ao inicializar o sistema', 'error');
            } finally {
                hideLoading();
            }
        }

        // ============================================
        // EVENT LISTENERS GLOBAIS
        // ============================================
        window.addEventListener('load', inicializar);

        window.addEventListener('click', (event) => {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('ativa');
                document.body.style.overflow = '';
            }
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.ativa').forEach(modal => {
                    modal.classList.remove('ativa');
                });
                document.body.style.overflow = '';
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1025) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.classList.remove('open');
            }
        });

        window.addEventListener('beforeunload', () => {
            try {
                const idsArray = [...idsNotificados].slice(-200);
                localStorage.setItem('ids_not_' + depto, JSON.stringify(idsArray));
                
                const idsGestHospArray = [...idsGestHospNotificados].slice(-200);
                localStorage.setItem('ids_gesthosp_not_' + depto, JSON.stringify(idsGestHospArray));
            } catch (error) {}
        });
    </script>
</body>
</html>
