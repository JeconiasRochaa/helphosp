<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #fef3c7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: white; border-radius: 18px; padding: 35px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .box h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { font-weight: 600; font-size: 12px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .btn { width: 100%; padding: 14px; background: #f59e0b; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>🔐 Primeiro Acesso</h2>
    <p style="margin-bottom:18px;color:#666;">Crie sua senha pessoal</p>
    <form onsubmit="trocar(event)">
        <input type="hidden" id="uid">
        <div class="form-group"><label>Nova Senha</label><input type="password" id="s1" required minlength="8"></div>
        <div class="form-group"><label>Confirmar</label><input type="password" id="s2" required></div>
        <button type="submit" class="btn">Salvar</button>
    </form>
</div>
<script>
const fc = { apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE", authDomain: "helphosp.firebaseapp.com", projectId: "helphosp", storageBucket: "helphosp.firebasestorage.app", messagingSenderId: "1075623193163", appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce" };
firebase.initializeApp(fc); const db = firebase.firestore();
var id = new URLSearchParams(window.location.search).get('id');
document.getElementById('uid').value = id;
function trocar(e) {
    e.preventDefault();
    var s1 = document.getElementById('s1').value, s2 = document.getElementById('s2').value;
    if (s1 !== s2) { alert('Senhas não conferem!'); return; }
    if (s1.length < 8) { alert('Mínimo 8 caracteres!'); return; }
    db.collection('usuarios').doc(id).update({ senha: s1, primeiro_acesso: false }).then(function() {
        alert('Senha alterada!');
        window.location.href = 'admin.html';
    });
}
</script>
</body>
</html>
