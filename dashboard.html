<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHosp - Painel Técnico</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --primary-dark: #3730a3; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --dark: #0f172a; --gray: #64748b; --light: #f8fafc; --white: #ffffff; --sidebar-width: 250px; --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: var(--dark); display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: linear-gradient(180deg, #0f172a, #1e293b); color: white; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #818cf8); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .sidebar-title h2 { font-size: 17px; font-weight: 600; } .sidebar-title span { font-size: 10px; color: #94a3b8; }
        .sidebar-nav { flex: 1; padding: 20px 15px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-nav a { color: #94a3b8; text-decoration: none; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
        .sidebar-nav a:hover { background: rgba(255,255,255,0.08); color: white; }
        .sidebar-nav a.ativo { background: var(--primary); color: white; }
        .sidebar-footer { padding: 20px 25px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
        .user-info h4 { font-size: 13px; } .user-info span { font-size: 10px; color: #94a3b8; }
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 30px; }
        .secao { display: none; } .secao.ativa { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; } .btn-outline { background: white; border: 2px solid #e2e8f0; }
        .btn-danger { background: var(--danger); color: white; } .btn-sm { padding: 6px 14px; font-size: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: var(--radius); padding: 22px; display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow); }
        .stat-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .stat-icon.azul { background: #eef2ff; color: var(--primary); } .stat-icon.laranja { background: #fff7ed; color: #f97316; }
        .stat-icon.verde { background: #ecfdf5; color: var(--success); } .stat-icon.vermelho { background: #fef2f2; color: var(--danger); }
        .stat-info h3 { font-size: 12px; color: var(--gray); text-transform: uppercase; }
        .stat-info .numero { font-size: 28px; font-weight: 700; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-box { background: white; border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
        .chart-box canvas { width: 100% !important; height: 280px !important; }
        .table-box { background: white; border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--gray); text-transform: uppercase; }
        td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
        .badge-success { background: #d1fae5; color: #065f46; } .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; } .badge-info { background: #dbeafe; color: #1e40af; }
        .chamado-item { background: #f8fafc; padding: 16px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-left: 4px solid var(--primary); }
        .chamado-item.critico { border-left-color: var(--danger); background: #fff5f5; }
        .filtros-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filtros-bar select, .filtros-bar input { padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; }
        .filtros-bar input { flex: 1; min-width: 200px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal-overlay.ativa { display: flex; }
        .modal-box { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; }
        .form-group { margin-bottom: 18px; } .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } .sidebar { width: 60px; } .sidebar-title, .sidebar-nav a span, .user-info { display: none; } .main-content { margin-left: 60px; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-laptop-medical"></i></div><div class="sidebar-title"><h2>HelpHosp</h2><span>Painel TI</span></div></div>
    <nav class="sidebar-nav">
        <a class="ativo" onclick="mudarSecao('dashboard', this)"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
        <a onclick="mudarSecao('chamados', this)"><i class="fas fa-ticket-alt"></i><span>Chamados</span></a>
        <a onclick="mudarSecao('equipamentos', this)"><i class="fas fa-desktop"></i><span>Equipamentos</span></a>
        <a onclick="mudarSecao('equipe', this)"><i class="fas fa-users"></i><span>Equipe TI</span></a>
        <a onclick="mudarSecao('config', this)"><i class="fas fa-cog"></i><span>Config</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="userIniciais">JR</div>
        <div class="user-info"><h4 id="userNome"></h4><span id="userCargo"></span></div>
        <button onclick="logout()" style="background:none;border:none;color:#94a3b8;cursor:pointer;margin-left:auto;">🚪</button>
    </div>
</aside>

<main class="main-content">
    <section id="secao-dashboard" class="secao ativa">
        <div class="top-bar"><h1>Dashboard</h1><div><select id="periodoFiltro" onchange="atualizarDashboard()" style="padding:10px;border-radius:10px;"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select></div></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon azul"><i class="fas fa-clipboard-list"></i></div><div class="stat-info"><h3>Total</h3><div class="numero" id="cardTotal">0</div></div></div>
            <div class="stat-card"><div class="stat-icon laranja"><i class="fas fa-clock"></i></div><div class="stat-info"><h3>Abertos</h3><div class="numero" id="cardAbertos">0</div></div></div>
            <div class="stat-card"><div class="stat-icon verde"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3>Concluídos</h3><div class="numero" id="cardConcluidos">0</div></div></div>
            <div class="stat-card"><div class="stat-icon vermelho"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><h3>Críticos</h3><div class="numero" id="cardCriticos">0</div></div></div>
        </div>
        <div class="charts-grid">
            <div class="chart-box"><h3>Setores</h3><canvas id="graficoSetores"></canvas></div>
            <div class="chart-box"><h3>Prioridades</h3><canvas id="graficoPrioridades"></canvas></div>
        </div>
        <div class="table-box"><h3>Resumo</h3><table><thead><tr><th>Setor</th><th>Total</th></tr></thead><tbody id="tabelaResumo"></tbody></table></div>
    </section>

    <section id="secao-chamados" class="secao">
        <h2>Chamados</h2>
        <div class="filtros-bar">
            <select id="filtroStatus" onchange="carregarChamados()"><option value="">Todos</option><option>A Fazer</option><option>Em Andamento</option><option>Concluído</option></select>
            <input type="text" id="buscaChamado" placeholder="Buscar..." onkeyup="carregarChamados()">
        </div>
        <div id="listaChamadosAdmin"></div>
    </section>

    <section id="secao-equipamentos" class="secao"><h2>Equipamentos</h2><div id="listaEquipamentos"></div></section>
    <section id="secao-equipe" class="secao"><h2>Equipe</h2><button class="btn btn-primary" onclick="abrirModalTecnico()">+ Novo</button><div id="tabelaEquipe" style="margin-top:20px;"></div></section>
    <section id="secao-config" class="secao"><h2>Configurações</h2><button class="btn btn-danger" onclick="logout()">Sair</button></section>
</main>

<div class="modal-overlay" id="modalTecnico">
    <div class="modal-box">
        <h3>Novo Técnico</h3>
        <form onsubmit="adicionarTecnico(event)">
            <div class="form-group"><label>Nome</label><input type="text" id="novoNome" required></div>
            <div class="form-group"><label>Usuário</label><input type="text" id="novoUsuario" required></div>
            <div class="form-group"><label>Cargo</label><select id="novoCargo"><option>Técnico</option><option>Analista</option></select></div>
            <p style="color:#f59e0b;">Senha: 12345</p>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-outline" onclick="document.getElementById('modalTecnico').classList.remove('ativa')">Cancelar</button>
        </form>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBXeV-uxTIzF7rCgLTFTCz5zE9WCq2gQgE",
    authDomain: "helphosp.firebaseapp.com",
    projectId: "helphosp",
    storageBucket: "helphosp.firebasestorage.app",
    messagingSenderId: "1075623193163",
    appId: "1:1075623193163:web:cf54ee082d1c97a9aa7bce"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var usuarioLogado = JSON.parse(localStorage.getItem('usuario_logado'));
if (!usuarioLogado) { window.location.href = 'admin.html'; }

var chamados = [], charts = {};

window.onload = function() {
    document.getElementById('userNome').textContent = usuarioLogado.nome;
    document.getElementById('userCargo').textContent = usuarioLogado.cargo;
    db.collection('chamados').orderBy('data_abertura', 'desc').onSnapshot(function(snap) {
        chamados = [];
        snap.forEach(function(doc) { var d = doc.data(); d.firebaseId = doc.id; chamados.push(d); });
        atualizarDashboard();
    });
    carregarEquipe();
};

function mudarSecao(s, el) {
    document.querySelectorAll('.sidebar-nav a').forEach(function(a) { a.classList.remove('ativo'); });
    document.querySelectorAll('.secao').forEach(function(x) { x.classList.remove('ativa'); });
    el.classList.add('ativo');
    document.getElementById('secao-' + s).classList.add('ativa');
    if (s === 'chamados') carregarChamados();
}

function atualizarDashboard() {
    var f = chamados;
    document.getElementById('cardTotal').textContent = f.length;
    document.getElementById('cardAbertos').textContent = f.filter(function(c) { return c.status !== 'Concluído'; }).length;
    document.getElementById('cardConcluidos').textContent = f.filter(function(c) { return c.status === 'Concluído'; }).length;
    document.getElementById('cardCriticos').textContent = f.filter(function(c) { return c.prioridade === 'Crítica'; }).length;
    var porSetor = {}, porPrio = {};
    f.forEach(function(c) { porSetor[c.setor] = (porSetor[c.setor] || 0) + 1; porPrio[c.prioridade || 'Média'] = (porPrio[c.prioridade || 'Média'] || 0) + 1; });
    Object.values(charts).forEach(function(c) { if (c) c.destroy(); });
    var ctx1 = document.getElementById('graficoSetores');
    if (ctx1) charts.setores = new Chart(ctx1, { type: 'doughnut', data: { labels: Object.keys(porSetor), datasets: [{ data: Object.values(porSetor), backgroundColor: ['#4f46e5','#10b981','#f59e0b','#ef4444','#3b82f6'] }] } });
    var ctx2 = document.getElementById('graficoPrioridades');
    if (ctx2) charts.prioridades = new Chart(ctx2, { type: 'pie', data: { labels: Object.keys(porPrio), datasets: [{ data: Object.values(porPrio), backgroundColor: ['#10b981','#f59e0b','#f97316','#ef4444'] }] } });
    document.getElementById('tabelaResumo').innerHTML = Object.entries(porSetor).map(function(e) { return '<tr><td>' + e[0] + '</td><td>' + e[1] + '</td></tr>'; }).join('');
}

function carregarChamados() {
    var sf = document.getElementById('filtroStatus').value;
    var f = chamados.filter(function(c) { return !sf || c.status === sf; });
    document.getElementById('listaChamadosAdmin').innerHTML = f.map(function(c) {
        return '<div class="chamado-item"><div><strong>' + c.titulo + '</strong><br><small>' + c.protocolo + ' | ' + c.setor + '</small></div><span class="badge badge-info">' + c.status + '</span></div>';
    }).join('') || '<p>Nenhum chamado</p>';
}

function carregarEquipe() {
    db.collection('usuarios').get().then(function(snap) {
        var html = '<table><tr><th>Nome</th><th>Usuário</th></tr>';
        snap.forEach(function(doc) { var d = doc.data(); html += '<tr><td>' + d.nome + '</td><td>' + d.usuario + '</td></tr>'; });
        html += '</table>';
        document.getElementById('tabelaEquipe').innerHTML = html;
    });
}

function abrirModalTecnico() { document.getElementById('modalTecnico').classList.add('ativa'); }

function adicionarTecnico(e) {
    e.preventDefault();
    db.collection('usuarios').add({
        nome: document.getElementById('novoNome').value,
        usuario: document.getElementById('novoUsuario').value.toLowerCase(),
        senha: '12345',
        cargo: document.getElementById('novoCargo').value,
        tipo: 'tecnico',
        status: 'ativo',
        primeiro_acesso: true
    }).then(function() {
        alert('✅ Técnico cadastrado!');
        document.getElementById('modalTecnico').classList.remove('ativa');
        carregarEquipe();
    });
}

function logout() { localStorage.removeItem('usuario_logado'); window.location.href = 'admin.html'; }
</script>
</body>
</html>
